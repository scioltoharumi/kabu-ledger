# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "確認できず（カバー無しの可能性が高い）。株予報のアナリスト予想ページ（https://kabuyoho.jp/sp/reportAnalyst?bcode=6533、
    2026-10-09 取得）はコンセンサス欄（売上高・営業利益・当期利益、現在／1週間前／4週間前）が全て「--」で、会社予想
    （売上 17,500・営業利益 1,600 百万円）のみ表示。みんかぶ（https://minkabu.jp/stock/6533/analyst_consensus、2026-10-09）は
    403 で取得できず。FISCO の企業調査レポート（Research Memo、2026-03-27 付）は存在するが、会社委託のレポートであり
    独立したコンセンサスではないため数値は載せない。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。IFRS・12月決算。報告セグメントは DM（デジタルマーケティング）／DX（デジタルトランス
      フォーメーション）／IP・エンタメ＋その他 の3区分で、上期（2026-01〜06）実績が短信で開示済みなので
      『上期実績 × (1 + 下期/上期 比率)』＝上期＋下期 で各セグメントの通期を組み、2026-05-29 に株式取得した SALTO（システム開発・約230名）を
      DX とは別建てで下期に乗せる。会社計画は売上 17,500・営業利益 1,600 百万円（前期比 +11.0%・+10.9%。2026-02-13 公表、
      2Q 時点で修正無し。SALTO 取得前に置かれた計画で、取得に伴う修正は『重要な影響が判明したら開示』のまま）。
      上期実績は売上 7,798（+0.1%）・営業利益 873（+26.7%、計画進捗 54.6%）。売上が横ばいなのは DX が利益率重視の
      プロダクトミックス転換で -2.2%、その他（人材紹介）が -33.7% だったため。推定売上は会社計画をやや下回り、営業利益は
      上回る形になる。急所は (1) 営業利益率をどこに置くか（上期 11.2%、会社計画の含意は下期 7.5%、FY2025 と同じ上期比率なら
      通期 約1,830）、(2) SALTO の下期寄与月数と利益率、(3) DM の下期の伸び。3Q 決算（2026-11-13 予定）で SALTO 込みの
      DX 売上と通期計画の修正有無が分かるので、そこで置き直す前提。
      注意: 同社は 2024〜25 年に DM の大型失注と DX 不振で利益成長が鈍化した経緯があり（2Q 資料 p8）、短信も DX を
      『リカバリ期』と位置づけている。のれん 6,886 百万円は資本 7,257 百万円に対し 0.95 倍（2Q 資料 p24）。IFRS で償却は無いが
      減損リスクは営業利益の外側にある。
      出典: 2026年12月期 第2四半期（中間期）決算短信〔IFRS〕 https://www2.jpx.co.jp/disc/65330/140120260812518641.pdf
      ／FY2026.Q2 決算説明資料 https://www2.jpx.co.jp/disc/65330/140120260814520676.pdf
      ／SALTO の株式取得（連結子会社化）に関するお知らせ https://ssl4.eir-parts.net/doc/6533/tdnet/2823690/00.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "DM事業（デジタルマーケティング）"
          expr: "h1_dm_revenue * (1 + h2_over_h1_dm)"
          vars:
            h1_dm_revenue:
              value: 2922
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/65330/140120260812518641.pdf（2026-10-09取得）"
              note: "2026年12月期 中間期の DM 事業売上収益 2,922,113 千円（短信 p2・セグメント情報 p14。セグメント間 2,768 千円を含む合計）。
                前年同期 2,756 → +6.0%。四半期では Q1 1,583（+3.8%）・Q2 1,339（+8.8%）（2Q 資料 p15）"
            h2_over_h1_dm:
              value: 1.07
              basis: assumed
              note: "下期/上期 の比率。FY2025 は上期 2,756 → 下期 2,948（Q3 1,436＋Q4 1,512、2Q 資料 p15 グラフ値）で 1.070。
                DM は Q1 が高く Q2 が季節的に落ちる（『例年、Q2 は季節性の影響により Q1 比で減少』）ため下期は上期より高くなる。
                会社は『2025年下半期の勢いを加速して成長』（2Q 資料 p27）・AI 検索最適化（LLMO）コンサルや TikTok Shop 運用支援の
                受注獲得を挙げるが、上期の着地は『概ね計画通り』で上振れではないため前年と同じ比率を置いた。
                下期 約3,127（前年同期比 +6.1%＝上期と同じ伸び）、通期 約6,049（+6.1%）。感度上位の変数"
        - name: "DX事業（既存グループ・SALTO除く）"
          expr: "h1_dx_revenue * (1 + h2_over_h1_dx)"
          vars:
            h1_dx_revenue:
              value: 3723
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/65330/140120260812518641.pdf（2026-10-09取得）"
              note: "中間期の DX 事業売上収益 3,723,720 千円（短信 p2・p14。セグメント間 31,353 千円を含む合計）。前年同期 3,806 → -2.2%。
                四半期は Q1 1,856・Q2 1,867（2Q 資料 p16）。会社は『利益率を意識したプロダクトミックスの転換により売上高は下がったが
                収益性が向上』（セグメント利益 +26.1%）と説明。SALTO（株式取得 2026-05-29）の P/L が 6 月分として上期に入っているかは
                短信・説明資料に明記が無い。Q2 売上が Q1 比 +11 に留まること・Q2 資料が SALTO 寄与を『下半期』と書くことから、
                上期にはほぼ入っていないと読んだ（入っていれば下の SALTO 行と約1か月分 ≒220 が二重計上になる。全体の 1.3%）"
            h2_over_h1_dx:
              value: 1.00
              basis: assumed
              note: "下期/上期 の比率。FY2025 の四半期売上は 1,909／1,897／1,902／1,905 と季節性なくほぼ一定（2Q 資料 p16）で、
                FY2025 の下期/上期は 3,807/3,806 ＝ 1.00。FY2026 上期も 1,856／1,867 で横ばい。会社がミックス転換を『引き続き推進』
                と言うので回復は織り込まず、横ばいを置いた。下期 3,723（前年同期比 -2.2%）、通期 約7,446（-2.2%）"
        - name: "SALTO（2026-05-29 株式取得・下期から連結）"
          expr: "salto_fy_revenue / 12 * salto_months_h2"
          vars:
            salto_fy_revenue:
              value: 2600
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6533/tdnet/2823690/00.pdf（2026-10-09取得）"
              note: "SALTO の 2026年8月期 着地見込み売上高 2,600 百万円（営業利益 260、同お知らせ ※2）。実績は 2023/8 期 2,032 →
                2024/8 期 2,048 → 2025/8 期 2,265（営業利益 6 → 16 → 116）。2026年3月末時点の 7 か月で売上 1,531・営業利益 192
                （月平均 219・利益率 12.5%）と開示されており、月 217（＝2,600/12）の置き方と整合する。
                日本・ベトナム（ホーチミン・ダナン）のハイブリッド開発、顧客は防衛・AI・社会インフラ等"
            salto_months_h2:
              value: 6
              basis: assumed
              note: "下期（2026-07〜12）に連結される月数。株式取得日 2026-05-29 なので最大 7 か月（6 月分を含む）だが、上の DX 行の
                note のとおり 6 月分が上期 P/L に入っていないと読める（みなし取得日を 6 月末としたと推定）ので、下期の 6 か月だけを
                別建てにした。グループ内取引の消去・SALTO 側の季節性は不明のため無視。寄与 約1,300。
                一次情報でみなし取得日を確認できていない（3Q 短信の企業結合注記で確認する）"
        - name: "IP・エンタメ事業＋その他"
          expr: "h1_ip_other_revenue * (1 + h2_over_h1_ip)"
          vars:
            h1_ip_other_revenue:
              value: 1218
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/65330/140120260812518641.pdf（2026-10-09取得）"
              note: "中間期の IP・エンタメ事業 900,781 千円（+5.3%。ゲーム企画開発・占いサービス・自社 IP）＋その他 317,469 千円
                （-33.7%。タレントマネジメント SaaS『スキルナビ』・人材紹介）＝ 1,218（短信 p2〜3・p14。セグメント間計 約24 を含む）。
                前年同期 1,334 → -8.7%。四半期は Q1 636・Q2 581（2Q 資料 p18。Q2 は人材紹介の売上が前年同期比 -79）"
            h2_over_h1_ip:
              value: 0.98
              basis: assumed
              note: "下期/上期 の比率。FY2025 は上期 1,334 → 下期 1,309（Q3 658＋Q4 651、2Q 資料 p18）で 0.981。IP 側はアイドル
                プロデュース（Honey devil、2026-10-07 に佐藤綺星の所属を発表＝fetch_news 見出し）とゲーム開発で成長を見込むが、
                その他側の人材紹介の減収が Q2 に拡大しており、両者を相殺して前年と同じ比率を置いた。下期 約1,194、通期 約2,412（-8.7%）"
        - name: "セグメント間消去（連結調整）"
          expr: "h1_elimination * annualize_elimination"
          vars:
            h1_elimination:
              value: -65
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/65330/140120260812518641.pdf（2026-10-09取得）"
              note: "中間期のセグメント間売上の消去 △65,172 千円（短信 p14 調整額）。上の各セグメントはセグメント間を含む『合計』を
                使っているので、ここで差し引く。前年同期は △103,245 千円、FY2025 通期は △190（2Q 資料 p21 の『連結調整』）"
            annualize_elimination:
              value: 2.0
              basis: assumed
              note: "上期分を2倍して通期とした。FY2025 は上期 △103・下期 △87 で下期の方が小さく、FY2026 上期は △65 と前年より
                縮小。SALTO 連結で DX 内の取引が増える可能性はあるが金額不明。全体の 1% 未満で感度は小さい"
    profit:
      op_margin:
        value: 0.10
        basis: assumed
        note: "通期の営業利益率。手がかり: 上期実績 11.2%（873÷7,798、fundamentals の採用値 Q1 590＋Q2 283 とも一致）、
          FY2025 通期 9.15%（上期 8.8%・下期 9.4%）、会社計画 9.14%（1,600÷17,500）。会社計画は上期進捗 54.6% のまま据え置かれて
          おり、含意される下期は 727（下期売上を当推定の 9,700 弱とすると 7.5%）とかなり保守的。
          一方 FY2025 と同じ上期比率（47.8%）を当てはめると通期 約1,830（10.7%）。
          積み上げでは、既存事業の下期は前年 9.4% に上期の改善幅（売上総利益率 +3.4pt・営業利益率 +2.4pt）の一部が残るとして
          10.5% 前後（約8,000 × 10.5% ≒ 840）、SALTO は自社見込み 10%（直近 7 か月は 12.5%）から PPA 無形資産の償却・統合費用を
          差し引いて 8% 前後（1,300 × 8% ≒ 100）、合計 下期 約940 → 通期 約1,810。
          ただし会社が計画を上げない理由（DX の『採用および M&A を通じた人的基盤の拡充』コスト、Q2 単独は 7.5% まで落ちた季節性、
          人材紹介の減収）を織り込み、積み上げ値と会社計画の間の 10.0% を置いた（通期 約1,710、会社計画比 +7%）。
          一次情報で下期の費用計画は確認できておらず、最も振れる仮定。1,600〜1,830 の幅で見るのが実態"
