# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し。株予報のアナリスト予想ページ（https://kabuyoho.jp/sp/reportAnalyst?bcode=6888、2026-10-09 取得）で
    コンセンサス経常利益・増益率は「--」（1週間前・4週間前も同じ）、対象アナリスト数・レーティング・目標株価の掲載なし。
    同ページの「アナリスト業績予想」表に載る 2027/06 予（売上 8,000・営業利益 700・経常 700・純利益 430）は
    会社予想と同値で、独立したアナリスト予想ではない。東証スタンダード・時価総額 50億円弱（2026/06 末 4,626 百万円、
    決算補足説明資料 p16）の銘柄で、比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-06"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/6888.md 未作成の段階）。報告セグメントは
      ITソリューション（SI・ソフト開発、消防防災＝消防通信指令システム、GIS。官公庁・製造業中心。子会社 プライムシステムデザイン
      ＝PSD、システムズサービス＝SYS を含む）／ITインフラ（茨城地区の官公庁向け基盤・ネットワーク構築）／
      ITサービス（第三者保守・病院情報システム維持管理・BPO）の3つ。外部売上ベース（FY2026-06: 4,790＋1,333＋1,376＝7,499）で組む。
      前期 FY2026-06 の売上 7,499（+16.8%）には一過性が2つ乗っている: (1) PSD の決算期変更（3月→6月）で15か月分を連結
      （PSD の当期売上 831 は15か月分）、(2) SYS を 2026-01-01 みなし取得で6か月分だけ連結。FY2027 は (1) が剥落し (2) が
      12か月になるので、まず前期からこの2つを外した『コア』を作り、そこに成長率を掛け、PSD 12か月分と SYS 12か月分を足し戻す。
      会社計画は売上 8,000・営業利益 700・経常 700（+6.7%・+33.5%・+32.3%）、セグメント別（内部取引込み）は
      ITソリューション 5,400（+10.7%）・ITインフラ 1,200（▲10.0%）・ITサービス 1,500（+8.9%）、営業利益 450／180／100。
      当推定は売上で計画にほぼ並び、営業利益率は計画の 8.75% に届かない 7.8% と置いた（理由は profit の note）。
      前期も当初計画 営業利益 700 → 4/30 に 450 へ下方修正 → 着地 524 と、利益計画は外している（決算補足説明資料 p6）。
      1Q（2026-07〜09）決算は 2026-10-30 予定（master.yaml next_earnings）。ただし同社は国内法人顧客の3月決算に合わせて
      3Q（1〜3月）に売上が集中し 1Q は毎年薄い（FY2026 1Q は営業損失 ▲30）ので、1Q だけでは通期の当否は読めない。
      SYS は 2026-10-01 にアクモス本体へ吸収合併済み（金融ソリューション事業部として承継）だが、セグメントは ITソリューションのまま。
      ニュース（fetch_news 90日）: 2026-08-04 株探『今期経常は32％増で4期ぶり最高益更新へ』、2026-08-19 合併の法定事前開示、
      2026-09-03 株主総会招集通知。業績に効く新規材料は決算以外に無い。
      出典: 2026年6月期 決算短信 https://www.acmos.co.jp/images/information/979/IRN20260804-01.pdf
      ／2026年6月期 決算補足説明資料・2027年6月期 経営計画 https://www.acmos.co.jp/images/information/980/IRN20260804-02.pdf
      ／第35期 有価証券報告書 https://www.acmos.co.jp/images/ir/library/293/IRL20260924-01.pdf
      ／連結子会社の決算期変更に関するお知らせ https://www.acmos.co.jp/images/information/946/IRN20260115-02.pdf
      ／システムズサービスの株式取得に関するお知らせ https://www.acmos.co.jp/images/information/945/IRN20260115-01.pdf
      ／臨時報告書（吸収合併、SYS の2025年12月期実績）https://disclosure2dl.edinet-fsa.go.jp/searchdocument/pdf/S100Y07O.pdf
      ／業績予想の修正に関するお知らせ（2026-04-30）https://www.acmos.co.jp/images/information/964/IRN20260430-03.pdf
      ／子会社の吸収合併完了及び組織変更に関するお知らせ https://www.acmos.co.jp/images/information/990/IRN20261001-01.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "ITソリューション事業（コア＋PSD＋SYS）"
          expr: "itsol_core_base * (1 + itsol_core_growth) + psd_annual_revenue + sys_annual_revenue"
          vars:
            itsol_core_base:
              value: 3601
              basis: assumed
              note: "FY2026-06 の ITソリューション外部売上 4,790（決算短信 p18 セグメント情報、有報『販売実績』4,790,276千円）から、
                PSD の15か月分売上 831（有報『関係会社の状況』注5: 連結会社相互間の内部売上を除く売上高 831 百万円）と
                SYS の6か月分 358（下記 sys_annual_revenue 716 の半分と仮定。短信『企業結合等関係』: 連結に含まれる業績の期間は
                2026-01-01〜06-30）を引いた値 ＝ 4,790 − 831 − 358 ＝ 3,601。アクモス本体＋ASロカスの12か月分に相当する。
                SYS の半期配分（SES は月次の人月課金が主で季節性が小さいとみて均等按分）は一次情報で確認できていない。
                感度で最も効く変数"
            itsol_core_growth:
              value: 0.08
              basis: assumed
              note: "受注残高が前期末比 +39.6% の 1,630（有報『受注実績』。消防通信指令システム中心。受注高 5,253、+23.8%）で、
                FY2026 に全国5か所へ納入した消防防災が FY2027 も続く前提。会社のセグメント計画 5,400（内部取引込み。
                外部ベースなら前期の内部売上 88 を引いて約 5,310）から PSD 12か月分 665 と SYS 716 を外すと、コア部分は
                3,929 ＝ 3,601×1.091 で、計画はコア +9% を含意する。中計の ITソリューション増収率目標は 15% 以上（補足資料 p18）
                だが前期の計画未達を踏まえ、含意値より少し下の +8% と置いた。受注残 1,630 のうち FY2027 内に売上化する比率は
                開示が無い（消防通信指令システムは複数年度の案件）。感度上位"
            psd_annual_revenue:
              value: 665
              basis: assumed
              note: "PSD（プライムシステムデザイン、80%子会社、システム受託開発・SES）の FY2026 連結売上 831 は
                決算期変更で 2025-04-01〜2026-06-30 の15か月分（決算期変更のお知らせ・有報『連結子会社の事業年度等』）。
                12か月換算 831×12/15 ＝ 665 を、FY2027 は横ばいと置いた。PSD の前年（12か月）売上は連結売上の10%未満で
                有報に開示が無く、成長率が置けないため横ばい。15か月の内訳（月次の偏り）も未開示。会社は決算期変更の
                『影響は軽微』と注記しているが、剥落する3か月分は約 166 で売上 +6.7% 計画の3分の1に相当するため、
                この剥落を無視すると増収率を過大に読む"
            sys_annual_revenue:
              value: 716
              basis: disclosed
              source: "https://disclosure2dl.edinet-fsa.go.jp/searchdocument/pdf/S100Y07O.pdf（臨時報告書 2026-04-22、2026-10-09取得）"
              note: "SYS（システムズサービス、金融機関向け SES）の 2025年12月期 売上高 716・営業利益 20・経常利益 31
                （2023/12 期 675、2024/12 期 696 と年 +3% 前後で安定）。FY2027 は 2026-07〜2027-06 の12か月がフル寄与する。
                成長を乗せず 2025 年実績のまま置いた（合併後の統合で人員流出があれば下振れ、顧客業種多様化の営業強化が
                効けば上振れ。どちらも一次情報なし）。前期の連結 6か月分（推定 358）との差 +358 が FY2027 の増収要因になる"
        - name: "ITインフラ事業（期首受注残＋期中受注・期中売上）"
          expr: "infra_backlog_start + infra_inyear_sales"
          vars:
            infra_backlog_start:
              value: 417
              basis: disclosed
              source: "https://www.acmos.co.jp/images/ir/library/293/IRL20260924-01.pdf（第35期 有価証券報告書 p19 受注実績、2026-10-09取得）"
              note: "FY2026-06 末の ITインフラ受注残高 416,854千円（前期末比 ▲27.2%）。当期受注案件の多くが期中に完了したことと
                官公庁案件の入札時期の関係で減った（補足資料 p12）。受注残は原則 FY2027 内に売上化すると置いた
                （構築案件は短期が多い。FY2026 は期首残 571 ＋ 受注 1,177 − 期末残 417 ＝ 売上 1,332 と整合）"
            infra_inyear_sales:
              value: 760
              basis: assumed
              note: "期中に受注して期中に売上化する分。受注実績から逆算すると FY2025 は 1,044 − 期首残 596 ＝ 448、
                FY2026 は 1,332 − 期首残 571 ＝ 761（期首残は全額その期に売上化したと仮定した上限寄りの逆算。
                期首残 571 ＝ 417÷(1−0.272)、596 ＝ 1,044 − 1,019 ＋ 571 で、受注高の前年比 15.5% から FY2025 受注 1,019 を導出）。
                会社計画 1,200 は 417 ＋ 783 を含意し、会社自身が『大型案件が減る見込み』（補足資料 p22）としている。
                FY2026 並みの 760 と置いた（計画比やや下）。茨城地区の官公庁 DX・LGWAN 案件の入札時期で振れる"
        - name: "ITサービス事業（第三者保守・病院情報システム維持管理・BPO）"
          expr: "itsvc_fy26_revenue * (1 + itsvc_growth)"
          vars:
            itsvc_fy26_revenue:
              value: 1376
              basis: disclosed
              source: "https://www.acmos.co.jp/images/information/979/IRN20260804-01.pdf（2026年6月期 決算短信 p18 セグメント情報、2026-10-09取得）"
              note: "FY2026-06 の ITサービス外部売上 1,376,366千円（前期比 ▲1.3%）。第三者保守（フィールドワン）が受注遅延・解約で
                伸び悩み、BPO は3期ぶり増収、病院情報システム維持管理（アクモスメディカルズ）は新規病院稼働で堅調"
            itsvc_growth:
              value: 0.07
              basis: assumed
              note: "受注残高が前期末比 +58.2% の 905（有報 受注実績。受注高 1,709 で受注高÷売上高 1.24）。ただし増加分は
                『複数年度案件の受注等』（補足資料 p13）で、FY2027 内に売上化する比率は開示が無い。会社計画は +8.9%（1,500）、
                中計の目標は +5% 以上。前期が減収だったことと複数年度分の繰り延べを踏まえ、計画と中計目標の間の +7% と置いた。
                第三者保守は 2026-04 に経営体制を刷新し赤字解消に取り組む段階で、売上の回復時期は未確認"
    profit:
      op_margin:
        value: 0.078
        basis: assumed
        note: "FY2026-06 実績 7.0%（524÷7,499、fundamentals 採用値）と会社計画 8.75%（700÷8,000）の間。
          過去は FY2024-06 10.6%・FY2025-06 9.1%・FY2026-06 7.0% と3期連続で低下（fundamentals）。
          積み上げの考え方: 前期 7.0% を起点に、(＋) ITサービスの第三者保守が営業損失から脱する会社計画（セグメント利益 45→100、
          +55 ≒ +0.7pt）、(−) PSD の3か月分剥落で経常 95（15か月分）の 1/5 ≒ 19 が消える（▲0.25pt）、
          (−) SYS フル寄与は営業利益率 3%（20÷716）でのれん償却 21/年（211 を10年均等）が年間化すると増分はほぼ相殺、
          (±) 消防防災の機器・資材調達コスト上昇が FY2026 の利益を削った主因（4/30 修正のお知らせ）で、会社は
          『プロジェクト管理の改善により収益性の向上』を掲げるが定量根拠は無い。会社計画の ITソリューション 営業利益 334→450
          （+34.5%）はこの改善を大きく織り込んでおり、前期 700→524 の未達実績を踏まえて半分程度しか見ず、7.8% と置いた。
          全社費用（調整額）▲68 は前期と同水準を前提。感度は売上側と同程度に効く（営業利益は売上×利益率なので +10% で +10%）"
