# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "証券アナリストのコンセンサスは確認できず。みんかぶのアナリスト予想ページ（https://minkabu.jp/stock/9246/analyst_consensus、
    2026-10-09）は取得が 403 で拒否され有無を確かめられていない。株予報（https://kabuyoho.jp/sp/report?bcode=9246、2026-10-09）は
    『コンセンサス予想』欄に数値が無く会社予想（売上 6,600・営業利益 500 百万円、2026-09-28 時点）のみ。フィスコの企業調査レポート
    （https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/phd20260916.pdf、2026-09-16 付・2026-10-09 取得）は会社の委託に
    よる客員アナリストのレポートで独自予想値を置かず『会社計画は保守的で上振れ余地あり』との定性評価のみ＝コンセンサスではない。
    東証グロース・時価総額 100 億円前後でカバーは無い可能性が高いが未確認。比較対象は会社計画のみ。
    なお 2026-09-28 にテクノプロ・ホールディングス子会社 TX1 による TOB（1株 2,200 円・期間 2026-09-29〜11-11・成立後は上場廃止予定）
    が公表され会社は賛同・応募推奨を表明しているため、新規にカバーが付く見込みも薄い"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。報告セグメントは3つ（デジタルトランスフォーメーション事業＝コンサルティング／
      DX×テクノロジー事業＝エンジニア常駐／DX×HR事業＝産業医・保健師サービス）。上期（2026-01〜06）は短信の実績値を置き、
      下期（07〜12）だけを KPI の掛け算で推定する（会社自身が『下期偏重』と説明する業績構造で、推定の急所が下期にあるため）。
      会社計画は売上 6,600・営業利益 500 百万円（前期比 +20.3%・+221%）で 2Q 短信（2026-08-14）時点で据え置き。上期進捗は売上 48.2%・
      営業利益 15.6%（77.9÷500）。計画達成には下期に営業利益 423（下期売上計画 3,420 に対し 12.4%）が必要で、これは FY2023 下期
      （13.7%）以来の水準。当推定は売上は計画をやや上回る一方、営業利益率は 5.5% にとどまるとみて計画を下回る。
      **重要な前提の変化**: 2026-09-28 にテクノプロ・ホールディングス（子会社 TX1）による TOB が公表され（1株 2,200 円、前日終値比
      +92.6%、期間 2026-09-29〜11-11、下限 3,554,400 株、SBI・土井 CEO・DY投資事業有限責任組合1号の3者が計 59.27% の応募契約、
      完全子会社化が目的で成立後は上場廃止予定。会社は賛同・応募推奨）。成立すれば FY2026-12 の通期決算は上場会社として公表され
      ない可能性があり、この推定の答え合わせ（estimate.py が fundamentals の実績と突き合わせる）は 3Q（2026-11-12 予定）までで
      止まり得る。TOB 関連開示に業績予想の修正が含まれるかは未確認（会社の賛同意見表明プレスは未読。10-06 の変更お知らせは
      公取委の待機期間短縮に伴う届出書訂正のみで業績には触れない。10-09 の変更お知らせは取得できず内容未確認）。
      出典: 2026年12月期 第2四半期決算短信 https://www2.jpx.co.jp/disc/92460/140120260813520036.pdf
      ／同 決算説明資料 https://www2.jpx.co.jp/disc/92460/140120260814520474.pdf
      ／フィスコ企業調査レポート（2026-09-16）https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/phd20260916.pdf
      ／TOB: 日本M&Aセンター TOB情報 https://www.nihon-ma.co.jp/news/20260928_9246-11/ ・M&A Online https://maonline.jp/tobnews/2026_074a
      ・株探 2026-09-29『プロHD---ストップ高買い気配、テクノプロ・HDによるTOBに賛同』https://kabutan.jp/stock/news?code=9246&b=n202609290398
      ・（変更）公開買付届出書の訂正届出書の提出に伴うお知らせ（2026-10-06）https://www2.jpx.co.jp/disc/92460/140120261005546212.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "デジタルトランスフォーメーション事業（コンサルティング・マーケティング・UIscope）"
          expr: "h1_dx_revenue + h2_billable_fte * h2_utilization * h2_unit_price * 6 * dx_gross_up"
          vars:
            h1_dx_revenue:
              value: 2286.8
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/92460/140120260813520036.pdf（2026-10-09取得）"
              note: "2026年12月期中間期の外部顧客に対する売上高 2,286,820 千円（短信 p12 セグメント情報。前年同期比 +18.8%）。
                内訳はコンサルティング 2,223・マーケティング 42・UIscope 22。四半期では 1Q 1,203・2Q 1,083（説明資料 p5。
                2Q は季節性で稼働率が落ち減収）。1Q+2Q の連結売上 1,635+1,545 は fundamentals の採用値（status OK）と一致"
            h2_billable_fte:
              value: 212
              basis: assumed
              note: "下期の稼働対象人月（社内コンサルタントの月平均人数、人月/月）。実績は 1Q 180 → 2Q 193（説明資料 p13。期初計画の
                通期平均は 214）。会社は『採用の進捗により下期も積み上げが続く』とする一方『退職者数が計画を上回って推移』（p13-14）。
                DX事業の従業員数は 1Q末 192 → 2Q末 216 名（p32、+12.5%）で、休職・研修中など稼働対象外を 5% 程度と見ると 2Q末時点の
                稼働対象は約 205。この後も四半期ネット +8〜10 名の増員が続くとして 3Q 約 208・4Q 約 217、下期平均 212 と置いた。
                期初計画の通期平均 214 を達成するには下期平均 約 242 が必要で、そこまでは届かないとみた。感度上位（下期売上の主変数）"
            h2_utilization:
              value: 0.96
              basis: assumed
              note: "下期の稼働率（総稼働人月÷延べ稼働対象人月）。2Q は季節性で 87% に低下、上期平均は『期初計画の通期平均 94% と同水準』
                （説明資料 p13。逆算で 1Q は約 101%）。会社は下期は『アサイン進捗により回復見込み』。前年の下期（FY2025 3Q・4Q）も
                上期より高い水準に戻っている（p13 グラフ）。大量の新人がアサインされ切るまで 1Q の 100% 超には戻らないとみて 96% とした。
                ±2pt で下期 DX 売上が ±55 動く"
            h2_unit_price:
              value: 1.68
              basis: assumed
              note: "下期のコンサルタント単価（百万円/人月）。実績は 1Q 1,679 千円 → 2Q 1,657 千円、上期平均 約 1,668 千円（前年同期比
                +5.6%。説明資料 p13）。期初計画の通期平均は 1,683 千円。『適正単価方針』で前年同期比では着実に改善しているため、
                上期平均と計画の間の 1,680 千円と置いた"
            dx_gross_up:
              value: 1.30
              basis: assumed
              note: "DX事業売上 ÷ 社内コンサルタント売上 の倍率。協働パートナー（外注）が担う売上と、マーケティング・UIscope の売上が
                上乗せされる。上期の実績から導出: 社内コンサルタント売上 ≒ (180×1.01×1.679 + 193×0.87×1.657)×3 ≒ 1,750 に対し
                DX事業売上 2,287 → 1.307。外注費の対売上比率は FY2024 の 44.5% から 17.3% へ低下（説明資料 p7）し、会社は低位維持を
                掲げるため下期も同程度の 1.30 と置いた。1Q の稼働率を上期平均からの逆算で置いているため、この倍率の精度は ±0.03 程度"
        - name: "DX×テクノロジー事業（エンジニア常駐・アルトワイズ）"
          expr: "h1_tech_revenue + h2_avg_engineers * h2_engineer_price * 6"
          vars:
            h1_tech_revenue:
              value: 746.8
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/92460/140120260813520036.pdf（2026-10-09取得）"
              note: "中間期の外部顧客に対する売上高 746,751 千円（短信 p12。前年同期比 +19.4%）。四半期では 1Q 365・2Q 381
                （説明資料 p5。2Q は前四半期比 +4.4%・前年同期比 +22.5%）"
            h2_avg_engineers:
              value: 200
              basis: assumed
              note: "下期の平均エンジニア数（プロパー＋協働パートナー）。2Q の売上 381 ÷ 3か月 ÷ 単価 679 千円 ≒ 187 名が 2Q 平均
                （会社の単価定義『売上高÷平均エンジニア数』から逆算。説明資料 p15）。プロパーの期末エンジニア数は FY2024 1Q から
                9四半期連続で増加し 2Q末 138 名（p15）。四半期 +5〜7% の増員が続くとして 3Q 平均 約 195・4Q 約 205、下期平均 200 と置いた。
                前年の下期/上期は 1.05 倍だったが、今期は採用加速で 1.09 倍を見込む形"
            h2_engineer_price:
              value: 0.68
              basis: assumed
              note: "下期のエンジニア単価（百万円/人月）。2Q 679 千円（前四半期比 +2.9%。説明資料 p15。1Q は『比較的高単価な案件が
                一部終了』で 660 千円に低下していた）。『商流の上位化などによる収益性の高い案件』の獲得が続くとの短信記述を受け、
                2Q と同水準の 680 千円で据え置いた（上昇は織り込まない）"
        - name: "DX×HR事業（産業医・保健師サービス・Dr.健康経営）"
          expr: "h1_hr_revenue * (1 + h2_over_h1_hr)"
          vars:
            h1_hr_revenue:
              value: 146.6
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/92460/140120260813520036.pdf（2026-10-09取得）"
              note: "中間期の外部顧客に対する売上高 146,555 千円（短信 p12。前年同期比 +44.5%）。説明資料のセグメント売上（総額表示）
                は 1Q 66・2Q 80 で短信の純額とほぼ一致"
            h2_over_h1_hr:
              value: 1.15
              basis: assumed
              note: "下期売上 ÷ 上期売上。サービス提供件数は 1Q 526 → 2Q 563 件/月（+7%）、取引単価は 2Q 76 千円/月（エンタープライズ
                案件獲得で上昇）、産業医・保健師ともに新規契約件数が過去最高（説明資料 p16）。2Q 単体 80 を起点に四半期 +6% の積み上げ
                （3Q 約 85・4Q 約 90 → 下期 約 175）として 1.19、単価の『特殊要因の反動』もあるため 1.15 に丸めた。全社売上の 5% 弱で
                営業利益への感度は小さい。会社計画の DX×HR 240（フィスコレポート p6、総額ベース）は上期 146.6 で既に 61% 進捗しており、
                超過がほぼ確実"
    profit:
      op_margin:
        value: 0.055
        basis: assumed
        note: "通期の営業利益率。上期実績 2.4%（77.9÷3,180。fundamentals 採用値では 1Q 5.2%・2Q -0.46%）。会社計画 7.6%（500÷6,600）は
          下期に 12.4%（423÷3,420）を要するが、直近の四半期営業利益率は FY2025 3Q 3.95%・4Q 6.17%・FY2026 1Q 5.2%（fundamentals 採用値）
          で、1Q は稼働率約 101%・単価 1,679 千円という好条件でも 5.2% にとどまった。下期の改善要因は (a) 稼働率 87%→96% への回復、
          (b) 新卒研修期間の人件費計上（2Q）の剥落、(c) オフィス有効活用で地代家賃が下期以降さらに削減（説明資料 p9）、(d) 増収による
          販管費率の希薄化。1Q を起点に下期の四半期売上 約 1,830（+12%）・原価率 58%（1Q 58.9%・2Q 60.9%、単一ソース※）・販管費が
          1Q 比 +5% と置くと下期営業利益率は約 8%、下期営業利益 約 300、通期 約 380 → 通期率 約 5.5%。計画の 500 に届くには原価率 56%・
          販管費横ばいが同時に要る。フィスコは『期初予想は保守的で上振れ余地』とするが根拠は前期の上方修正実績のみ。
          営業利益の感度では定義上この変数が最大で、売上側より率の水準そのものを疑うべき（4〜7% のどこに落ちるかで営業利益は 270〜480）。
          ※原価率・販管費率は fundamentals で SINGLE_SOURCE（照合不成立）の参考値"
