# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し。株予報（https://kabuyoho.jp/reportTop?bcode=7807、2026-10-09 取得）はコンセンサス経常利益・アナリスト
    比較・目標株価がいずれも「--」で、会社予想の増益表示のみ。みんかぶのアナリスト予想ページ
    （https://minkabu.jp/stock/7807/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。
    東証スタンダード・時価総額の小さい銘柄で証券会社のカバーは無いと見る。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-02"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。報告セグメントは3つ（介護用品・福祉用具製造販売／介護サービス／EC）で、
      いずれも外部顧客への売上高（1Q短信のセグメント注記）に四半期→通期の係数を掛けて組む。製品別（歩行車・シルバーカー・
      杖・入浴用品）や販路別（介護保険レンタル事業者向け・小売・海外）の売上は短信・有報に数値が無く、1Q決算説明資料
      （会社HPに掲載、IRライブラリーが動的読み込みで URL を取得できず）も読めていないため、製品別の分解はしていない。
      会社計画は売上 6,403・営業利益 753 百万円（前期比 +0.2%・+0.7%）。1Q（2026-03〜05）は売上 1,799（+2.1%）・
      営業利益 316（+97.4%、営業利益率 17.6%）で、上期計画（売上 3,270・営業利益 421）に対し営業利益は 75% 進捗。
      ただし 1Q の増益の多くは前年同期の低い基準（前年 1Q は海外子会社の工場移転＝2025年3月に伴う一時費用で販管費 613・
      減価償却費 101 と膨らみ、営業利益率 9.1%）の反動で、当 1Q の販管費 502 は前期 2Q〜4Q の平均（約 489）と同水準。
      よって残る 3 四半期に同じ幅の販管費減は起きないとして利益率を置いた。会社計画が示唆する 2Q〜4Q の営業利益率は
      約 9.5%（(753−316)÷(6,403−1,799)）で、前期の 2Q〜4Q 実績（13.8%・11.9%・12.3%）のどの四半期より低く、計画は保守的と
      見る。2Q決算（2026-10-15 予定）で歩行車の受注継続と利益率の持続が分かるので、そこで置き直す前提。
      出典: 2027年2月期 第1四半期決算短信（TDnet 140120260714592814。
      https://kabutan.jp/disclosures/pdf/20260715/140120260714592814/ ＝ 2026-10-09 時点で取得 403 のため、同じ PDF を
      https://nikkeiyosoku.com/stock/tanshin/data/275792/ から 2026-10-09 取得）／2026年2月期 有価証券報告書の本文
      （https://edinetdb.jp/company/E33491/text?fy=2026、2026-10-09 取得）／data/fundamentals/7807.csv の status=OK 行"
    revenue:
      unit: JPY_million
      segments:
        - name: "介護用品・福祉用具製造販売事業（外部顧客への売上高）"
          expr: "q1_mfg_external * annualize_mfg"
          vars:
            q1_mfg_external:
              value: 1573.6
              basis: disclosed
              source: "https://nikkeiyosoku.com/stock/tanshin/data/275792/（2027年2月期 第1四半期決算短信 p9 セグメント情報。2026-10-09取得）"
              note: "2027年2月期1Q（2026-03〜05）の外部顧客への売上高 1,573,647 千円。前年同期 1,484,272 千円から +6.0%。
                セグメント間の内部売上高 101 百万円（EC事業向けと見られる）は除いた。短信本文は『主力製品である歩行車を中心に、
                既存顧客における継続利用を背景としたリピート受注が堅調』『更新および追加需要が着実に増加』と説明。
                有報では介護保険関連売上 2,535 百万円（売上構成比 39.6%）、主要顧客パナソニックエイジフリー向け 1,356 百万円（21.2%）"
            annualize_mfg:
              value: 3.6
              basis: assumed
              note: "1Q外部売上から通期への係数。1Qは需要期で、連結売上の 1Q 構成比は FY2024 27.8%・FY2025 27.1%・FY2026 27.6%
                （fundamentals の四半期 OK 行）＝単純季節性なら係数 3.6〜3.7。一方、会社計画（売上 6,403）から EC・介護サービスの
                推定分を引くと製造販売は約 5,500 ＝係数 3.5 で、会社は 2Q 以降の減収（上期計画 3,270 は 2Q 売上 1,471、前年 1,577 比
                −6.7% を含意）を置いている。1Q が +6.0% と計画より強かったこと、2025年3月発売の新歩行車『ジスタR』の寄与が 2Q 以降は
                前年と同条件になり伸び率が鈍ること、を合わせて 3.6（通期 約 5,665、FY2026 の製造販売外部売上 推定 5,400〜5,500 比
                +3〜5%）と置いた。感度で最も効く変数。製品別・販路別の数値は未取得"
        - name: "EC事業"
          expr: "q1_ec_external * annualize_ec"
          vars:
            q1_ec_external:
              value: 162.9
              basis: disclosed
              source: "https://nikkeiyosoku.com/stock/tanshin/data/275792/（2027年2月期 第1四半期決算短信 p9 セグメント情報。2026-10-09取得）"
              note: "2027年2月期1Q の外部顧客への売上高 162,891 千円。前年同期は外部 186,746＋内部 32,658 千円で、短信の『前年同期比 25.8% 減』は
                内部売上込みの比較。外部売上どうしでは −12.8%。会社は『前年同期における広告投下及び販売促進施策の効果の反動等』と説明。
                セグメント利益は 13.7 百万円（+25.8%）で、広告費を絞って利益を取る運営に見える"
            annualize_ec:
              value: 3.9
              basis: assumed
              note: "EC の四半期配分は開示が無く、季節性は不明。FY2026 のセグメント売上 729 百万円（有報。内部売上込み）に対し 1Q 外部 162.9×4＝652
                は −10% 水準で、1Q の減収（外部 −12.8%）が『前年の広告投下の反動』＝前年上期に偏った基準のためなら下期は前年並みに
                戻る余地があるとして 4.0 よりやや下の 3.9（通期 約 635）と置いた。売上全体の 1 割弱で感度は小さい"
        - name: "介護サービス事業"
          expr: "q1_care_external * annualize_care"
          vars:
            q1_care_external:
              value: 62.7
              basis: disclosed
              source: "https://nikkeiyosoku.com/stock/tanshin/data/275792/（2027年2月期 第1四半期決算短信 p2・p9。2026-10-09取得）"
              note: "2027年2月期1Q の売上高 62,702 千円（前年同期比 −31.9%）。ただし前年同期は子会社の決算期変更で幸和ライフゼーションが 5か月・
                パーソンケアが 4か月分を含む（短信 p2 に明記）ため、月数を揃えると概ね横ばい。セグメント損失 15.5 百万円（前年 21.4 百万円の損失）"
            annualize_care:
              value: 4.0
              basis: assumed
              note: "訪問・施設系の介護サービスは月数に比例すると見て単純 ×4（通期 約 251）。FY2026 の 279 百万円は上記の決算期変更で 1Q に
                約 1.5 か月分が余分に入っていたため、月数を揃えた前年水準（約 250）と整合する。損失セグメントで売上の 4% のため感度は小さい"
    profit:
      op_margin:
        value: 0.135
        basis: assumed
        note: "連結営業利益率。1Q 実績 17.6%（316÷1,799）は需要期かつ前年の一時費用の反動を含む上限。残る 3 四半期の見立ては
          （a）売上総利益率: 1Q 45.5%（前年同期 43.9%、+1.6pt。『生産効率の改善および原価低減』。一方『円安による輸入コスト上昇の影響が継続』、
          1Q に為替差損 42 百万円を計上）に対し、前期 2Q〜4Q は約 44.4%。（b）販管費: 1Q 502 百万円は前期 2Q〜4Q 平均 約 489 と同水準で、
          これ以上の削減は見込まない（賃上げ分で四半期 500〜510 を想定）。（c）全社費用: 四半期 約 67 百万円で安定（1Q 注記）。
          2Q〜4Q 売上 約 4,750 に総利益率 44.4〜45.5%・販管費 1,500〜1,530 を当てると 2Q〜4Q 営業利益 580〜660、1Q の 316 を足して通期
          900〜975（13.7〜14.9%）。これに対し会社計画 11.8%・前期実績 11.7%・1Q 前の 2 期は FY2024 14.8%・FY2025 12.5%。計画の保守性と、
          為替（輸入コスト）・物流費の上振れ余地を見て、算出レンジの下端寄り 13.5% と置いた。感度で機械的に最大となる変数だが、
          それ以上に『1Q の販管費減が基準効果か構造的か』が通期を分ける（2Q 決算で販管費の水準を確認する）。一次情報で四半期別の
          原価率は確認できていない"
