# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未取得。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/1959/analyst_consensus）を
    2026-09-05 に取得しようとしたが HTTP 403 で読めず、コンセンサスの有無そのものを確認できていない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分。工事種別（屋内線・空調管・配電線）の
      構成比は二次情報しか無く照合が通っていないため、時間軸で分けた。会社計画は売上高 500,000・営業利益 55,500 百万円
      （fundamentals の採用値。前期比 +5.0%・+1.6%）。screen.py では直近四半期がマイナス（MOMENTUM_REVERSED）。
      推定は売上・営業利益とも会社計画を下回り、営業利益は前期比でほぼ横ばい〜微減"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 98696
              basis: actual
              source: "data/fundamentals/1959.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 100,568 に対し -1.9%。営業利益は 11,098→10,731 の -3.3%"
        - name: "2〜4Q（前年同期の売上×伸び）"
          expr: "prev_q2_q4 * growth"
          vars:
            prev_q2_q4:
              value: 375555
              basis: actual
              source: "data/fundamentals/1959.csv"
              note: "前年の Q2025-07_2025-09（107,157）・Q2025-10_2025-12（111,528）・Q2026-01_2026-03（156,870）の採用値の合計"
            growth:
              value: 1.03
              basis: assumed
              note: "残り3四半期の前年同期比。会社計画が含意する伸びは +6.9%（500,000−98,696＝401,304 ÷ 375,555）、1Q実績は -1.9%。
                前期の売上は +0.5% とほぼ横ばいで、伸びは利益率の改善から来ていた。宇久島メガソーラーの EPC（reports/1959.md 展望節）が
                売上に立つ時期を当台帳は特定できておらず、計画と1Q実績の中間より下の +3% と置いた"
    profit:
      op_margin:
        value: 0.111
        basis: assumed
        note: "通期実績 11.5%（FY2026-03 の採用値 54,600÷476,123）、1Q実績 10.9%（前年同期 11.0%）、会社計画 11.1%（55,500÷500,000）。
          前期の改善（8.7%→11.5%）が1Qで止まっており、計画と同じ 11.1% と置いた。前期4Q（Q2026-01_2026-03）の 11.6% まで戻る根拠は
          いまのところ無い"
