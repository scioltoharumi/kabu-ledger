# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/6647/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。会社が開示する営業部門（鉄道・自動車・船舶等）と不動産の4区分を、前期売上×伸びで置く
      （船舶等と不動産は横ばいで1つにまとめた）。会社計画は売上高 10,000・営業利益 450 百万円（fundamentals の採用値。前期比 +15.8%・-47.4%）。
      会社は増収なのに営業利益が半減する計画を置いており、その理由（原価上昇か、保守的な癖か）を当台帳は一次情報で確認できていない。
      1Qの営業利益 280 だけで計画の 62% に達しているため、推定の営業利益は計画を大きく上回るが、これは計画の利益率 4.5% を
      信じていないということで、人間の確認が最も要る箇所"
    revenue:
      unit: JPY_million
      segments:
        - name: "鉄道関連（行先表示器・配電盤・照明など）"
          expr: "prev_revenue * growth"
          vars:
            prev_revenue:
              value: 6993
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08360/10b689a4/6f7c/4865/af2c/be72e896d924/140120260514535527.pdf（2026年3月期決算短信・部門別売上。取得日 2026-08-31）"
              note: "FY2026-03 の鉄道関連売上高。売上の 81%"
            growth:
              value: 1.18
              basis: assumed
              note: "前期の受注高 12,114 は売上 8,638 を 3,476 上回り（+15.7%。同短信）、1Qも受注 4,549 に対し売上 2,371 で受注残が積み上がっている
                （2027年3月期第1四半期決算短信 https://contents.xj-storage.jp/xcontents/AS08360/87a751bf/d6dc/4bab/a38f/7cfd071ebd79/140120260806512218.pdf
                取得日 2026-08-31）。1Qの売上は前年同期比 +18.0%。受注生産・長納期で受注残が売上に変わる速さは生産能力（従業員 218名）で決まり、
                1Q並みの +18% と置いた。会社計画の全社 +15.8% と近い"
        - name: "自動車関連（標識車・道路用情報装置）"
          expr: "prev_revenue * growth"
          vars:
            prev_revenue:
              value: 1181
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08360/10b689a4/6f7c/4865/af2c/be72e896d924/140120260514535527.pdf（2026年3月期決算短信・部門別売上。取得日 2026-08-31）"
              note: "FY2026-03 の自動車関連売上高"
            growth:
              value: 1.05
              basis: assumed
              note: "高速道路会社・国土交通省向けで公共予算に連動し、大きくは動かない。部門別の受注の伸びの開示が当台帳に無く +5% と置いた"
        - name: "船舶等・不動産（横ばい）"
          expr: "prev_revenue"
          vars:
            prev_revenue:
              value: 464
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08360/10b689a4/6f7c/4865/af2c/be72e896d924/140120260514535527.pdf（2026年3月期決算短信・部門別売上。取得日 2026-08-31）"
              note: "FY2026-03 の船舶等関連 311 と不動産関連 153 の合計。合わせて売上の 5% で、伸びを置いても営業利益への感度が小さいため横ばいとした"
    profit:
      op_margin:
        value: 0.085
        basis: assumed
        note: "前期通期 9.9%（856÷8,638）、1Q実績 11.8%（280÷2,371。前年同期 6.3%）、会社計画 4.5%（450÷10,000）。前期は3Q単独が赤字（-41）になるなど
          四半期の振れが大きい。会社計画の 4.5% は前期の半分以下で、原材料高か大型案件の採算悪化を織り込んでいる可能性があるが確認できていない。
          前期実績と計画の間より実績寄りの 8.5% と置いた。感応度で最も効く変数で、計画の理由が分かれば置き直す"
