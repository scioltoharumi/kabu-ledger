# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/6904/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: draft
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分。報告セグメントは地域別（日本・アジア・北中米・欧州）で
      内部売上が大きく製品別の分解に使えないため時間軸で分けた。会社計画は売上高 39,000・営業利益 2,000 百万円（fundamentals の採用値。
      前期比 -7.6%・-16.6% と減収減益の計画）。1Qは売上 +12.5%・営業利益 +79.8% で計画と逆向きに出ており、計画どおりなら残り3四半期の
      売上は前年同期比 -13.9% が要る。海外子会社の決算期が3か月ずれているため、為替・関税の影響は連結に遅れて出る。
      推定は売上・営業利益とも会社計画を上回るが、4Qに損失を出す癖（前期 -222・前々期 -358）を織り込んでいる"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 11387
              basis: actual
              source: "data/fundamentals/6904.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 10,124 に対し +12.5%。営業利益は 909→1,634 の +79.8%（利益率 9.0%→14.3%）"
        - name: "2〜4Q（前年同期の売上×増減）"
          expr: "prev_q2_q4 * factor"
          vars:
            prev_q2_q4:
              value: 32068
              basis: actual
              source: "data/fundamentals/6904.csv"
              note: "前年の Q2025-07_2025-09（10,207）・Q2025-10_2025-12（10,688）・Q2026-01_2026-03（11,173）の採用値の合計"
            factor:
              value: 0.95
              basis: assumed
              note: "残り3四半期の前年同期比。会社計画が含意するのは -13.9%（39,000−11,387＝27,613 ÷ 32,068）、1Q実績は +12.5%。会社が減収を
                置く理由（為替前提・北米の自動車生産）は当台帳で確認できていないが、会社が自社の受注を見て置いた数字なので無視はしない。
                1Qの好調と計画の中間より計画寄りの -5% と置いた。人間の確認が最も要る変数"
    profit:
      op_margin:
        value: 0.065
        basis: assumed
        note: "1Q実績 14.3%（1,634÷11,387）、前期通期 5.7%（2,398÷42,192）、会社計画 5.1%（2,000÷39,000）。1Qの営業利益だけで会社計画の 82% に達しているが、
          この会社は4Q（1〜3月）に損失を出す（前期 -222・前々期 -358。棚卸や海外子会社の期ずれ調整とみられる）。1Qの高い率は続かないとみて
          通期 6.5% と置いた。それでも計画の 5.1% は超える"
