# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未確認。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/3796/analyst_consensus、2026-09-27）は取得時 403 で中身を見られなかった。
    時価総額が小さく、調べた範囲（株探・株予報の銘柄ページ、2026-09-27）ではアナリスト予想の表を見つけていない。カバーが無いと断定はしていない。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。不動産会社向けクラウド（SaaS）の単一事業で、売上は月額課金のサブスクリプションと、
      導入・開発等のソリューション（スポット）の2つに分かれる。サブスク＝課金法人数×月額単価×12、ソリューション＝年額の1区分で置いた。
      会社計画は売上 3,415・営業利益 319 百万円（fundamentals の採用値。前期比 +5.7%・+39.3%）。
      2026-04-01 付で1株→2株の株式分割があった（ダイヤモンド・ザイ 1Q記事 https://diamond.jp/zai/articles/-/1071234 、
      株探 2026-02-25 記事 https://kabutan.jp/stock/news?code=3796&b=n202602250342 、いずれも 2026-09-27 取得の検索結果）。
      このモデルは1株指標を使わないので分割の影響は受けない。fundamentals の BPS が2ソースでちょうど2倍食い違う（MISMATCH）のは
      片方が遡及修正しているためと考えられる。数値の出典は二次情報（ログミー・ダイヤモンド・ザイ・株探の記事）で、決算短信の本文は未確認"
    revenue:
      unit: JPY_million
      segments:
        - name: "サブスクリプション（課金法人数×月額単価×12）"
          expr: "customers * arpu_monthly * 12"
          vars:
            customers:
              value: 1595
              basis: assumed
              note: "期中平均の有料課金法人数。2026年3月末 1,589（前年同期 1,549。ログミー https://finance.logmi.jp/articles/382430 、2026-09-27 取得の検索結果）、
                2026年6月末 1,584（ダイヤモンド・ザイ https://diamond.jp/zai/articles/-/1071234 、同）。年40社前後の純増が1Qで止まっており、
                期末 1,600 前後として平均 1,595 と置いた。単価側より効きは小さい"
            arpu_monthly:
              value: 0.153
              basis: assumed
              note: "1社あたり月額単価（百万円）。2026年6月末 約150,300円・前年同期比 +6.5%（ダイヤモンド・ザイ https://diamond.jp/zai/articles/-/1071234 、2026-09-27 取得の検索結果）。
                検算: 1,584社×150,300円×3か月＝714百万円で、1Qサブスク売上 713 百万円（同記事）と合う。単価上昇が年 +6% 程度続くとして
                期中平均 153,000円と置いた。感度で最も効く変数の一つ。アップセル・値上げの続き具合を一次情報で確認できていない"
        - name: "ソリューション（導入・開発などスポット）"
          expr: "solution"
          vars:
            solution:
              value: 450
              basis: assumed
              note: "前期 486 百万円（売上 3,232 − サブスク 2,746。サブスクはログミー https://finance.logmi.jp/articles/382430 、2026-09-27 取得の検索結果）。
                前期は4Qに大型案件の納品が集中した。今期1Qは 767−713＝54 百万円で前年同期比 −44.8%（ダイヤモンド・ザイ同記事）。
                大型案件の有無で振れる区分で、前期をやや下回る 450 と置いた"
    profit:
      op_margin:
        value: 0.085
        basis: assumed
        note: "全社×総売上に適用。前期通期 7.1%（229÷3,232、fundamentals 採用値）、会社計画 9.3%（319÷3,415）。
          1Q（4〜6月）は 0.4%（3÷767）で前年同期 −1.8%（−13÷749）から約2.2pt改善。前期は1Qが最も弱く4Qが 14.0% と季節性が大きいので、
          前期通期に1Qの改善幅を足した 9% 前後が上限と見て、計画をやや下回る 8.5% と置いた。売上の大半がサブスクで固定費型のため、
          売上の振れがそのまま利益率に効く"
