# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "確認できず。株予報のアナリスト予想ページ（https://kabuyoho.jp/sp/reportAnalyst?bcode=4475、2026-10-09 取得）は
    コンセンサス欄が「--」で、載っている『アナリスト業績予想』の売上高 12,834・営業利益 2,057 百万円は会社予想
    （2026-08-04 時点）と同値のため市場予想としては採らない。みんかぶの証券アナリスト予想ページ
    （https://minkabu.jp/stock/4475/analyst_consensus、2026-10-09）は HTTP 403 で読めず、カバーの有無そのものを
    確かめられていない。2026-10-20〜22 に東証プライムへ市場区分変更予定（後述）でカバーが付く可能性はあるが未確認。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-09"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。9月決算で3Q（2026-06）まで実績が出ており、対象期は 2026-09-30 で終わっている
      （4Q 決算は 2026-11-05 予定）。残る4Qは、会社自身が開示に使う ARR の分解『ARR = 契約企業数 N × 企業あたり平均ユーザ数 n ×
      ユーザあたり年額単価 ARPU』（3Q決算説明資料 p30）をそのまま使い、2026-06 末の N・n・ARPU から四半期売上に落とす。
      売上は『HENNGE One 事業』（9か月累計 8,867・前年同期比 +18.1%・売上の 94%）と『プロフェッショナル・サービス及びその他』
      （523・+3.2%）の2区分で会社が開示している（同 p4）。会社計画は売上 12,834・営業利益 2,057 百万円（前期比 +17.5%・+14.7%。
      2025-11-07 公表、3Q 時点で据え置き）。3Q 決算説明会（2026-08-04）で会社は『4Q 営業利益は約2億円』『広告宣伝費は通期で
      11.5億円を上回る見込み（4Qに追加投下）』『広告宣伝費を除く営業費用は 96.2億円を下回る見込み』と説明しており、推定もそれに沿う。
      2026-10-02 に期末配当の増額（3→8円）・公募 110万株＋売出 138万株（OA 最大 37.2万株）・プライム市場への区分変更
      （受渡期日 2026-10-20〜22）を発表したが、業績予想の修正は確認できていない（調達資金は広告宣伝費・人材採用費に充てるとされ、
      効く先は FY2027 以降の費用）。2026-10 から新規顧客向け新プラン（価格改定）・既存顧客は 2027-04 から約1年で移行、
      新サービス（Mesh Network・Password Manager・Domain Protection）も 2026-10 以降提供のため、いずれも当期（FY2026-09）には
      ほぼ効かない。FY2027-09 の会社計画が出る 2026-11-05 の決算で、次の版（FY2027-09）を足す前提。
      出典: 2026年9月期 第3四半期決算説明資料 https://contents.xj-storage.jp/xcontents/AS92184/57c7f7c2/b7bf/4318/86c8/d69eb4753460/140120260803507614.pdf
      ／同 決算短信 https://contents.xj-storage.jp/xcontents/AS92184/2209ca93/3207/4582/a8fc/4476f7406d35/140120260803507607.pdf
      ／同 決算説明会 書き起こし https://finance.logmi.jp/articles/385503
      ／公募増資の概要 https://www.ipokiso.com/po/company/2026/4475.html（いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "1〜3Q実績（2025年10月〜2026年6月・確定分）"
          expr: "ytd_revenue"
          vars:
            ytd_revenue:
              value: 9390
              basis: actual
              source: "data/fundamentals/4475.csv"
              note: "Q2025-10_2025-12（3,016）・Q2026-01_2026-03（3,113）・Q2026-04_2026-06（3,261）の採用値の合計。
                前年同期 8,016（2,510＋2,695＋2,811）に対し +17.1%。四半期ごとの前年同期比は +20.2%・+15.5%・+16.0%。
                営業利益は 1,580→1,854 の +17.4%（3Q決算説明資料 p4 の9か月累計とも一致）"
        - name: "4Q HENNGE One 事業（2026年7〜9月・ARR＝N×n×ARPU から四半期売上へ）"
          expr: "companies * users_per_company * arpu_yen / 1000000 / 4 * arr_to_revenue"
          vars:
            companies:
              value: 3881
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS92184/57c7f7c2/b7bf/4318/86c8/d69eb4753460/140120260803507614.pdf（2026-10-09取得）"
              note: "HENNGE One 契約企業数（2026-06 末、p19）。前期末から +454社・前年同期末比 +18.0%、3Q単独で +150社。
                会社は『主に中小規模の契約の安定的な獲得』と説明"
            users_per_company:
              value: 811
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS92184/57c7f7c2/b7bf/4318/86c8/d69eb4753460/140120260803507614.pdf（2026-10-09取得）"
              note: "契約企業あたりの平均契約ユーザ数（2026-06 末、p19・p50）。契約ユーザ数 314.9万人 ÷ 3,881社。
                3Qは『主要ターゲット層（従業員 300〜5,000名）を上回る規模の企業から 10件程度』の契約で QoQ +18.5万人と大幅増。
                前期末比では −6人（FY2018 以降、中小企業の獲得が続いて逓減傾向。p30）"
            arpu_yen:
              value: 3975
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS92184/57c7f7c2/b7bf/4318/86c8/d69eb4753460/140120260803507614.pdf（2026-10-09取得）"
              note: "HENNGE One ARPU＝1契約ユーザあたりの年額単価（円、2026-06 末、p19）。QoQ −41円（複数の大きめの企業が
                DLP Edition 中心の単機能プランで新規契約したため）。3者の積 3,881×811×3,975＝約 12,511 百万円は、開示 ARR 125.2億円
                （p19。前年同期末比 +16.7%・QoQ +6.1億円）と n の丸め差の範囲で一致する。2026-10 からの新プラン（値上げ）は
                新規顧客のみ・既存顧客は 2027-04 から移行のため当期の ARPU には効かない（決算説明会 Q&A）"
            arr_to_revenue:
              value: 1.03
              basis: assumed
              note: "期首（2026-06 末）ARR の 1/4 を4Q売上に換算する係数。中身は (a) 期中の ARR 増加の半分（四半期 ARR 成長は
                FY2025-4Q +3.8%＝10,730→11,135、FY2026-3Q +4.9%。4Qを +4% とみて期中平均は期首の約 1.02 倍）と
                (b) 売上÷期中平均ARR の比率（FY2025-4Q: HENNGE One 売上 2,750＝10,259−7,509 に対し 期中平均 ARR 10,933÷4＝2,733
                で 1.006。初期費用等の非経常分が乗るぶん 1 をわずかに上回る）の積 ≒ 1.03。ARR 開示値（10,730・11,135・12,520）は
                3Q決算説明資料 p20・p30 から。会社計画が含意する 4Q HENNGE One 売上は 3,220（12,087−8,867）で、本推定（約 3,222）と
                ほぼ同じ。感度上位の変数だが、ARR は契約済み金額の積み上げなので ±3% 以上の振れは想定しにくい"
        - name: "4Q プロフェッショナル・サービス及びその他事業（2026年7〜9月）"
          expr: "ps_other_q4"
          vars:
            ps_other_q4:
              value: 185
              basis: assumed
              note: "9か月累計 523（四半期平均 174。前年同期比 +3.2%）と前年4Q 159（665−506）から、四半期 170〜200 のレンジ中央付近に置いた。
                会社計画 747 が含意する 4Q は 224 で、9か月の実勢（+3.2%）から見て高く、計画は期初から据え置きのため達成を
                前提にしなかった。受託開発・導入支援が中心で四半期ごとの振れが大きく一次情報で4Qの案件を確認できていないが、
                売上全体の 1.5% 程度で感度は小さい（3Q決算説明資料 p4・p28）"
    profit:
      op_margin:
        value: 0.160
        basis: assumed
        note: "全社×総売上に適用。3Q累計 19.7%（1,854÷9,390）、前期通期 16.4%（1,793÷10,924）、会社計画 16.0%（2,057÷12,834）。
          4Q は毎年利益率が低い（前年4Q 7.3%＝213÷2,908、前々年4Q 4.3%＝98÷2,304。fundamentals の採用値）。理由は広告宣伝費の
          4Q集中で、当期は『通期で 11.5億円を上回る見込み（9か月進捗 77.2%＝約 8.9億円 → 4Q に約 2.6億円以上）』、
          一方『広告宣伝費を除く営業費用は 96.2億円を下回る見込み（採用関連費用の減少）』と会社が説明。会社の『4Q 営業利益は約2億円』
          （決算説明会 2026-08-04）を置くと通期 1,854＋200＝約 2,054 で、本推定の売上 約 12,800 に対し 16.0%。4Q 営業利益が
          前年4Q（213）並みなら 16.1%、広告の追加投下で 150 まで下がれば 15.7%。感度で最も効く変数（乗法モデルなので定義上）"
