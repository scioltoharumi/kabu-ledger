# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "売上高・営業利益のコンセンサスは確認できず。株予報（IFIS）https://kabuyoho.jp/report?bcode=4847（2026-10-09取得）は
    2027年6月期の会社予想（売上 17,700・営業利益 2,200・経常 2,240 百万円）に加えて経常利益のみ『コンセンサス 2,400 百万円
    （増益率 12.7%）』を表示するが、売上高・営業利益の欄は無く、アナリスト数・レーティングも『--』で、何社の予想かが分からない
    （経常のみの表示は会社予想を機械的に引いた値の可能性があり、独立したカバーとは断定できない）。
    みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/4847/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。
    東証プライムだが時価総額が小さく（親会社 DNP が 50.73% を保有＝説明会資料 p28）、証券会社のカバーは無い可能性が高い。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-06"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/4847.md はまだ無い）。報告セグメントは単一（短信はセグメント情報を
      省略）だが、会社は売上を『製品カテゴリ別』（システム開発・保守・自社製品・サービス・他社製品（ハードウェア等）・クラウドサービス・
      セキュリティ）と『事業領域別』（決済・セキュリティ・データ通信・分析基盤）の2軸で開示している。契約形態が異なる製品カテゴリ別の
      5区分で組み（保守と自社製品・サービスは小さいので束ねた）、各区分は『FY2026-06 実績 × 成長係数』の2変数（ハードウェアだけは
      案件連動のフローなので金額を直接置いた）。会社計画は売上 17,700・営業利益 2,200 百万円（前期比 +2.6%・+6.0%、上期 8,800・1,000）。
      当推定は会社計画をやや上回る。理由は (1) システム開発の受注高 7,044 が売上 6,187 を上回り（受注高÷売上 1.14）受注残も増えている、
      (2) クラウドサービスは半期ごとに約 +200〜+300 百万円の積み上がりが続き、下期実績 2,257 の2倍 4,514 で既に計画 4,550 に届く。
      一方で下振れ側は、ハードウェアが主要顧客向け FEP 更改に連動する案件物で前期（2,214）の反動が読めないこと、
      販管費が成長投資で +9.7%（3,150）に増える計画であること。感度で最も効くのはシステム開発の成長係数とクラウドの成長係数。
      1Q 決算（2026-11-04 予定）で『1Q に見込むクラウドの大型受注（不正検知）』と上期計画 8,800 の進捗が分かるので、そこで置き直す前提。
      出典: 2026年6月期 決算説明会資料（2026-08-07 開示。株探の開示 PDF ミラー https://tdnet-pdf.kabutan.jp/20260807/140120260807515661.pdf、
      開示一覧 https://kabutan.jp/disclosures/pdf/20260807/140120260807515661/、2026-10-09取得。以下『説明会資料』）／
      ログミーFinance 決算説明会書き起こし https://finance.logmi.jp/385506（2026-08-13公開、2026-10-09取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "システム開発（決済領域の主要顧客向け更改案件が中心）"
          expr: "sysdev_fy2026 * sysdev_growth"
          vars:
            sysdev_fy2026:
              value: 6187
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260807/140120260807515661.pdf（説明会資料 p6・p8、2026-10-09取得）"
              note: "FY2026-06 の製品カテゴリ別売上。前期 6,838 から △9.5%。上期 2,769（大型案件収束の影響）→下期 3,417
                （主要顧客向けシステム更改案件が進捗）と下期に回復。カテゴリ合計 6,187+1,677+807+2,214+4,293+2,067＝17,245 で、
                fundamentals の採用値（FY2026-06 売上 17,247・OK）と端数差 2 以内"
            sysdev_growth:
              value: 1.05
              basis: assumed
              note: "会社計画は 6,320（+2.1%。上期 3,190・下期 3,130）。それより上に置いた根拠は受注: FY2026-06 のシステム開発の
                受注高 7,044 百万円は売上 6,187 を 857 上回り（受注高÷売上＝1.14）、システム開発の受注残高は 2,254 で前期比増
                （説明会資料 p4・p10〜p11、ログミー）。受注残は1年未満で消化される規模なので、受注高の超過分の一部が今期売上に出るとして
                6,187×1.05≒6,500（下期実績 3,417 の2倍 6,834 と計画 6,320 の間）。下振れ要因は『数年来の大型案件が収束し次フェーズへの
                移行期間』（3Q 説明）で、更改案件の検収時期が期をまたぐと計画を下回る。感度で最も効く変数の一つ。
                受注高の内訳の前年値は資料の図から正確に読めず、受注の伸び率は一次情報で確認できていない"
        - name: "クラウドサービス（FEP・不正検知・アクワイアリングのクラウド提供。ストック）"
          expr: "cloud_fy2026 * cloud_growth"
          vars:
            cloud_fy2026:
              value: 4293
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260807/140120260807515661.pdf（説明会資料 p5〜p6・p8、2026-10-09取得）"
              note: "FY2026-06 のクラウドサービス売上。前期 3,479 から +23.4%（+813）。会社は『ユーザー数増加や既存ユーザーの機能追加』が
                要因と説明。半期推移は FY2025 上期 1,527→下期 1,952→FY2026 上期 2,035→下期 2,257"
            cloud_growth:
              value: 1.12
              basis: assumed
              note: "会社計画は 4,550（+6.0%。上期 2,270・下期 2,280）だが、下期実績 2,257 を横置きしただけで 4,514 になり、
                計画は半期の積み上がり（直近4半期で +425／+83／+222）をほぼ見込んでいない。4Q に不正検知分野でクラウドの大型受注を獲得し、
                FY2027 1Q にも更に大型受注を見込むと説明（ログミー）。半期 +150 前後の積み上がりが続くとして上期 約2,400＋下期 約2,550
                ＝約4,950（係数 1.15）が上限、計画 1.06 が下限で、その中間やや上の 1.12（≒4,810）。ストック性が高いので急減は想定しないが、
                FY2026 の +23.4% は主要顧客の更改に伴う一時的な利用拡大を含む可能性があり（不正検知 +33.1% の内訳は非開示）、その分は割り引いた。
                感度上位の変数。一次情報で四半期の積み上がりペースは確認できていない（半期値のみ）"
        - name: "他社製品（ハードウェア等。FEP 更改に連動するフロー）"
          expr: "hardware_revenue"
          vars:
            hardware_revenue:
              value: 2000
              basis: assumed
              note: "FY2026-06 実績 2,214（前期 1,087 から +103.7%。主要顧客向け FEP システム更改に伴うハードウェア販売）、会社計画は
                2,180（△1.6%。上期 1,120・下期 1,060）で『前期並み』。ただし上期 1,312→下期 902 と期中に減っており、下期の2倍 1,804 と
                計画 2,180 の間の 2,000 と置いた。案件連動のため、更改案件の次フェーズで機器更新が無ければ FY2025 水準（約1,100）まで
                戻る下振れ余地あり。利益率は低い区分（他社製品の転売）なので、ここが下振れても営業利益への影響は売上比より小さい"
        - name: "保守＋自社製品・サービス（運用保守・自社サービス。ストック寄り）"
          expr: "maint_own_fy2026 * maint_own_growth"
          vars:
            maint_own_fy2026:
              value: 2484
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260807/140120260807515661.pdf（説明会資料 p6、2026-10-09取得）"
              note: "FY2026-06 の保守 1,677（+3.6%）＋自社製品・サービス 807（+47.3%）の合計。自社製品・サービスは下期 398 と
                上期 408 から頭打ち。保守は半期 796→822→832→844 と緩やかに増加"
            maint_own_growth:
              value: 1.01
              basis: assumed
              note: "会社計画は保守 1,700（+1.4%）＋自社製品・サービス 800（△0.9%）＝2,500（+0.6%）。保守は更改で稼働した
                システムが増えると翌期から保守料に乗るため微増、自社製品・サービスは前期の伸びが一巡と見て、合計で +1%（≒2,509）。
                感度は小さい"
        - name: "セキュリティ領域（CWAT 等の自社製品と他社セキュリティ製品の販売・利用料）"
          expr: "security_fy2026 * security_growth"
          vars:
            security_fy2026:
              value: 2067
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260807/140120260807515661.pdf（説明会資料 p5〜p6・p8、2026-10-09取得）"
              note: "FY2026-06 のセキュリティ売上。前期 2,022 から +2.2%。半期 923→1,098→993→1,073 で下期偏重。
                中期経営計画に対しては決済領域（101.3%）と違い未達と会社が説明（ログミー）"
            security_growth:
              value: 1.03
              basis: assumed
              note: "会社計画は 2,150（+4.0%。上期 970・下期 1,180）。直近2期の伸びは +2.2% で、計画の下期 1,180 は過去最高の半期
                （1,098）を上回る前提。『セキュリティ領域の成長遅れ・製品構成による粗利率低下』を会社自身が課題に挙げており
                （説明会資料 p7、ログミー）、計画より低い +3%（≒2,129）に置いた。感度は小さい"
    profit:
      op_margin:
        value: 0.125
        basis: assumed
        note: "全社売上に一律で掛ける。FY2026-06 実績 12.0%（fundamentals の採用値 2,076÷17,247。上期 10.5%・下期 13.5%）、
          会社計画 12.4%（2,200÷17,700。売上総利益率 30.2%・販管費 3,150＝+9.7%）。上振れ側は、期初から続いた品質対応が
          FY2026 中に収束し 3Q 以降は収益性が改善（4Q 営業利益率 15.1%）、低利益率のハードウェア比率が下がりクラウド比率が上がる
          構成変化。下振れ側は、成長投資（インフラ運用基盤・自社プロダクト・AI）で販管費が +277 増える計画で、売上が計画を上回っても
          販管費は固定費として先行する点、セキュリティ領域の製品構成による粗利率低下が続く点。下期実績 13.5% までは置かず、
          計画 12.4% と下期実績の間の 12.5%。過去の営業利益率は FY2024-06 14.0%・FY2025-06 11.9%・FY2026-06 12.0%（fundamentals）"
