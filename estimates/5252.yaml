# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストコンセンサスを確認できず。株予報Pro（https://kabuyoho.jp/reportTop?bcode=5252、2026-09-27取得）のアナリスト予想欄は数値が「--」で空。
    みんかぶ（https://minkabu.jp/stock/5252/analyst_consensus）は 2026-09-27 に取得を試みたが 403 で読めなかった。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。事業は検証事業（ソフトウェアテスト・品質保証の受託）と開発事業（受託開発・パッケージ）の2つで、
      FY2026-03 の売上構成は検証 2,618・開発 1,941 百万円（57:43。株予報Pro https://kabuyoho.jp/reportTop?bcode=5252 、2026-09-27取得。
      一次情報とは未照合）。どちらも技術者の人月売りで、分解するなら 技術者数×稼働率×単価 だが、人数・単価の開示を確認できていないため
      セグメント別には組まず、今期1Q実績×年率換算の1区分で置く（四半期のセグメント別売上も未確認）。
      会社計画は売上高 5,000・営業利益 150 百万円（fundamentals の採用値。前期比 +9.7%・+130.8%）。
      1Q（4〜6月）は売上 1,204（前年同期 1,061 比 +13.5%）で、人員投資の人件費増により営業損失 -6（前年同期 -23）。
      推定は売上がほぼ計画並み、営業利益は計画を下回る側。利益率の仮定が最も効く"
    revenue:
      unit: JPY_million
      segments:
        - name: "通期（1Q売上×年率換算。検証＋開発の合計）"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 1204
              basis: actual
              source: "data/fundamentals/5252.csv"
              note: "Q2026-04_2026-06（今期1Q）の採用値。前年同期 1,061 に対し +13.5%"
            annualize:
              value: 4.2
              basis: assumed
              note: "1Qから通期への換算係数。この会社は下期偏重で1Qが最も小さい。1Qの通期比は FY2025-03 が 991÷4,154=23.9%（係数 4.19）、
                FY2026-03 が 1,061÷4,558=23.3%（係数 4.30。いずれも fundamentals の採用値）。前期は3Q・4Qの伸びが大きく係数を押し上げたため、
                2期のうち低い側の 4.2 と置いた。4.3 なら 5,177、4.0 なら 4,816"
    profit:
      op_margin:
        value: 0.025
        basis: assumed
        note: "感度で最も効く変数。営業利益率の実績は FY2024-03 6.1%（250÷4,076）→ FY2025-03 2.4% → FY2026-03 1.4%（65÷4,558）と低下が続き、
          会社計画は 3.0%（150÷5,000）の回復。今期1Qは人員投資による人件費増で -0.5% だが前年同期（-2.2%）より損失幅は縮小。
          利益は4Q（1〜3月）に集中する形（前期4Q 96・4Q率 7.7%）で、1Qの数字だけでは通期の率を決めにくい。
          2期連続の低下の後で計画どおり倍増する根拠を一次情報で確認できていないため、前期実績と計画の間のやや計画寄り 2.5% と置いた"
