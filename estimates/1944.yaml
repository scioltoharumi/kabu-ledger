# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "みんかぶ 証券アナリスト予想（5人: 強気買い3・中立2）"
  revenue: 825816
  source: "https://minkabu.jp/stock/1944/analyst_consensus（2026-09-05取得。2027年3月期の売上高コンセンサス 825,816百万円。同ページに営業利益のアナリスト予想は掲載なし）"
  note: "営業利益のコンセンサスは掲載が無いため載せない（純利益予想 76,940百万円は営業利益ではないので使わない）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分。
      報告セグメントが設備工事業1本で、工事種別（一般電気・配電・環境・情報通信・電力その他）は単体の完成工事高しか
      開示が無いため時間軸で分けた。会社計画は売上高 810,000・営業利益 97,000 百万円（2027年3月期第1四半期決算短信 p.1、
      https://www.kinden.co.jp/pdf/2026-07-29_2.pdf 取得日 2026-09-05。前期比 +7.9%・+7.5%）。台帳の fundamentals に
      計画の採用値が無いので、銘柄ページの会社計画比は空欄になる。弘電社（1948）の完全子会社化は計画にも当推定にも
      入れていない（会社は影響を精査中）。推定は売上・営業利益とも会社計画をやや上回る"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 162369
              basis: actual
              source: "data/fundamentals/1944.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 141,412 に対し +14.8%。営業利益は 7,195→13,601 の +89.0%"
        - name: "2〜4Q（前年同期の売上×伸び）"
          expr: "prev_q2_q4 * growth"
          vars:
            prev_q2_q4:
              value: 609330
              basis: actual
              source: "data/fundamentals/1944.csv"
              note: "前年の Q2025-07_2025-09（179,966）・Q2025-10_2025-12（177,889）・Q2026-01_2026-03（251,475）の採用値の合計"
            growth:
              value: 1.08
              basis: assumed
              note: "残り3四半期の前年同期比。会社計画が含意する伸びは +6.3%（810,000−162,369＝647,631 ÷ 609,330）、
                1Q実績は +14.8%。手持工事高が 2026年6月末 759,700百万円 と年間完成工事高の 1.24年ぶんあり、うち一般電気工事が
                前年同期比 +25.4%（reports/1944.md 展望節、出典 1Q決算短信）なので仕事は先に積まれている。ただし会社の
                受注計画は前期比 -5.8% と慎重で、施工できる人手が上限になるため、1Q実績と計画の中間 +8% と置いた"
    profit:
      op_margin:
        value: 0.125
        basis: assumed
        note: "通期実績 12.0%（FY2026-03 の採用値 90,256÷750,742）に対し、例年もっとも利益率の低い1Qが 8.4%（前年同期 5.1%、+3.3pt）。
          会社計画は 12.0%（97,000÷810,000）で前期並みを置いている。1Qの改善幅がそのまま通期に乗ると 15% 近くになるが、
          前期は4Qに大型案件の採算改善が集中した（Q2026-01_2026-03 の利益率 15.2%）反動を見て、通期実績 +0.5pt の 12.5% と置いた。
          感応度で最も効く変数はここで、人間の確認が要る"
