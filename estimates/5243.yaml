# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/5243/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2026-11"
    status: draft
    note: "初版（Claude 起案・人間未確認）。11月決算で2Qまで実績が出ているため、上期実績（確定分）＋下期（前年同期×伸び）の2区分。
      会社が示す売上区分（note／note pro・法人向け／AI関連／IP・コンテンツ）は今期に組み替えられ前年と比べられないため時間軸で分けた。
      会社計画は売上高 5,650・営業利益 1,100 百万円（fundamentals の採用値。上方修正後。前期比 +36.4%・+330%）。
      前期の営業利益が 256 と小さいため前期比の率は大きく出るが、それは水準の低さの裏返しで、額（約 +850）で見ること。
      推定は売上・営業利益とも会社計画とほぼ同じ"
    revenue:
      unit: JPY_million
      segments:
        - name: "上期実績（2025年12月〜2026年5月・確定分）"
          expr: "h1_revenue"
          vars:
            h1_revenue:
              value: 2604
              basis: actual
              source: "data/fundamentals/5243.csv"
              note: "Q2025-12_2026-02（1,218）・Q2026-03_2026-05（1,386）の採用値の合計。前年同期 1,970 に対し +32.2%。
                営業利益は 23.5→538（利益率 1.2%→20.7%）"
        - name: "下期（2026年6〜11月・前年同期の売上×伸び）"
          expr: "prev_h2 * growth"
          vars:
            prev_h2:
              value: 2171
              basis: actual
              source: "data/fundamentals/5243.csv"
              note: "前年の Q2025-06_2025-08（1,076）・Q2025-09_2025-11（1,095）の採用値の合計"
            growth:
              value: 1.36
              basis: assumed
              note: "会社計画が含意する下期は 3,046（5,650−2,604。前年同期比 +40.3%）。四半期の前年同期比は 1Q +27.3%・2Q +36.8% と加速しており、
                GMV が +24.6%（2Q・会社開示・未照合）に note pro のキャンペーン契約が乗る。2Qの伸びが続く +36% と置き、計画の +40% までは
                置かない（2Qのキャンペーンは単価を一時的に下げている）"
    profit:
      op_margin:
        value: 0.20
        basis: assumed
        note: "上期 20.7%（538÷2,604）、2Q単独 21.9%（303÷1,386）、前期通期 6.2%、会社計画 19.5%（1,100÷5,650）。会社計画が含意する下期は
          18.4%（562÷3,046）。プラットフォームで売上増が費用増を伴わない構造のため上期並みが続くとみて 20% と置いたが、
          前期の上方修正の主因は費用の下振れで（reports/5243.md）、採用や販促を再開すれば下がる"
