# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "みんかぶ 証券アナリスト予想（6人: 強気買い4・買い1・中立1）"
  revenue: 446666
  source: "https://minkabu.jp/stock/1969/analyst_consensus（2026-09-05取得。2027年3月期の売上高コンセンサス 446,666百万円。同ページに営業利益のアナリスト予想は掲載なし）"
  note: "営業利益のコンセンサスは掲載が無いため載せない（純利益予想 42,250百万円は営業利益ではないので使わない）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分。設備工事事業が売上の 97.7% を占め
      セグメント分解の意味が薄いため時間軸で分けた。会社計画は売上高 440,000・営業利益 50,000 百万円（fundamentals の採用値。
      前期比 +3.8%・+4.7%）。screen.py では2四半期連続の営業減益（MOMENTUM_NEGATIVE: Q2026-01_2026-03 -24.7%・Q2026-04_2026-06 -16.2%）。
      2026-09-01 に通期の伸びだけで「有望」と書いた事故の銘柄で、推定は会社計画を下回り営業利益は前期比マイナス"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 84922
              basis: actual
              source: "data/fundamentals/1969.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 94,205 に対し -9.9%。営業利益は 10,117→8,481 の -16.2%"
        - name: "2〜4Q（前年同期の売上×伸び）"
          expr: "prev_q2_q4 * growth"
          vars:
            prev_q2_q4:
              value: 329718
              basis: actual
              source: "data/fundamentals/1969.csv"
              note: "前年の Q2025-07_2025-09（100,296）・Q2025-10_2025-12（111,524）・Q2026-01_2026-03（117,898）の採用値の合計"
            growth:
              value: 1.02
              basis: assumed
              note: "残り3四半期の前年同期比。会社計画が含意する伸びは +7.7%（440,000−84,922＝355,078 ÷ 329,718）、1Q実績は -9.9%。
                産業設備（半導体・電池工場）の繰越工事高が減っている一方で一般設備（データセンター等）は残っており
                （reports/1969.md 展望節）、通期で前年並みを少し超える +2% と置いた。計画の +7.7% は1Qの減収幅から見て届きにくい"
    profit:
      op_margin:
        value: 0.105
        basis: assumed
        note: "通期実績 11.3%（FY2026-03 の採用値 47,745÷423,923）だが四半期では前期4Q 7.3%（8,650÷117,898）・今期1Q 10.0%（前年同期 10.7%）と
          下がっている。会社計画は 11.4%（50,000÷440,000）で前期並み。採算の良かった産業設備の比率低下が続くとみて、通期実績より
          0.8pt 低い 10.5% と置いた。4Qが前期並みに崩れればさらに下がる"
