# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し。株予報（https://kabuyoho.jp/report?bcode=4398、2026-10-09 取得）のコンセンサス欄は売上高・営業利益・経常利益とも
    「--」（予想アナリスト数の表示も無し）で、会社予想（売上 7,600・営業利益 750・経常 730 百万円、2026-08-12 付）だけが載っている。
    東証スタンダード・時価総額の小さい銘柄でセルサイドのカバーは無いとみる。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-06"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/4398.md はまだ無い）。会計上は単一セグメントだが、会社は売上を
      『セキュリティ監査・コンサルティング』『脆弱性診断』『情報漏えいIT対策』の3サービス区分で開示しており、その3区分で組む。
      区分ごとに駆動要因が違うので式も違える: 監査・コンサルは期首受注残からの消化（受注残→売上の倍率）、情報漏えいIT対策は
      定常収益（月額の監視・運用・保守・ライセンス）の積み上げ＋スポット、脆弱性診断は受注残が小さい短サイクル案件なので前期比の
      伸び率で置く。会社計画は売上 7,600・営業利益 750 百万円（前期比 +12.1%・+46.6%、営業利益率 9.9%）。会社は前期も当初予想
      （売上 7,100・営業利益 700）を 6,779・511 で未達にしており（総合ソリューション営業体制の本格稼働に時間を要した、と説明）、
      その前の FY2025-06 も減収減益だったため、計画をそのまま採らず区分ごとの実績ペースから積む。+10%感度で最も効くのは
      情報漏えいIT対策の定常収益の基数（+3.5%）、次いで監査・コンサルの期首受注残とその消化倍率（各 +2.8%）、脆弱性診断の基数（+2.7%）。
      基数は開示値なので、置き方で揺れるのは消化倍率と定常収益の伸び率で、いずれも一次情報で四半期配分を確認できていない（急所）。
      1Q決算（2026-11-11 予定）で区分別の出だしが分かるので、そこで置き直す前提。
      直近動向: 2026-10-06〜08 に国内で相次ぐ不正アクセス・情報漏えいを受けてサイバーセキュリティ関連株が軒並み急騰し、当社も
      動意株に名が挙がった（株探見出し 2026-10-06〜10-09、fetch_news）。当社は 2026-10-08 に『公開Webサービスの基本対策の
      再点検』を提言するリリースを出している。需要の追い風ではあるが、受注・売上への金額影響は開示が無く、本版の数値には
      織り込んでいない（株価の材料と業績は分けて考える）。
      出典: 2026年6月期 決算説明資料 https://www2.jpx.co.jp/disc/43980/140120260810517238.pdf
      ／2026年6月期 決算短信 https://www2.jpx.co.jp/disc/43980/140120260812517750.pdf
      ／2027年6月期の業績予想について https://www2.jpx.co.jp/disc/43980/140120260810517239.pdf（いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "情報漏えいIT対策（監視・運用。定常収益＋スポット）"
          expr: "recurring_fy26 * (1 + recurring_growth) + spot_and_other"
          vars:
            recurring_fy26:
              value: 2389
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/43980/140120260810517238.pdf（2026-10-09取得）"
              note: "2026年6月期の情報漏えいIT対策（国内売上）の定常収益。決算説明資料 p9 のグラフ値。推移は 22/6期 1,849 → 2,028 → 2,222 →
                2,273 → 26/6期 2,389（前期比 +5.1%）。内容はセキュリティ監視・運用・保守、ライセンス・サブスクリプション等"
            recurring_growth:
              value: 0.08
              basis: assumed
              note: "定常収益の伸び率。直近1年は +5.1%、22/6期→26/6期の年率は約 +6.6%。期末受注残は全体で 2,917→3,183（+9.1%、説明資料 p6）、
                うち監査・コンサル分が 668→762 なので残り（情報漏えいIT対策＋脆弱性診断）は 2,249→2,420（約 +7.6%）。情報漏えいIT対策の
                受注残 2,148 は1年以上契約の定常収益源が中心と会社が説明しており、受注残の伸びに寄せて +8% と置いた。26/6期 4Q の
                同区分売上 835 を単純に4倍すると 3,340 で、本セグメントの推定 約3,340 とほぼ同水準＝『4Q の水準が通期続く』程度の
                仮定。会社計画が強調する G-MDR（アウトソーシング型 MDR）の『本格的な業績貢献開始』はこの中に含めており、上乗せは
                していない（金額の開示が無い）。伸び率そのものの +10%感度は小さい（0.08→0.088）が、伸び率 1pt の違いが売上 約24 に当たり、
                掛ける先の定常収益の基数（recurring_fy26）が +10%感度で最も効く変数"
            spot_and_other:
              value: 762
              basis: assumed
              note: "区分売上 3,151（説明資料 p7）から国内定常収益 2,389 を引いた残り＝国内スポット 706（セキュリティ機器販売・運用サービス
                初期費用・緊急対応等、p9）＋国内外差分 約56。スポットは 22/6〜26/6期で 522・604・734・549・706 と年により振れが大きく
                傾向が読めないため、前期と同額に据え置いた（情報漏えい事故の多発は緊急対応の追い風だが金額は置けない）"
        - name: "セキュリティ監査・コンサルティング（期首受注残からの消化）"
          expr: "consulting_backlog_start * consulting_revenue_per_backlog"
          vars:
            consulting_backlog_start:
              value: 762
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/43980/140120260810517238.pdf（2026-10-09取得）"
              note: "2026年6月期末（＝2027年6月期の期首）の監査・コンサルティングの受注残。決算説明資料 p6。推移は 22/6期末 395 → 502 → 587 →
                668 → 26/6期末 762（過去最高）。会社は『案件獲得の起点となる監査・コンサルティングの受注残も順調に積み上げ』と説明"
            consulting_revenue_per_backlog:
              value: 2.75
              basis: assumed
              note: "期首受注残1に対する当期売上の倍率。実績は 23/6期 1,360÷395＝3.44、24/6期 1,701÷502＝3.39、25/6期 1,603÷587＝2.73、
                26/6期 1,849÷668＝2.77（売上は説明資料 p7、受注残は p6）。受注残の積み上がりとともに倍率は 3.4 台から 2.7 台へ低下しており
                （アドバイザリー等の長めの契約が増え、期中に取って期中に売る割合が下がったと解釈）、直近2期の 2.73〜2.77 を採って 2.75。
                結果は 約2,096（前期比 +13%）で、26/6期 4Q の同区分売上が前年同期比 +22.7%（p8）だったことと整合的。
                ただし受注残の消化時期（四半期配分）は一次情報で確認できていない。+10%感度は +2.8%（売上側では基数の次に効く変数）。
                倍率が 24/6期以前の 3.4 に戻れば売上 約2,590（+500）、逆に 2.5 まで落ちれば 約1,905 と幅が大きい"
        - name: "脆弱性診断（短サイクル。前期比の伸び率）"
          expr: "vuln_fy26 * (1 + vuln_growth)"
          vars:
            vuln_fy26:
              value: 1778
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/43980/140120260810517238.pdf（2026-10-09取得）"
              note: "2026年6月期の脆弱性診断の売上高。決算説明資料 p7。推移は 23/6期 1,705 → 1,766 → 1,610（25/6期、減収）→ 26/6期 1,778（+10.5%、過去最高）"
            vuln_growth:
              value: 0.10
              basis: assumed
              note: "受注残が 272（全体の 9%、p6）と小さく短サイクルなので、受注残ではなく伸び率で置く。26/6期は上期 798（354＋444）が前年同期比 -3%、
                下期 978（605＋373）が同 +24% と下期に伸びが集中（p8 の四半期グラフから読み取り）。下期の 978 を単純に2倍した 1,956 は
                前期比 +10% に当たり、通期の伸び率 +10.5% とも一致するのでこれを採る。監査・コンサルからのクロスセルで案件を取る体制が
                定着したと会社が説明する一方、25/6期には -9% の減収もあった区分で、下振れの前例がある点に注意"
    profit:
      op_margin:
        value: 0.092
        basis: assumed
        note: "全社売上に掛ける営業利益率。26/6期実績 7.5%（511÷6,779）、会社計画 9.9%（750÷7,600）の間。費用構造は 26/6期で売上原価 68.8%・
          販管費 23.6%（説明資料 p3）で、会社は『売上原価や販管費は一定程度に抑えられるため売上が増加するほど利益が増加する収益構造』と
          説明（p4）。実際 25/6期→26/6期は増収 675 に対し営業増益 253（増分利益率 約37%）。会社計画は増収 821 に対し増益 239（同 約29%）。
          本版の推定売上 約7,390（増収 約610）に増分利益率 30% を当てると 511＋約185＝約695（9.4%）。そこから、従業員 254名（2026-06末、p23）
          体制でのコンサルタント・エンジニア採用・育成費の増加、本社移転（2026-07-15 開示。時期・費用影響の金額は未確認）、
          26/6期経常に入っていた秋田県の本社機能移転補助金 約40（営業外、p3 注）が営業利益には無関係である点を踏まえ、少し削って 9.2% と置いた。
          過去の営業利益率は 23/6期 9.0%・24/6期 10.7%・25/6期 4.2%・26/6期 7.5%（fundamentals）で、9.2% は 24/6期に次ぐ高さである点に注意"
