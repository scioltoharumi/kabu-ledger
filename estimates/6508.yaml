# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "みんかぶ 証券アナリスト予想（6人: 強気買い3・買い1・中立2）"
  revenue: 370993
  source: "https://minkabu.jp/stock/6508/analyst_consensus（2026-09-05取得。2027年3月期の売上高コンセンサス 370,993百万円。同ページに営業利益のアナリスト予想は掲載なし）"
  note: "営業利益のコンセンサスは掲載が無いため載せない（純利益予想 28,613百万円は営業利益ではないので使わない）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: draft
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分。セグメント（電力インフラ・社会システム・
      産業電子モビリティ・フィールドエンジニアリング等）の通期売上は台帳に一次情報の転記が無く、時間軸で分けた。会社計画は売上高 365,000・
      営業利益 33,000 百万円（fundamentals の採用値。前期比 +11.9%・+21.7%）。この会社は4Qに売上と利益が集中する（前期は4Qだけで
      売上の 37.5%・営業利益の 73.9%）ため、1Qの前年同期比（営業利益 348→4,664）は水準が低い四半期どうしの比較で、率をそのまま
      通期に延ばさない。推定は売上・営業利益とも会社計画とほぼ同じ"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 73412
              basis: actual
              source: "data/fundamentals/6508.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 58,390 に対し +25.7%。営業利益は 348→4,664（利益率 0.6%→6.4%）"
        - name: "2〜4Q（前年同期の売上×伸び）"
          expr: "prev_q2_q4 * growth"
          vars:
            prev_q2_q4:
              value: 267804
              basis: actual
              source: "data/fundamentals/6508.csv"
              note: "前年の Q2025-07_2025-09（72,752）・Q2025-10_2025-12（72,713）・Q2026-01_2026-03（122,339）の採用値の合計"
            growth:
              value: 1.09
              basis: assumed
              note: "残り3四半期の前年同期比。会社計画が含意する伸びは +8.9%（365,000−73,412＝291,588 ÷ 267,804）。受注生産で売上は過去の受注から
                立つため、1Qの +25.7% ではなく受注の伸びで置く。1Qの受注高は前年同期比 +12.4%（2027年3月期第1四半期決算補足資料、
                https://finance-frontend-pc-dist.west.edge.storage-yahoo.jp/disclosure/20260731/20260730503953.pdf 取得日 2026-08-31）、
                前期通期の受注は -6.6% と一度落ちている。受注残高は開示が無く、計画並みの +9% と置いた"
    profit:
      op_margin:
        value: 0.09
        basis: assumed
        note: "通期実績 8.3%（FY2026-03 の採用値 27,122÷326,194）、1Q実績 6.4%（前年同期 0.6%）、会社計画 9.0%（33,000÷365,000）。
          4Q集中型で通期利益率は4Q（前期 16.4%）でほぼ決まる。1Qで前年同期比 +5.8pt 改善したぶんを通期に薄く乗せ、計画と同じ 9.0% と置いた。
          前期の改善（7.1%→8.3%）が続くかどうかは4Qの受注案件の採算次第で、当台帳には見えていない"
