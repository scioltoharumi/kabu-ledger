# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "数値を確認できず。株予報（https://kabuyoho.jp/sp/report?bcode=6523、2026-10-09）はコンセンサス欄が「--」で会社予想のみ、
    みんかぶのアナリスト予想ページ（https://minkabu.jp/stock/6523/analyst_consensus、2026-10-09）は 403、Yahoo!ファイナンスの
    業績・コンセンサスページ（2026-10-09）は 500 で取得できなかった。検索結果の要約では Investing.com が目標株価のアナリスト 7 名
    （Buy1／Hold6）、Stockopedia が EPS コンセンサス 131 円を載せているとされ、カバー自体は存在するが、売上・営業利益の
    コンセンサス値は出典ページで直接確認できていないため載せない。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。報告セグメント3つ（糖尿病マネジメント＝血糖測定 BGM／ヘルスケアソリューション＝
      国内の臨床検査 LSIM・医療IT・CRO／診断・ライフサイエンス＝病理 Epredia・ライフサイエンス PHCbi）＋本社・その他に分け、
      各セグメントは『前期実績（会社計画の為替前提 EUR165／USD145 に換算）× 自律成長率』で置く。為替は会社開示の感応度
      （1円の円安で売上 EUR+375／USD+470 百万円）を使い、計画前提からの乖離を別建てで足す（会社計画の前提は本日の実勢より
      大きく円高側なので、ここが最大の上振れ要因）。会社計画は売上 3,597 億円（前期比 -1.3%）・営業利益 270 億円（+19.0%）。
      減収計画は円高前提（-90 億円）と CGM 事業譲渡（-35 億円）によるもので、為替除きでは +1.2% の増収計画。
      1Q（2026-04〜06）実績は売上 90,672・営業利益 10,413 百万円（利益率 11.5%、前年同期 4.6%）で、営業利益は通期計画の
      38.6% を1四半期で消化。会社は『現在の傾向が続けば上方修正を検討しうるが、上期の見直しまで据え置く』旨を説明した
      （Quartr の決算要約。1Q 決算説明資料・短信の原本は eir-parts の一覧が JS 描画で URL を特定できず、取得できていない。
      セグメント別の1Q実績は未確認）。2026-10-01 に東邦ホールディングスから株式取得に係る法的拘束力のない初期的提案を
      受領したと開示、2026-10-09 に東邦側が検討終了を通知したと開示。本モデルの変数には影響させていない。
      fundamentals の会社計画行（revenue_plan／operating_income_plan）は SINGLE_SOURCE のため estimate.py の計画比には出ない。
      出典: 2026年3月期 決算説明資料（2026-05-13）https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf
      ／当社に関する一部報道について（2026-10-01）https://ssl4.eir-parts.net/doc/6523/tdnet/2889847/00.pdf
      ／同 その後の状況について（2026-10-09）https://ssl4.eir-parts.net/doc/6523/tdnet/2893633/00.pdf
      ／Quartr 1Q FY2027 要約 https://quartr.com/events/phc-holdings-corporation-6523-q1-2027_FPx71KT7
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "糖尿病マネジメント（BGM。CGM 譲渡後・計画為替前提）"
          expr: "dm_base_ex_cgm * dm_fx_plan_factor * dm_organic"
          vars:
            dm_base_ex_cgm:
              value: 98100
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.17・p.28"
              note: "2026年3月期の糖尿病マネジメント売上収益 1,016 億円（p.17）から、2027年3月期計画の売上ブリッジ（p.28）に
                ある CGM 事業譲渡影響 -35 億円を引いた 981 億円。CGM は米国分を 2026-01-01 に Senseonics へ移管済み、欧州分は
                2026-06-30 までに移管完了予定（決算説明資料・薬事日報 2026-05-15 の記事）"
            dm_fx_plan_factor:
              value: 0.953
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.28・p.30"
              note: "会社計画の為替前提（EUR165／USD145。前期実績 175／151）への換算係数。p.30 の DM 計画 923 億円＝
                1,016 - 35（CGM）- 12（自律減）- 為替 から為替影響を -46 億円と逆算し、1 - 46/981 = 0.953。
                連結の為替影響 -90 億円（p.28）のうち DM と D&LS でほぼ全部を占める計算になり整合する"
            dm_organic:
              value: 1.00
              basis: assumed
              note: "為替・CGM を除いた BGM の自律成長率。会社計画は -12 億円（約 -1.2%）で『先進国の市場縮小が継続も、米国の
                安定化と欧米でのシェア獲得で縮小幅を抑制』（p.6・p.7）。前期は為替除きで -0.9%（CGM の販売増を含む）。
                一方 1Q は会社が『糖尿病マネジメントの販売好調・全地域での価格調整』を増収要因に挙げており（Quartr 要約）、
                計画の減収幅より良い。計画（-1.2%）と 1Q の勢いの中間として横ばい（1.00）に置いた。幅は -2%〜+1%。
                セグメント別の 1Q 実績は未確認（感度上位・一次情報で確認できていない）"
        - name: "ヘルスケアソリューション（LSIM・医療IT・CRO。国内）"
          expr: "hs_fy25_revenue * hs_organic"
          vars:
            hs_fy25_revenue:
              value: 128400
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.17"
              note: "2026年3月期実績 1,284 億円（LSIM 664・ヘルスケアITソリューション 530・CRO 90）。国内事業で為替影響なし"
            hs_organic:
              value: 1.025
              basis: assumed
              note: "会社計画は +37 億円（+2.9%）。増収要因は LSIM の遺伝子検査、電子カルテ・レセプト関連（電子カルテ 100% 化・
                医療DX 需要）。減収要因は電子処方箋需要の減少（前期も減少）と CRO（前期 -15.4%）の回復待ち。前期実績は
                +0.1% にとどまったため、計画 +2.9% をそのまま置かず、やや下の +2.5% とした。1Q のセグメント別実績は未確認"
        - name: "診断・ライフサイエンス（病理・ライフサイエンス。計画為替前提・インドネシア B to B 移管込み）"
          expr: "dls_base_at_plan_fx * dls_organic"
          vars:
            dls_base_at_plan_fx:
              value: 128600
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.17・p.28・p.30"
              note: "2026年3月期実績 1,283 億円（病理 584・バイオメディカ 516・診断薬 184。p.17）＋ FY26 からインドネシアの B to B 事業を
                本社・その他から当セグメントへ移管した影響 +44 億円（p.28 注記）- 計画為替前提への換算 -41 億円
                （p.30 の計画 1,352 = 1,283 + 110 - 為替 から逆算）= 1,286 億円"
            dls_organic:
              value: 1.05
              basis: assumed
              note: "会社計画は移管除きで +66 億円（約 +5.1%）。『米国の市況復調は保守的に見込み、価格戦略と新製品で増収』（p.6）。
                前期は米国の機器需要停滞・関税約 10 億円の影響で -3.3%（為替除き）だが、4Q は増収に転じ大幅増益（p.16・p.21）。
                1Q は連結売上 +8.1%（前年同期比）で、為替の追い風（約 +4〜5 ポイント。注記参照）と CGM 譲渡の減収（約 -1 ポイント）を
                除いても +4% 強の自律成長になり、DM 横ばい・HS +2〜3% なら D&LS が計画以上に伸びた計算になるが、セグメント別の
                1Q 実績は未確認のため計画並みの +5% に置いた。米国アカデミア・政府関連需要（p.7 で『動向を注視』）が下振れ要因。
                為替注記: 1Q の平均相場は USD 159.4／EUR 185.4 円（七十七銀行仲値の月中平均）で、前年同期（USD 144.5 円。日銀 FM08）
                から USD +15 円・EUR +20 円超の円安。会社感応度（USD+470・EUR+375 百万円/年/円）で年 +150 億円＝四半期 +38 億円
                ≒ 前年同期売上 839 億円の 4.5%"
        - name: "本社・その他（インドネシア B to B 移管後の残り）"
          expr: "other_revenue"
          vars:
            other_revenue:
              value: 100
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.30"
              note: "会社計画 1 億円（前期 61 億円のうち 57 億円がインドネシア B to B 事業の移管で D&LS へ）。桁に効かないので計画値をそのまま置く"
        - name: "為替（会社計画前提 EUR165／USD145 からの乖離。会社開示の感応度で換算）"
          expr: "eur_dev * eur_rev_sens + usd_dev * usd_rev_sens"
          vars:
            eur_dev:
              value: 16
              basis: assumed
              note: "通期平均 EUR/JPY の計画前提 165 円からの乖離（円）。2026 年 4〜9 月の月中平均は 186.20／184.76／185.09／185.66／
                184.19／180.15 円（七十七銀行 ユーロ対円仲値一覧 https://www.77bank.co.jp/kawase/eur2026.html、2026-10-09 取得。
                上期平均 184.3 円）。2026-10-09 の日銀公表 17 時スポットは 177.83-87 円
                （https://www.boj.or.jp/statistics/market/forex/fxdaily/fxlist/fx261009.pdf、2026-10-09 取得）で、10 月は円高方向。
                下期を 178 円で横ばいと置くと通期平均 約 181 円、乖離 +16 円。下期の為替は未知（感度上位）"
            eur_rev_sens:
              value: 375
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.31"
              note: "年間を通じて 1 円の円安で売上収益 +375 百万円（営業利益は +50 百万円）。EUR・USD・JPY で売上の約 85%・営業利益の約 95%"
            usd_dev:
              value: 14
              basis: assumed
              note: "通期平均 USD/JPY の計画前提 145 円からの乖離（円）。2026 年 4〜9 月の 17 時時点月中平均は 159.28／158.34／160.69／
                162.45／158.81／156.23 円（日銀 時系列統計 FM08 https://www.stat-search.boj.or.jp/ssi/mtshtml/fm08_m_1.html、
                2026-10-09 取得。上期平均 159.3 円）。2026-10-09 の中心相場 158.10 円（日銀 外国為替市況）。下期 158 円横ばいで
                通期平均 約 158.7 円、乖離 +14 円。会社の営業利益感応度は USD 1 円で +25 百万円と小さく（米国に製造・コストもある）、
                売上の押し上げほどには利益に効かない点に注意（本モデルは全社利益率を掛けるので、この行の利益寄与はやや過大になる）"
            usd_rev_sens:
              value: 470
              basis: disclosed
              source: "https://ssl4.eir-parts.net/doc/6523/ir_material_for_fiscal_ym/203161/00.pdf（2026-10-09取得）p.31"
              note: "年間を通じて 1 円の円安で売上収益 +470 百万円（営業利益は +25 百万円）"
    profit:
      op_margin:
        value: 0.082
        basis: assumed
        note: "会社計画 7.5%（270÷3,597）、前期実績 6.2%（fundamentals の採用値 22,688÷364,403）、中計 FY27 目標 8〜10% の間。
          1Q 実績は 11.5%（10,413÷90,672）だが、調整後 EBITDA 17,253 百万円に『一過性項目』が含まれると会社が説明しており
          金額は未開示（Quartr 要約）。会社計画は残る 2Q〜4Q の営業利益を 16,587（四半期 5,529）としか見ておらず、前期 2Q〜4Q の
          平均 6,282（fundamentals: 6,535／6,730／5,580）を下回る。計画の利益ブリッジ（p.29）では CGM 譲渡で +58 億円、
          構造改革効果 +27 億円、値上げ +20 億円が年間で乗る一方、インフレ -37・投資拡大 -43 を見込む。CGM の赤字が消え、
          為替も計画より円安（会社感応度で営業利益 +約 11 億円）であることから、2Q〜4Q を四半期 6,700 前後（利益率 約 7.1%。
          前期 2Q〜4Q は 6.7%）と置き、1Q と合わせ通期 約 305 億円÷売上 約 3,730 億円 ≒ 8.2% とした。
          1Q の一過性項目の中身と期末の引当（前期 4Q に一時費用あり）が主な下振れ要因。11 月 11 日の 2Q 決算で置き直す前提"
