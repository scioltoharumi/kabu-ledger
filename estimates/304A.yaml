# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "確認できず。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/304A/analyst_consensus、2026-09-27）は取得が
    403 で拒否され、コンセンサスの有無を確かめられていない（東証グロース・時価総額の小さい銘柄でカバーは無い可能性が高いが未確認）。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2027-02"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。単一セグメント（デジタルビジネスプラットフォーム事業）だが、会社は売上を『月額収益』
      （保守運用・ライセンス・サービス利用料）と『開発収益』（進捗に応じて計上）に分けて開示しており、その2区分＋検収一括計上の
      大型案件1件で組む。会社計画は売上 3,113・営業利益 412 百万円（前期比 +41.7%・+477%）。この増収の核は、前期（FY2026-02）に
      監査法人との協議で『検収時点で計上』に変わり翌期へ繰り延べられた一部大型案件の売上で、会社は2Q（2026-06〜08）の計上を予定と
      説明している（1Q決算説明資料 p11）。その金額は開示されていない。+10%感度で最も効くのは通常の開発収益（1Qペース×係数）と月額収益で、一括分は +10% では小さいが、2Qに計上されるか否か（0か約400か）の二値の振れが大きい。
      2Q決算（2026-10-15）で一括分が計上されたか・いくらかが分かるので、そこで置き直す前提。
      出典: 2026年2月期 通期決算説明資料 https://contents.xj-storage.jp/xcontents/AS09136/1de05825/128b/44ce/b302/98b337edbd95/140120260414504185.pdf
      ／2027年2月期 第1四半期決算説明資料 https://contents.xj-storage.jp/xcontents/AS09136/b47b9c0d/0212/40af/9849/3d5dc9a8dae9/140120260714593270.pdf
      ／業績予想と決算値との差異に関するお知らせ https://contents.xj-storage.jp/xcontents/AS09136/4875a2ff/8c81/44ca/bb8d/62301fa0cbb8/140120260414504137.pdf
      （いずれも 2026-09-27 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "月額収益（SaaS型＋ソリューション型）"
          expr: "q1_monthly_revenue * annualize_monthly"
          vars:
            q1_monthly_revenue:
              value: 316
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS09136/b47b9c0d/0212/40af/9849/3d5dc9a8dae9/140120260714593270.pdf（2026-09-27取得）"
              note: "2027年2月期1Q（2026-03〜05）の月額収益。決算説明資料 p16 のグラフ値 SaaS型 208＋ソリューション型 108。
                前年同期（203＋116）は解約料を含むため微減に見えると会社が説明"
            annualize_monthly:
              value: 4.1
              basis: assumed
              note: "1Qの四半期額から通期への係数。SaaS型月額は FY2026 2Q〜FY2027 1Q で 179→180→198→208 と四半期 +10 前後で積み上がり、
                ソリューション型は 116→115→114→112→108 と四半期 -2〜-4 で逓減（p16 グラフ）。差し引き四半期 +5〜8 の増加が続くとして
                316→約322→約328→約334、通期 約1,300（係数 4.1）。会社計画の月額合計 1,233（SaaS 841＋ソリューション 392、通期説明資料 p18）は
                1Q実績×4＝1,264 すら下回っており、計画は月額をやや保守的に置いている"
        - name: "開発収益（進捗計上の通常分）"
          expr: "q1_dev_revenue * annualize_dev"
          vars:
            q1_dev_revenue:
              value: 349
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS09136/b47b9c0d/0212/40af/9849/3d5dc9a8dae9/140120260714593270.pdf（2026-09-27取得）"
              note: "1Q売上高 665（短信・fundamentals の採用値とも一致）から月額収益 316 を差し引いた値。会社は『新規大型案件の進捗に伴い
                SaaS型の開発収益が前年同期比 +133』と説明。検収計上の大型案件分はまだ含まない（2Q計上予定）"
            annualize_dev:
              value: 4.0
              basis: assumed
              note: "1Qの進捗計上ペースが通期続くと置いた。大手旅行会社向けの基幹システム刷新など『長期の大型案件が中心』（1Q資料 p10）で、
                複数年のプロジェクトが進行中と開示されているため期中の急減は想定しない。一方で案件の完了・サービスインで開発収益が
                月額に移る時期は開示されておらず、下振れ余地あり（感度上位。一次情報で四半期配分は確認できていない）。
                前期 FY2026-02 の開発収益は通期 975（四半期平均 約244）で、1Qの 349 はそれより高い"
        - name: "検収一括計上の大型案件（前期からの繰延）"
          expr: "deferred_project_revenue"
          vars:
            deferred_project_revenue:
              value: 400
              basis: assumed
              note: "金額は非開示。下限の手がかりは前期の業績予想 2,492 と実績 2,197 の差 295（差異のお知らせ。会社は差異の主因を当該案件の
                検収時点計上への変更とし、『その他の収益は概ね想定どおり』と説明＝通期資料 p8）。検収時の計上額には前期分に加え
                今期1Q〜2Qの進捗分も乗る。上限の手がかりは会社計画の開発収益 1,879（SaaS初期 1,728＋ソリューション初期 151）から
                1Qペース×4（1,396）を引いた 約483。295〜483 の中間やや上として 400 と置いた。+10%感度は小さい（営業利益 +1.3%）が、
                検収が期ずれすれば丸ごと消える二値の変数。2Q決算で実額が分かる"
    profit:
      op_margin:
        value: 0.12
        basis: assumed
        note: "1Q実績 11.1%（74÷665、fundamentals の採用値）と会社計画 13.2%（412÷3,113）の間。検収一括分は開発コストの多くが前期に
          費用計上済み（差異のお知らせ: 先行した開発体制拡充の費用が前期の利益減少として表れた）なので、計上される四半期の利益率を
          押し上げる。ただし原価の何割が前期負担かは開示が無く、計画の 13.2% までは置かなかった。過去の営業利益率は
          FY2024-02 7.1%・FY2025-02 9.3%・FY2026-02 3.2%（fundamentals）で、12% は過去最高水準である点に注意"
