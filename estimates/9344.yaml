# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/9344/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2027-06"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。6月決算で新しい期の四半期実績がまだ1つも無いため、直近四半期（4Q）の売上×年率換算係数の1区分で置く。
      会社の売上の分解（人材紹介＝平均年収×手数料率×入社決定人数、スキルシェア＝月額単価×稼働人数）は変数の開示が無く組めない。
      2026年2月にサン・システムプランニングを連結しており、前期（FY2026-06）は上期と下期で会社の中身が違う。会社計画は売上高 9,600・
      営業利益 800 百万円（fundamentals の採用値。前期比 +15.8%・+62.6%）。推定は売上・営業利益とも会社計画をやや上回るが、
      実績が1四半期も無い段階の数字で、11月の1Q決算で置き直す前提"
    revenue:
      unit: JPY_million
      segments:
        - name: "通期（直近四半期の売上×年率換算）"
          expr: "q4_revenue * annualize"
          vars:
            q4_revenue:
              value: 2830
              basis: actual
              source: "data/fundamentals/9344.csv"
              note: "Q2026-04_2026-06（前期4Q）の採用値。サン・システムプランニングが丸ごと入った最初の四半期。前年同期 1,489 に対し +90.1%"
            annualize:
              value: 3.5
              basis: assumed
              note: "4Qから通期への換算係数。単純年率換算は 4.0 だが、この会社は4Q（4〜6月。人材紹介の入社決定が集中）が最も強く、
                連結前の FY2025-06 では4Qが通期の 28.2%（係数 3.54）だった。FY2026-06 は下期だけ連結が入ったため 34.1%（2.93）まで偏るが、
                この歪みは今期は消える。3.5 と置いた。前期3Q・4Qの平均を4倍すると 10,270 で、それより低い側にある"
    profit:
      op_margin:
        value: 0.09
        basis: assumed
        note: "前期通期 5.9%（492÷8,289）だが、1Q（7〜9月）に -255 の損失があり、下期だけなら 13.3%（683÷5,135）。会社計画 8.3%（800÷9,600）。
          人材紹介はフロー型で四半期の振れが大きく、1Qの損失が毎年出る形かは前期1期分では分からない。下期の率と計画の間の 9% と置いた"
