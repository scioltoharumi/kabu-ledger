# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未取得。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/5137/analyst_consensus）を
    2026-09-05 に取得しようとしたが HTTP 403 で読めず、コンセンサスの有無そのものを確認できていない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2026-09"
    status: draft
    note: "初版（Claude 起案・人間未確認）。9月決算で3Qまで実績が出ているため、1〜3Q実績（確定分）＋4Q（直近四半期×前四半期比）の2区分。
      4Qを前年同期比で置かないのは、2026年1月に完全子会社化したインターゾーンが3Qから丸ごと連結され、前年同期と地続きでないため。
      会社計画は売上高 4,583・営業利益 743 百万円（fundamentals の採用値。前期比 +59%・+91%）。会社自身が3Q時点の進捗率
      （売上 63%・営業利益 42%）が前年同期を下回ると書いており（reports/5137.md）、推定は売上・営業利益とも会社計画を下回る"
    revenue:
      unit: JPY_million
      segments:
        - name: "1〜3Q実績（2025年10月〜2026年6月・確定分）"
          expr: "ytd_revenue"
          vars:
            ytd_revenue:
              value: 2882
              basis: actual
              source: "data/fundamentals/5137.csv"
              note: "Q2025-10_2025-12（729）・Q2026-01_2026-03（855）・Q2026-04_2026-06（1,298）の採用値の合計。前年同期 2,112 に対し +36.5%。
                営業利益は 259→309 の +19.3%（利益率 12.3%→10.7%）"
        - name: "4Q（2026年7〜9月・直近四半期×前四半期比）"
          expr: "q3_revenue * qoq"
          vars:
            q3_revenue:
              value: 1298
              basis: actual
              source: "data/fundamentals/5137.csv"
              note: "Q2026-04_2026-06 の採用値。インターゾーンが丸ごと入った最初の四半期で、前年同期比 +90.6%"
            qoq:
              value: 1.10
              basis: assumed
              note: "会社計画が含意する4Qは 1,701（4,583−2,882。3Q比 +31%）。前期の3Q→4Qは 681→766 の +12%、契約社数は前年同期比 +25% で
                積み上がっているため、前期並みの +10% と置いた。計画の +31% は AI Mobility OS の大型案件が4Qに立つ前提とみられ、当台帳では確認できない"
    profit:
      op_margin:
        value: 0.12
        basis: assumed
        note: "3Q累計 10.7%、3Q単独 13.1%（170÷1,298）、前期通期 13.6%（390÷2,878）、会社計画 16.2%（743÷4,583）。計画どおりなら4Q単独で
          利益率 25.5%（434÷1,701）が要り、前期4Q（17.1%＝131÷766）を大きく超える。3Q単独の水準が続くとみて通期 12% と置いた。
          リカーリング比率 69% の SaaS 型なので売上が伸びれば利益率は上がるが、インターゾーンの利益率は開示が無い"
