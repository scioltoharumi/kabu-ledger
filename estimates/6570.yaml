# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー0社（レーティングを出している証券会社が無いことを
    reports/6570.md の裏取りで確認済み・2026-08-13取得）。機関のコンセンサス予想は
    存在しないため、比較対象は会社計画のみ"

models:
  - as_of: "2026-08-17"
    period: "FY2027-03"
    status: draft
    note: "初版。FY2026-03実績（data/fundamentals/6570.csv のOK値）と2027年3月期1Q決算短信のセグメント注記（2026-08-10開示）から組んだ。推定売上は会社計画26,870百万円を約+18%上回るが、これは1Q実績（売上+69.4%・営業利益進捗38%）の年率換算に対して8/10据え置きの会社計画が保守的に見えるためで、当てにいかずギャップのまま残す"
    revenue:
      unit: JPY_million
      segments:
        - name: "アミューズメント施設運営"
          expr: "stores * sales_per_store"
          vars:
            stores:
              value: 80
              basis: assumed
              note: "期中平均店舗数。1Q末76店・1Q中3出店（短信）から期初は73店、7〜8月もアピナ小山駅前・クレーンパラダイス諏訪・アピナ高梁と出店が継続（reports/6570.md 週次記録）しており、下期も同ペースの出店を見込んで期中平均80店と置いた"
            sales_per_store:
              value: 280
              basis: assumed
              note: "店舗あたり年間売上（百万円）。1Qセグメント売上5,085百万円（短信）÷1Q平均約74.5店（期初73店と1Q末76店の平均）＝四半期68.3百万円の単純年率換算×4で273。1Qは例年最も弱い四半期（前年は1Qが通期売上の21%）のため季節性ぶんを約+3%上乗せして280と置いた"
        - name: "アミューズメント機器販売"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 292.533
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260810516597.pdf（2027年3月期1Q決算短信・セグメント情報等の注記。取得日2026-08-16）"
              note: "1Qセグメント売上292,533千円（前年同期比+244.1%）"
            annualize:
              value: 4.0
              basis: assumed
              note: "案件ごとにまとまって入る受注型で四半期の季節性を判断する材料が無いため単純年率換算（×4）と置いた。1Qの+244.1%が続く保証は無いが、縮むと置く根拠も無い"
        - name: "その他（道楽・ブルーム・広告等）"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 2005.692
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260810516597.pdf（2027年3月期1Q決算短信・セグメント情報等の注記。取得日2026-08-16）"
              note: "1Qセグメント売上2,005,692千円（前年同期比+704.5%）。道楽の新規連結とブルームの伸びが混在"
            annualize:
              value: 4.0
              basis: assumed
              note: "道楽は2026年2月1日連結でFY2027は4四半期とも寄与する初年度のため、前年比の段差は通年で続く。トレカ相場とスクイーズの季節性を判断する材料が無いため、1Q水準の継続（×4）と置いた"
    profit:
      op_margin:
        value: 0.09
        basis: assumed
        note: "FY2026-03実績8.48%（data/fundamentals/6570.csv のOK値）と1Q実績10.2%（営業利益756÷売上7,383百万円・短信）の間の9.0%と置いた。会社計画7.44%は出店先行費用による利益率低下を見込むが、1Qですでに計画を大きく上回り、高利益率の「その他」（1Qセグメント利益率16.0%）が通期寄与するため計画より高く、トレカ相場と出店費用のリスクを引いて1Q実績よりは低く見た"

  - as_of: "2026-08-17"
    period: "FY2027-03"
    status: confirmed   # 2026-08-17 マスター承認（「中身は良いです」）
    note: "論理レビュー反映（初版の差し替え。初版はそのまま残す）: ①施設運営の分解を stores × sales_per_store から 1Q実額×年率換算に変えた——初版は施設運営セグメントの売上を『総店舗数』で割って『総店舗数』に掛けており、7〜8月の新規6店のうち3店（トレーディングカードピット小山駅前・トレカ道楽横浜西口・MOOOSH SQUISHY SoLaDo原宿）が『その他』セグメントの店である以上、その他の出店を施設運営の増収として数える形になっていた ②年率換算の係数を四半期実績からの実測値に置き直した——初版は『1Qは通期売上の21%』を根拠に挙げながら+3%しか上乗せしておらず、根拠と値が合っていなかった（21%なら+19%相当） ③op_margin を推定売上のセグメント構成で組み直した（9.0%→10.2%）。推定売上は会社計画26,870百万円を約+21%、営業利益は2,000百万円を約+65%上回る。8/10据え置きの会社計画に対する乖離は当てにいかずギャップのまま残す"
    revenue:
      unit: JPY_million
      segments:
        - name: "アミューズメント施設運営"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 5085.352
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260810516597.pdf（2027年3月期1Q決算短信・セグメント情報等の注記。取得日2026-08-16）"
              note: "1Qセグメント売上5,085,352千円（前年同期比+26.4%）。初版は店舗数から積み上げていたが、短信が施設運営セグメントの売上を実額で開示している以上、まず実額を置いて換算係数だけを仮定にするほうが仮定の数が減る"
            annualize:
              value: 4.57
              basis: assumed
              note: "1Q売上から通期への換算係数。道楽連結前の3期は1Qが通期売上に占める比率が21.50%（FY2023-03）・22.14%（FY2024-03）・22.02%（FY2025-03）で平均21.89%、その逆数が4.57（data/fundamentals/6570.csv の四半期売上のOK値から算出）。この比率には夏（7-9月）と冬から春（1-3月）が強い季節性と、期中の出店による成長の両方が入っている。したがって店舗数の増加率を別の変数として掛けると成長を二重に数えるため、この版では店舗数の変数を置かない。FY2026-03（21.02%＝係数4.76）は道楽の2026年2月連結で4Qが膨らみ比率が下がるため平均から外した。今期の施設運営の出店は1Q中3店に加え7〜8月にアピナ小山駅前・クレーンパラダイス諏訪・アピナ高梁の3店で、過去平均並みのペースにある（reports/6570.md 週次記録）"
        - name: "アミューズメント機器販売"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 292.533
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260810516597.pdf（2027年3月期1Q決算短信・セグメント情報等の注記。取得日2026-08-16）"
              note: "1Qセグメント売上292,533千円（前年同期比+244.1%）"
            annualize:
              value: 4.0
              basis: assumed
              note: "案件ごとにまとまって入る受注型で四半期の季節性を判断する材料が無いため単純年率換算（×4）と置いた。施設運営に掛けた4.57は同社の四半期売上3期ぶんから実測した係数であり、内訳の四半期推移が開示されていないこのセグメントには持ち込まない（測れない季節性を推測で上乗せしない）。1Qの+244.1%が続く保証は無いが、縮むと置く根拠も無い"
        - name: "その他（道楽・ブルーム・広告等）"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 2005.692
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260810516597.pdf（2027年3月期1Q決算短信・セグメント情報等の注記。取得日2026-08-16）"
              note: "1Qセグメント売上2,005,692千円（前年同期比+704.5%）。道楽の新規連結とブルームの伸びが混在"
            annualize:
              value: 4.0
              basis: assumed
              note: "道楽は2026年2月1日連結でFY2027は4四半期とも寄与する初年度のため、前年比の段差は通年で続く。道楽連結後の四半期が1期しか無く季節性を測れないため、1Q水準の継続（×4）と置いた。施設運営だけ4.57で当セグメントが4.0なのは方針の揺れではなく『実測できた季節性だけ入れる』という一貫した扱い。買取・物販なので実際には年末年始が強い可能性があり、その場合この×4は過小になる。逆にトレカ相場が崩れれば過大になる（感応度でいちばん効く売上側の変数がここ）"
    profit:
      op_margin:
        value: 0.102
        basis: assumed
        note: "推定売上のセグメント構成で組み直した。1Qのセグメント利益率は施設運営10.64%（541,231÷5,085,352千円）・機器販売29.06%（85,000÷292,533）・その他15.99%（320,688÷2,005,692）と大きく開いており、単一の率を総売上に掛ける近似は構成が変わるほど歪む。この版の推定売上の構成（施設運営71.7%・機器販売3.6%・その他24.7%）に各セグメント利益率を当て、全社調整額（1Q -190,617千円＝連結営業利益756,302千円−3区分合計946,919千円）を年換算×4して引くと10.28%になり、これを切り捨てて10.2%と置いた。初版の9.0%はFY2026-03実績8.48%（その他がほぼ無かった期）と1Q実績10.24%の間を取った値で、その他が通期売上の約1/4を占めるこの構成を映していなかった。なお当てた利益率は1Q（例年もっとも利益率の低い四半期。FY2026-03は1Q 5.46%に対し通期8.48%）の値なので、置き方としてはむしろ低めに出る。下振れ要因は出店の先行費用とトレカ相場、上振れ要因は下期の季節性"
