# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未取得。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/1942/analyst_consensus）を
    2026-09-05 に取得しようとしたが HTTP 403 で読めず、コンセンサスの有無そのものを確認できていない。
    比較対象は会社計画のみ（会社計画は台帳の fundamentals に採用値が無いため、下の note に一次情報から転記）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: draft
    note: "初版（Claude 起案・人間未確認）。1Q実績（確定分）＋残り3四半期（前年同期×伸び）の2区分で組む。
      報告セグメントが設備工事1本で事業別の売上開示が無く、工事種別の内訳は受注ベースしか無いため、
      時間軸で分けた。会社計画は売上高 780,000・営業利益 90,000 百万円（2027年3月期第1四半期決算短信 p.1、
      https://www.kandenko.co.jp/ir/settled-account/assets/pdf/fb01c1a21f0a5293afe8cb1f68568591185f4b73.pdf
      取得日 2026-09-05。前期比 +5.1%・+8.3%）。台帳の fundamentals には計画の採用値が無いので、
      銘柄ページの会社計画比は空欄になる。推定売上は計画をやや下回り、営業利益はほぼ計画並み"
    revenue:
      unit: JPY_million
      segments:
        - name: "1Q実績（2026年4〜6月・確定分）"
          expr: "q1_revenue"
          vars:
            q1_revenue:
              value: 158043
              basis: actual
              source: "data/fundamentals/1942.csv"
              note: "Q2026-04_2026-06 の採用値。前年同期 165,567 に対し -4.5%（売上は減ったが営業利益は 17,476→19,719 の +12.8%。利益率 10.6%→12.5%）"
        - name: "2〜4Q（前年同期の売上×伸び）"
          expr: "prev_q2_q4 * growth"
          vars:
            prev_q2_q4:
              value: 576455
              basis: actual
              source: "data/fundamentals/1942.csv"
              note: "前年の Q2025-07_2025-09（175,071）・Q2025-10_2025-12（170,943）・Q2026-01_2026-03（230,441）の採用値の合計"
            growth:
              value: 1.06
              basis: assumed
              note: "残り3四半期の前年同期比。上限側は会社計画が含意する伸び（780,000−158,043＝621,957 は前年同期比 +7.9%）、
                下限側は1Qの実績 -4.5%。受注は先に積み上がっており（2026年3月期の単体新規受注 +13.0%・1Q +11.2%、
                受注が完成工事高を 937億円 上回る。reports/1942.md 展望節、出典は決算参考資料）、1Qの減収は工事の進捗の
                振れとみて計画寄りの +6% と置いた。受注が売上に変わる速さ（人手）が上限を決める"
    profit:
      op_margin:
        value: 0.118
        basis: assumed
        note: "通期実績 11.2%（FY2026-03 の採用値 83,140÷742,022）と1Q実績 12.5%（19,719÷158,043）の間。
          会社計画は 11.5%（90,000÷780,000）。1Qで利益率が前年同期比 +1.9pt 改善しており、採算の良い案件の
          比率が上がっているとみて計画より高く置いたが、前期4Q（10.7%）まで戻る可能性を見て1Q水準までは上げない"
