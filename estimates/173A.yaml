# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバーは確認できず。株予報のアナリスト予想ページ（https://kabuyoho.jp/sp/reportAnalyst?bcode=173A、2026-10-09 取得）は
    コンセンサスの経常増益率が『--』で、業績予想欄の売上 5,287・営業利益 883 百万円は会社計画と同一値（＝コンセンサスではなく
    会社予想の転記と判断）。マネックス銘柄スカウター（https://scouter.monex.co.jp/report/disclose/173A、2026-10-09 取得）は
    コンセンサス欄が非ログインでは伏せ字で中身を確かめられず、みんかぶのアナリスト予想ページは 403 で取得できなかった。
    東証グロース・時価総額 100 億円前後の銘柄でカバー 0〜1 社の可能性が高いが、0 であることまでは確認できていない。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/173A.md は未作成）。会社は単一セグメントだが短信・説明資料で
      ソリューション3区分（ネットワーク＝AssetView／セールスDX＝ホットプロファイル／AIデータエントリー＝AI-OCR）の売上を開示しており、
      その3区分で組む。収益の 89.3%（1Q）がリカーリングで、ネットワークのクラウドとセールスDX（OEM除く）は四半期末 ARR が開示されて
      いるため、リカーリング部分は『期首 ARR と期末 ARR の平均≒年間売上』で置く（1Q 実績で検算: クラウド売上 387 に対し
      (1,531+1,565)/2/4＝387 で一致）。残りの非リカーリング（オンプレライセンス・役務・OEM・初期導入）は 4Q 偏重で季節性が強いため、
      1Q×4 ではなく前期実績と 1Q の前年比から年額を置いた。
      会社計画は売上 5,287・営業利益 883 百万円（前期比 +8.1%・+5.9%、1Q 時点で据え置き）。当推定は売上 約5,190・営業利益 約855 で、
      計画をわずかに下回る。差の主因はネットワークのクラウド ARR 伸びの置き方（1Q の純増 +34 が直近 13 四半期で最小だった点を織り込み、
      会社計画が示唆する +23% より低い +19% に置いた）とセールスDXの OEM・フロー分。
      +10% 感度で効くのは営業利益率（定義上）、次いでセールスDX 期首 ARR（+2.4%）・オンプレ保守の 1Q 額と年率換算係数（各 +2.3%）・
      クラウド期末 ARR（+1.8%）。ただし開示値（期首 ARR・1Q 額）は動かない前提なので、仮定で効くのは保守の換算係数と
      クラウド期末 ARR。
      2Q 決算（2026-11-13 予定）でクラウド ARR の純増が +80 前後に戻るかが最初の確認点。
      出典: 2027年3月期 第1四半期決算説明資料 https://www2.jpx.co.jp/disc/173A0/140120260807514309.pdf
      ／同 決算短信 https://www2.jpx.co.jp/disc/173A0/140120260807514275.pdf
      ／ログミーFinance 書き起こし https://finance.logmi.jp/articles/385683（いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "ネットワーク（AssetView）クラウドサービス"
          expr: "(cloud_arr_fy_start + cloud_arr_fy_end) / 2"
          vars:
            cloud_arr_fy_start:
              value: 1531
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/173A0/140120260807514275.pdf（2026-10-09取得）"
              note: "2026年3月期 4Q 末（＝当期首）のクラウドサービス ARR。短信 p3 の表（1Q 1,236 → 2Q 1,352 → 3Q 1,412 → 4Q 1,531 →
                2027/3期 1Q 1,565）。ARR は四半期末 MRR×12。年間売上≒期中平均 ARR と置く近似は、2027/3期 1Q のクラウド売上 387
                （説明資料 p18）＝(1,531+1,565)/2/4 で検算済み。前期（2026/3期）も同じ近似で 1,332 対 実績 1,356 と 2% 以内"
            cloud_arr_fy_end:
              value: 1820
              basis: assumed
              note: "2027年3月期末のクラウド ARR。前年比 +18.9%。四半期純増の実績は 2026/3期 +113・+116・+60・+119（通期 +408、+36%）、
                2027/3期 1Q は +34（1,531→1,565）と 13 四半期で最小。会社は『AssetView Cloud＋の導入加速』『クラウド売上好調』と説明し
                （説明資料 p5・短信 p3）、2026-09-28 に Entra ID 連携の新版（kabutan 開示）も出しているが、1Q の鈍化の理由は
                開示されていない。残り 3 四半期を +85/四半期（2026/3期平均 +102 と 1Q +34 の間）として 1,565+255＝1,820 と置いた。
                会社計画のネットワーク 3,400 を保守 1,213・ライセンス役務 460 で逆算するとクラウド 約1,727＝期末 ARR 約1,920（+25%）が
                必要で、当推定は計画より慎重。+10% 感度は +1.8%（仮定変数の中では保守の換算係数に次ぐ）。期中平均の近似は 1Q が低かった分だけ 1〜2% 上振れ
                （四半期ごとに積むと 約1,656 対 平均法 1,676）。チャーンは月 0.38%（12か月平均）で低位だが前年 0.29% から上昇中（短信 p3）"
        - name: "ネットワーク（AssetView）オンプレミス保守・サブスク"
          expr: "q1_onprem_maint_revenue * annualize_maint"
          vars:
            q1_onprem_maint_revenue:
              value: 307
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/173A0/140120260807514309.pdf（2026-10-09取得）"
              note: "2027/3期 1Q の『保守・サブスク』売上（説明資料 p18 内訳グラフ）。前年同期 319 → 307（p13 増減内訳の △12 と一致）。
                四半期推移は 2024/3期 325→327→315→323、2025/3期 328→327→322→320、2026/3期 319→319→315→317 と緩やかな逓減"
            annualize_maint:
              value: 3.95
              basis: assumed
              note: "1Q 四半期額から通期への係数。オンプレ既存顧客のクラウド移行で四半期 −2〜−4 の逓減が続くとして 307→304→301→298、
                合計 約1,210（係数 3.95）。前期は 1Q 319 × 3.98 ＝ 1,270 だった。短信は『オンプレミス環境の既存顧客の保守契約も堅調』と
                表現しており急減は想定しないが、クラウド移行が速まれば下振れ（その分はクラウド ARR に移る）"
        - name: "ネットワーク（AssetView）オンプレライセンス・役務等"
          expr: "onprem_license_and_services"
          vars:
            onprem_license_and_services:
              value: 460
              basis: assumed
              note: "オンプレミスライセンス＋その他（役務等）の年額。前期実績は 221＋286＝507（説明資料 p18 グラフの四半期値を合算。
                4Q だけで 74＋110＝184 と 4Q 偏重）、前々期 281＋222＝503。2027/3期 1Q は 35＋45＝80 で前年同期 90 から △11%。
                短信は『サーバー機器の価格高騰・納期遅延で企業ニーズがオンプレからクラウドへ急速にシフト』と記しており、
                ライセンス売上は構造的に縮む側。1Q 前年比 △11% を通期に当てると 約450、前期並みなら 507 で、やや縮む 460 と置いた。
                4Q 一極の季節性があるため 1Q×4（320）は使わない"
        - name: "セールスDX（ホットプロファイル）リカーリング（OEM除く）"
          expr: "salesdx_arr_fy_start * (1 + salesdx_arr_growth / 2)"
          vars:
            salesdx_arr_fy_start:
              value: 1181
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/173A0/140120260807514275.pdf（2026-10-09取得）"
              note: "2026年3月期 4Q 末（＝当期首）の OEM 除く ARR。短信 p4 の表（1Q 1,097 → 1,121 → 1,139 → 1,181 → 2027/3期 1Q 1,202）。
                式は期首 ARR × (1＋年間成長率/2) ＝ 期中平均 ARR の近似（線形成長を仮定）"
            salesdx_arr_growth:
              value: 0.092
              basis: assumed
              note: "2027年3月期の OEM 除く ARR 年間成長率。直近の前年比は +14.8%・+14.7%・+9.8%・+10.2%・+9.6%（説明資料 p25）と
                10% 前後に減速して安定。四半期純増は +24・+18・+42・+21 で、1Q の +21 を続ければ期末 約1,265（+7.1%）、
                前期の純増 +110 を続ければ 1,291（+9.3%）。会社は『既存顧客の更新・新規が堅調』、チャーン 0.70%/月（短信 p4）。
                2026-07-23『商談リスク検知』・09-30『着地見込み変動要因の可視化』など新機能の継続投入（kabutan 開示）を踏まえ
                上側の 9.2%（期末 約1,290）と置いた。期中平均 約1,235"
        - name: "セールスDX（ホットプロファイル）OEM・初期導入等の非リカーリング"
          expr: "salesdx_non_recurring"
          vars:
            salesdx_non_recurring:
              value: 190
              basis: assumed
              note: "セールスDX売上から OEM 除くリカーリング（期中平均 ARR）を引いた残り（OEM 提供分＋初期導入・役務）。
                前期は 1,355 − (1,071+1,181)/2 ＝ 約229、四半期では 47・74・40・61 と振れる。2027/3期 1Q は 334 − (1,181+1,202)/8 ＝ 約36 で
                前年同期 約47 から △23%。会社は『OEM 提供による売上高の減少も一巡し、成長軌道へ回帰』（説明資料 p33）としており
                底打ちを示唆するが OEM の金額は非開示。1Q×4（144）を下限、前期 229 を上限として 190 と置いた。
                一次情報で OEM と役務の内訳は確認できていない"
        - name: "AIデータエントリー（DX OCR・WOZE 等）"
          expr: "q1_ai_revenue * annualize_ai"
          vars:
            q1_ai_revenue:
              value: 102
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/173A0/140120260807514275.pdf（2026-10-09取得）"
              note: "2027/3期 1Q の AIデータエントリーソリューション売上 102,009 千円（前年同期比 99.3%）。内訳（説明資料 p29）は
                DX OCR 76（前年 74）・WOZE 15（前年 25）・オンプレ等 9（前年 2）"
            annualize_ai:
              value: 4.05
              basis: assumed
              note: "四半期の季節性は小さい（2026/3期は 102・103・101・102 でほぼ横ばい、通期 395）。クラウド AI-OCR『DX OCR』は
                『導入が順調』で前年同期比 +3%、BPO 型『WOZE』は従量課金の処理量減で △40%。DX OCR の伸びが WOZE の減少を
                わずかに上回るとして 1Q×4.05 ＝ 約413（+4.6%）。会社計画 437（+10.7%）には 1Q の横ばいから届かない見立て。
                規模が小さく感度は低い"
    profit:
      op_margin:
        value: 0.165
        basis: assumed
        note: "全社売上に掛ける営業利益率。会社計画 16.7%（883÷5,287）、前期 17.1%、前々期 16.8%。1Q は 10.0%（121÷1,212）だが
          1Q は毎年最低（2026/3期 1Q 8.7%・4Q 26.6%）で、オンプレライセンス・役務が 4Q に集中するため通期は 1Q より大きく高い。
          組み立て: 売上総利益率は 1Q 38.4% に前期の『通期 43.3% − 1Q 39.6% ＝ +3.7pt』の季節差を足して 42.1%（会社計画と同値）。
          販管費は 1Q 344（人件費 162・広告宣伝費 32・その他 148。広告 △22% で前年比 △2%）に対し、前期の係数 ×3.65 なら 1,256、
          会社計画 1,339 なら ×3.89。売上 約5,190 × 42.1% ＝ 2,185 から販管費 1,290〜1,339 を引くと 846〜895、率 16.3〜17.2% の
          中ほど 16.5% と置いた。下振れ要因は売上原価の通信費（AWS 等クラウド利用料）が前年同期比 +42%（+43 百万円）、ソフトウェア
          減価償却費 +10% と、クラウド比率上昇で粗利率が構造的に下がる点（説明資料 p16）。上振れ要因は販管費抑制（広告費減）の継続。
          一次情報では通期の費用計画の内訳（人件費・通信費）は開示されていない"
