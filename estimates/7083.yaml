# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し（2026-10-09 確認）。株予報の業績進捗表（https://kabuyoho.jp/sp/report?bcode=7083）は
    「コンセンサス予想」行が全て「--」で、載っている今期予想 売上 7,242・営業利益 175 百万円は会社計画と同値。
    みんかぶのアナリスト予想ページ（https://minkabu.jp/stock/7083/analyst_consensus）は取得が 403 で拒否され未確認。
    FISCO の決算説明文字起こし（2026-08-10）に『アナリストコメント』はあるが、会社から報酬を受けて作成された
    資料（巻末ディスクレーマー）で独立したコンセンサスではなく、数値予想も載せていない。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-11"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。報告セグメントは福祉事業（障害福祉: 就労継続支援B型・放課後等デイ・
      児童発達支援・グループホーム等。2Q末 98 事業所）／介護事業（デイサービス・居宅介護支援・訪問介護。31 事業所）／
      外食事業（居酒屋 6 店舗＋子会社センターネットワークの食材外部販売）の3つで、短信の区分どおり3セグメントで組む。
      いずれも拠点×稼働の労働集約型なので、2Q累計（2025-12〜2026-05）の実績を土台に下期（2026-06〜11）を
      『上期比の係数』で置き、福祉だけ下期に集中する新規開設（7月2・8月3 事業所）を拠点月数×月商で足した。
      会社計画は売上 7,242・営業利益 175 百万円（前期比 +8.7%・+60.9%）で、2Q累計は売上 3,466（計画どおり）・
      営業利益 39（計画 11 を +27 上振れ）。会社は『新規事業所の開設時期が後ろ倒しになった』ことを理由に通期計画を据え置き。
      計画の営業利益 175 は下期だけで 136（下期売上 3,776 に対し 3.6%）を要し、直近2期の下期（FY2024 1.8%・FY2025 2.5%）を
      大きく上回る水準。当推定は売上では計画に近いが、利益率は下期 2.3% 前後（新規6拠点の立ち上げ費用と
      令和8年6月施行の処遇改善＝人件費増を見込む）と置き、計画を下回る。
      新規事業『福祉不動産開発事業』（土地取得→建設→運営事業者選定→投資家へ売却）は開始を発表したばかりで
      今期の売上計画は開示されておらず、モデルには入れていない（物件売却が今期中に計上されれば上振れ要因。1件あたりの規模も非開示）。
      次の確認点は 3Q決算（2026-10-15）: 下期開設 6 拠点の立ち上がりと福祉セグメント利益率。
      出典: 2026年11月期 第2四半期決算短信（2026-07-14 開示。TDnet 原本 https://www2.jpx.co.jp/disc/70830/081220260714592748_tse-scedjpsy-70830-20260714370830-ixbrl.htm
      は 403 のため、同一文書の PDF ミラー https://assets.finboard.net/tdnet-filings/20260714592748.pdf を読んだ）
      ／FISCO 決算説明文字起こし（2026-08-10。決算説明資料 2026-07-31 の全スライド値を含む）
      https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/ahc20260810.pdf
      ／令和8年度 障害福祉サービス等報酬改定（期中改定）の概要 https://www.pt-ot-st.net/index.php/topics/detail/1865
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "福祉事業（障害福祉 98 事業所＋下期新規開設）"
          expr: "h1_welfare + h1_welfare * h2_organic_ratio + new_site_months * monthly_rev_new_site"
          vars:
            h1_welfare:
              value: 1974
              basis: disclosed
              source: "https://assets.finboard.net/tdnet-filings/20260714592748.pdf（2026年11月期 第2四半期決算短信 p2・p10、2026-10-09取得）"
              note: "2Q累計（2025-12〜2026-05）の福祉事業 外部顧客への売上高 1,973,842 千円（不動産賃貸収入 14,651 千円を含む）。
                前年同期 1,826,888 千円から +8.0%。セグメント利益 119,475 千円（利益率 6.1%）。
                期中の新規開設は 5月の就労継続支援B型 1 事業所（パパゲーノ Work & Recovery 府中）のみで、
                増収の主因は既存事業所の稼働向上と前期（FY2025）開設事業所の立ち上がりと会社が説明"
            h2_organic_ratio:
              value: 1.06
              basis: assumed
              note: "下期（2026-06〜11）の既存事業所売上を上期の何倍と置くかの係数（1.00 で横ばい）。過去の下期÷上期は
                FY2024 1.067（1,776÷1,665）・FY2025 1.052（1,921÷1,827。通期 3,748 は決算説明資料 p15、上期は短信）で、
                どちらも当期中に開設した事業所の立ち上がりを含む。FY2026 上期の開設は5月の1拠点だけなので立ち上がり寄与は
                前2期より小さい（素の係数 1.03〜1.04 程度）と見る一方、令和8年6月施行の障害福祉 処遇改善（期中改定。
                従事者 月1.0万円＝3.3% の賃上げを報酬加算で裏付け。上乗せで最大 月1.9万円）が下期6か月まるごと乗り、
                加算分がそのまま売上に加わる（人件費は売上の約41%＝決算説明資料 p7 なので売上換算 +1.5〜2pt）。
                合わせて 1.06 と置いた。会社計画が含意する係数は 1.106（下期 2,183＝4,156−1,973）で、当推定はそれより低い。
                感度で最も効く変数の一つ。処遇改善の売上寄与率は一次情報で確認できておらず、加算の取得区分で上下する"
            new_site_months:
              value: 22
              basis: assumed
              note: "下期に開設する福祉事業 5 拠点の、期末（2026-11）までの稼働月数の合計。決算説明資料 p18 の開設実績・予定
                （7月: ANELLA CAFE 相鉄ライフ緑園都市店〔B型〕・アプリ児童サービス上板橋〔放課後等デイ〕＝2 拠点×5か月＝10、
                8月: ANELLA CAFE ふじみ野店〔B型〕・アプリキッズ桑名野田2号館〔児童発達支援〕・ビートル桑名藤が丘〔GH 7居室〕
                ＝3 拠点×4か月＝12）から機械的に数えた。開設月を1か月まるごと稼働と数えているので上限寄り。
                当初計画の共同生活援助 2（20居室）が 1（7居室）に縮み、放課後等デイ 1 に置き換わった（修正計画）"
            monthly_rev_new_site:
              value: 1.3
              basis: assumed
              note: "新規事業所 1 拠点あたりの月商（百万円）。既存平均は 1,974÷98 事業所÷6か月＝約 3.4 百万円/月だが、
                就労継続支援B型・児童発達支援・GH は受給者証を持つ利用者を1人ずつ積み上げるため初年度の稼働率は低い。
                既存平均の 4 割弱＝1.3 と置いた（5 拠点×22 拠点月で約 29 百万円。福祉売上の 0.7% で感度は小さい）。
                新規拠点の稼働率の開示は無い"
        - name: "介護事業（デイサービス・居宅介護支援・訪問介護 31 事業所）"
          expr: "h1_care * fy_over_h1_care"
          vars:
            h1_care:
              value: 761
              basis: disclosed
              source: "https://assets.finboard.net/tdnet-filings/20260714592748.pdf（2026年11月期 第2四半期決算短信 p2・p10、2026-10-09取得）"
              note: "2Q累計の介護事業売上高 761,408 千円（前年同期 771,120 千円、−1.3%）。セグメント損失 △19,406 千円
                （前年同期 △24,281 千円）。12月に居宅介護支援 1 事業所（オレンジュ徳丸）を開設、経営効率化で介護デイサービス
                2 事業所を閉鎖。会社の上期予想 767 に対し −6 の未達"
            fy_over_h1_care:
              value: 2.02
              basis: assumed
              note: "通期÷上期の係数（2.00 で下期＝上期）。過去の下期÷上期は FY2024 1.001（822÷821）・FY2025 1.027（792÷771。
                通期 1,563 は決算説明資料 p15）。下期は 6月開設の訪問介護 1 事業所（グリーンプラス板橋）が小幅に加わる一方、
                上期中に閉鎖した 2 事業所の減収が下期はまる半期ぶん効く（閉鎖月は非開示）。差し引きで FY2025 並みの
                下期÷上期 1.02 と置いた。会社計画が含意する係数は 1.077（下期 820＝1,581−761）で、上期が予想未達だった
                セグメントに下期の伸びを置くのは根拠が無いため採らなかった。介護報酬側の期中処遇改善の有無・時期は
                確認できておらず、入れていない"
        - name: "外食事業（居酒屋 6 店舗＋食材の外部販売）"
          expr: "h1_gaihan * fy_over_h1_gaihan + h1_stores * fy_over_h1_stores"
          vars:
            h1_gaihan:
              value: 284
              basis: disclosed
              source: "https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/ahc20260810.pdf（決算説明資料 p23 の値、2026-10-09取得）"
              note: "2Q累計の食材外部販売（子会社センターネットワーク）売上高 284 百万円（前年同期比 +59・+26.6%）、
                営業利益 27 百万円（+29.5%）。自社倉庫を持たず少量多品目を全国の飲食店に卸す物流型。
                外食セグメント売上 731 の 39% を占め、セグメントの増収 +71 のうち +59 がここ"
            fy_over_h1_gaihan:
              value: 2.08
              basis: assumed
              note: "外販の通期÷上期。前年同期比 +26.6% の伸びが続けば半期ごとに約 +12% だが、FY2025 通期の外販額が開示されて
                おらず下期の季節性が取れないため、やや抑えて下期＝上期×1.08 と置いた。会社も『食材の外部販売が順調に増加する』
                前提で通期を組んでいる。外販は原価率が高く（決算説明資料 p7: 外食・外販原価 432 が売上原価の 14%）、
                売上の伸びほど利益は増えない"
            h1_stores:
              value: 448
              basis: disclosed
              source: "https://assets.finboard.net/tdnet-filings/20260714592748.pdf（短信 p10）と https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/ahc20260810.pdf（決算説明資料 p23）（2026-10-09取得）"
              note: "2Q累計の外食セグメント 外部顧客への売上高 731,681 千円（不動産賃貸収入 8,571 千円を含む）から
                食材外部販売 284 を差し引いた店舗側の売上。店舗数は 6 で期中の増減なし（当初計画の居酒屋 1 店は修正計画から外れた）"
            fy_over_h1_stores:
              value: 2.0
              basis: assumed
              note: "店舗売上の通期÷上期。出店ゼロなので下期＝上期（係数 2.0）を基準にした。外食セグメント全体の下期÷上期は
                FY2024 0.961・FY2025 1.041 だが、いずれも外販の伸びを含むため店舗だけの季節性は取り出せない。
                価格転嫁と既存店好調（池袋西口店の食べログ受賞）は上振れ側、原材料・物流費高は利益側の下振れ要因"
    profit:
      op_margin:
        value: 0.017
        basis: assumed
        note: "通期の営業利益率。上期実績 1.1%（39÷3,466）に、下期を約 2.3%（推定下期売上 約 3,650 で約 82 百万円）と置いて
          通期 約 1.7%。下期の根拠: 直近2期の下期は FY2024 1.8%（56÷3,181）・FY2025 2.5%（86÷3,402。福祉 145・介護 23・
          外食 43・全社費用 △125＝通期セグメント利益〔決算説明資料 p17: 福祉 250・介護 △1・外食 88〕から上期を引いた値）。
          FY2026 下期は福祉の既存事業所の利益率改善（上期 6.1% → FY2025 下期並みの 7.5% 前後）が効く一方、
          下期に集中する 6 拠点の立ち上げ費用（人員先行採用・地代）と、処遇改善の人件費増（加算で売上側にも乗るため利益は中立〜小幅減）
          を見込んで FY2025 下期並みに置いた。会社計画 175（2.42%）は下期 136＝3.6% を要し、FY2023 下期（123÷3,072＝4.0%）以来の
          水準。2Q 時点で会社自身が『開設の後ろ倒し』を理由に上振れを計画に織り込んでいないこと、介護の上期予想未達を踏まえ、
          計画の率は採らなかった。乗法モデルなので感度は定義上 +10% だが、率の水準そのものが最大の不確実要因
          （1.7% ↔ 2.4% で営業利益は 121 ↔ 171 と動く）。2Q の経常利益 +39 上振れの一部は助成金（営業外）で、営業利益率には入れない"
