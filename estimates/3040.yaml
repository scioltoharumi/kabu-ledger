# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストのカバーを確認できず。株予報（https://kabuyoho.jp/reportTop?bcode=3040、2026-10-09取得）は
    「予想経常利益（コ）--」「レーティング --」「目標株価 --」とコンセンサス欄が空欄（＝カバー0社の表示）。
    みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/3040/analyst_consensus、2026-10-09）は 403 で取得できず。
    東証プライムだが時価総額が小さくカバーは無いとみる。比較対象は会社計画（2026-08-12 上方修正後）のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/3040.md はまだ無い）。12月決算。中間期（2026-01〜06）の
      実績が出ているので、3セグメントとも『中間期実績（開示値）＋前年下期実績×下期成長率』で組む。
      会社計画は 2026-08-12 に上方修正済みで売上 22,300・営業利益 3,900 百万円（修正前 21,200・3,150。前期比 +12.8%・+37.1%）。
      中間期は売上 10,022（+15.1%）・営業利益 1,777（+124.0%）・営業利益率 17.7%（前年同期 9.1%）で、修正後計画に対する進捗は
      売上 44.9%・営業利益 45.6%（過去2年の中間期進捗は売上 44〜46%・営業利益 28〜32%＝下期偏重）。
      中間期の増収の核は主力製品『NetAttest EPS』の旧バージョン EOL（6月末）に伴う更新需要（ITセキュリティの商品・製品売上 +28.8%）で、
      これは一過性。下期はその反動と、公共の大型案件（自治体強靭化第3期・GIGA第2期・校務DX）や
      クラウド（Soliton OneGate、+15%）の積み上げの綱引きになるので、ITセキュリティの下期成長率を会社計画の含意（約 +11%）より
      少し低い +9% と置いた。感度で最も効くのはこの下期成長率と営業利益率（ともに一次情報では確認できない仮定）。
      中国子会社（年商約5億円）は 2025-03 に譲渡済みで、前年下期の比較基準にはもう含まれない。
      3Q決算（2026-11-12 予定）で下期の立ち上がりが分かるので、そこで置き直す前提。
      出典: 2026年12月期 中間期決算説明資料 https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf（2026-10-09 取得）
      ／2025年12月期 決算説明会 書き起こし（ログミーFinance）https://finance.logmi.jp/articles/383909（2026-02-16 公開・2026-10-09 取得）
      ／株予報 https://kabuyoho.jp/reportTop?bcode=3040（2026-10-09 取得）
      ／ニュース見出し（株探）2026-10-05 網屋『ALog』が Soliton OneGate と連携、2026-09-16 アセンテック『リモートPCアレイ』導入、
      2026-09-24 上場来高値更新（本文は 403 で未読・見出しのみ）"
    revenue:
      unit: JPY_million
      segments:
        - name: "ITセキュリティ（認証・アクセス制御・ネットワーク分離。売上の94%）"
          expr: "itsec_h1 + itsec_h2_prev * itsec_h2_growth"
          vars:
            itsec_h1:
              value: 9437
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p15（2026-10-09取得）"
              note: "2026年12月期 中間期のセグメント売上高（前年同期 8,187・+15.3%）。内訳: 商品・製品 3,531（+28.8%、NetAttest EPS 旧版 EOL の
                更新需要）・保守 2,757（+1.7%）・クラウドサービス 1,474（+15.0%）・役務その他 1,673（+15.2%）。セグメント利益 2,335（利益率 24.8%、
                前年同期 15.4%）。民需 +24%・公共 +17%（保守除く）"
            itsec_h2_prev:
              value: 10329
              basis: disclosed
              source: "https://finance.logmi.jp/articles/383909（2025年12月期 通期セグメント売上 18,516、2026-10-09取得）／https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p15（2025年中間期 8,187）"
              note: "前年下期（2025-07〜12）のセグメント売上 = 通期 18,516 − 中間期 8,187。株予報の掲載値は通期 18,534（調整額 −43 を含む集計の差とみる。
                差 18 は結果に効かない）。この下期には 2025-03 に譲渡した中国子会社の売上は含まれない。
                連結ベースの前年下期は売上 11,052・営業利益 2,051（fundamentals の kabutan_half 行、SINGLE_SOURCE）で、Q3 5,194・Q4 5,858 と
                4Q偏重（公共の年度予算執行）"
            itsec_h2_growth:
              value: 1.09
              basis: assumed
              note: "前年下期比の成長率。会社の修正後計画は通期 22,300 → 下期 12,278（前年下期 11,052 比 +11.1%）で、映像・Eco を差し引くと
                ITセキュリティの下期は約 +11% の含意。当台帳はそれより低い +9% を置く。理由: (a) 中間期の商品・製品 +28.8% は 6月末 EOL に向けた
                更新需要の前倒しで、下期の買い替えを一部食っている可能性（会社資料も『更新需要が重なり』と一過性として説明）、
                (b) 一方でストックのクラウド +15%・役務 +15% は続き、公共の大型案件（自治体強靭化第3期・GIGA第2期・校務DX）は
                『2026年度から本格化』（2025年12月期 決算説明会）、契約負債は 9,573（前期末比 +641）と積み上がっている、
                (c) 2026-01 開始の『Soliton OneGate PKI プラン for EPS』は半年で17万ユーザーが導入決定（p18）で、EPS 更新がクラウド移行を伴う
                ARPU 向上に繋がる。+9% なら ITセキュリティ通期 20,696（前期比 +11.8%）。
                感度で最も効く変数で、一次情報では下期の受注動向を確認できていない（3Q決算 2026-11-12 で確認）"
        - name: "映像コミュニケーション（Smart-telecaster・遠隔操縦。売上の5%）"
          expr: "video_h1 + video_h2_prev * video_h2_growth"
          vars:
            video_h1:
              value: 495
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p22（2026-10-09取得）"
              note: "2026年12月期 中間期のセグメント売上高（前年同期 426・+16.0%）。商品・製品 231（+49.3%、防衛・公共安全・災害対処向け）、
                役務その他 177（−8.5%、レンタルから販売への移行）。セグメント損失 △131（前年同期 △113。サーバー価格上昇で原価増）"
            video_h2_prev:
              value: 624
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p35（FY25 実績 10.5億円・セグメント損益見直し反映）／p22（2025年中間期 426）"
              note: "前年下期 = 通期 1,050 − 中間期 426。中期経営計画ページの再掲値は 0.1億円単位の丸め。株予報の掲載値は通期 1,066（丸め・集計差）。
                差 16 は結果に効かない"
            video_h2_growth:
              value: 1.10
              basis: assumed
              note: "前年下期比。中間期は +16% だが、商品・製品の +49% の裏で役務（レンタル）が −8.5% と販売への移行が進んでおり、
                伸びは製品販売の案件次第で振れる。中期計画の CAGR は 16%（FY25 10.5億 → FY28 16.5億）。熊本地震の被災自治体向け無償貸与
                （2026-07〜）は売上にならず、UNDP とのウクライナ遠隔施工 MOU（2026-06）も FY2026 の売上は見込まない。中間期の伸びと
                中計 CAGR の間をやや下に取って +10%。売上規模が小さく感度は低い"
        - name: "Eco新規事業開発（人感センサーIC・アナログエッジAIチップ。売上の1%）"
          expr: "eco_h1 + eco_h2_prev * eco_h2_factor"
          vars:
            eco_h1:
              value: 89
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p24（2026-10-09取得）"
              note: "2026年12月期 中間期のセグメント売上高（前年同期 95・−6.2%）。商品・製品 81（+37.5%、人感センサー用IC増産）、
                役務その他 8（−77.6%、前年の開発案件が剥落）。セグメント損失 △113（前年同期 △77。AIチップ開発最終盤で費用拡大）"
            eco_h2_prev:
              value: 95
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/30400/140120260812518228.pdf p35（FY25 実績 1.9億円）／p24（2025年中間期 95）"
              note: "前年下期 = 通期 190 − 中間期 95。株予報の掲載値は通期 204（丸め・集計差）。差 14 は結果に効かない"
            eco_h2_factor:
              value: 1.0
              basis: assumed
              note: "前年下期比 ±0 と置く。人感センサー用ICの増産（中間期 +37.5%）が続く一方、開発案件の売上剥落が下期も続く。
                アナログエッジAIチップは『順調に進むと第3四半期に機能評価 Demo、年内にテープアウト』（p32）で、FY2026 内の売上は見込まない。
                売上規模が小さく感度は無視できる"
    profit:
      op_margin:
        value: 0.175
        basis: assumed
        note: "全社営業利益率（通期）。中間期実績 17.7%、会社の修正後計画 17.5%（3,900÷22,300。下期の含意は 2,123÷12,278＝17.3%）、
          前年下期の実績 18.6%（2,051÷11,052、Q3 20.6%・Q4 16.7%）の間で、計画と同じ 17.5% を置く（当台帳の売上 22,061 に掛けると
          下期の含意は約 17.3%）。上振れ要因: 前年下期はこの水準の売上で 18.6% を出しており、クラウドの積み上げで粗利率が構造的に
          上がっている（中間期 50.1%、前年同期 44.4%）。下振れ要因: (a) 中間期の粗利率は EOL 更新需要（自社製品・高粗利）に押し上げられており
          下期はその分が薄れる、(b) Eco の AIチップ開発費が年内テープアウトに向けて 3Q に山を迎える（中間期の損失 △113）、
          (c) 映像は △131 の損失で『下期に価格適正化で改善』は会社の意向段階、(d) 研究開発費・広告宣伝費は前年同期比で増加傾向。
          本社費用は年 約5.8億円（p35）。セグメント別の利益率を掛ける形にはしていない（ITセキュリティ以外は赤字で率が意味を持たないため）。
          感度上位の変数で、一次情報では下期の原価率を確認できていない"
