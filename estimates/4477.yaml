# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "確認できず。株予報のアナリスト予想ページ（https://kabuyoho.jp/sp/reportAnalyst?bcode=4477、2026-10-09）はコンセンサス欄が
    『--』（予想なし）で、『アナリスト業績予想』として並ぶ 2026/12 予の数値（売上 28,371・営業利益 2,270・経常 2,029 百万円）は
    会社予想と同値＝独立したアナリスト予想とは見なせない。みんかぶのアナリスト予想ページ
    （https://minkabu.jp/stock/4477/analyst_consensus、2026-10-09）は 403 で取得できず。東証グロースで証券会社のカバーは
    確認できなかった。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日で reports/4477.md はまだ無い）。報告セグメントは BASE事業（ネットショップ作成
      『BASE』。収益は決済手数料＋サービス利用料＝GMV×テイクレート）・PAY.JP事業（オンライン決済。GMV×テイクレート）・
      YELL BANK事業（売掛債権買取による資金提供）・want.jp事業（越境EC代理購入）・Eストアーショップサーブ事業（2025-07 子会社化、
      2025-10 から PL 連結）＋その他（2026-04 取得の Port 社『Talkport』。2026-07 から PL 連結）。
      組み方は『1H 実績（短信・開示）× 2H/1H 比（仮定）』を基本とし、BASE と PAY.JP だけ GMV×テイクレートに割る。
      会社計画は売上 28,371・営業利益 2,270 百万円（前期比 +36.9%・+34.6%）だが、会社自身が 2Q 説明会で
      『want.jp の会計処理を総額→純額に変える影響で通期売上は計画を 1,643 百万円下回る見込み（売上総利益・販管費も各 461 減、
      営業利益への影響なし）、Port 連結で 2H に売上 195 加算、営業利益は販管費コントロールで計画どおり着地見込み』と説明している
      （logmi 書き起こし）。つまり実質の会社売上見通しは 約26,900 で、本推定（約25,700）はそれより約4%下。差は PAY.JP（計画+10% に
      対し 1H +6%）・YELL BANK（計画+30% に対し 2Q は計画未達で減速）・Eストアーの 2H 季節性の置き方による。
      +10% 感度で効くのは BASE 事業の GMV とテイクレート（売上の 47%）、次に PAY.JP の GMV・テイクレートと Eストアー。
      2026-08-28 発表の SBI ホールディングスによる TOB（1株 340 円・上限 20%・買付期間は 2026-10-15 まで延長中）と資本業務提携
      （SBI グループの決済取引を PAY.JP に集約・ネオメディア事業の共同展開 等）は、2026 年 12 月期の数字には織り込まない
      （業績寄与の時期・規模の開示が無い。TOB の結果も未公表）。3Q 決算（2026-11 予定）で BASE の GMV 鈍化（2Q は 1 ショップ当たり GMV が
      QoQ 減）と YELL BANK の減速が続くかを見て置き直す前提。
      出典: 2026年12月期 第2四半期決算短信（英文）https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf
      ／2Q 決算説明会 書き起こし（logmi Finance）https://finance.logmi.jp/articles/385541
      ／1Q 決算説明会 書き起こし https://finance.logmi.jp/articles/384726
      ／2025年12月期 有価証券報告書のセグメント値（EDINET S100XSMS。edinetdb.jp の転記 https://edinetdb.jp/company/E35163/earnings/FY2025 経由）
      ／資本業務提携・TOB https://netshop.impress.co.jp/n/2026/09/01/16650 ・ https://kabukiso.com/apply/tob/2026/base_sbi.html
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "BASE事業（GMV×テイクレート）"
          expr: "base_gmv_1h * (1 + base_h2_ratio) * base_take_rate"
          vars:
            base_gmv_1h:
              value: 85373
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf（2026-10-09取得）"
              note: "2026年1〜6月の BASE 事業 GMV（注文日ベース、百万円）。前年同期比 +6.0%（決済日ベースは 82,948・+6.9%）。
                月間アクティブショップ数は増えたが、2Q は 1 ショップ当たり平均 GMV が減り QoQ で減少（ファッションカテゴリの既存ショップ鈍化）"
            base_h2_ratio:
              value: 1.04
              basis: assumed
              note: "2H GMV ÷ 1H GMV。前期の手がかり: FY2025 の BASE 事業売上 10,832（有報）− 1H2025 の 4,938（短信）＝ 2H2025 は 5,894。
                2H2025 のテイクレートを約 7.0%（3Q 説明会で『7%』）とすると 2H2025 GMV ≒ 84,200、1H2025 GMV ≒ 80,540
                （85,373÷1.060）なので前期の 2H/1H ≒ 1.045。年末商戦で 2H がやや大きい程度の季節性。今期は 2Q に GMV 成長が
                +6.3%→+5.6% と鈍化し 1 ショップ当たり GMV が減っているので、前期比 +5% 前後（2H2026 ≒ 88,800）となる 1.04 と置いた。
                感度上位。一次情報で四半期 GMV の絶対額は確認できていない（短信は半期累計のみ）"
            base_take_rate:
              value: 0.069
              basis: assumed
              note: "売上÷GMV（注文日ベース）。1H2026 実績は 5,819÷85,373 ＝ 6.82%（1H2025 は 4,938÷80,540 ≒ 6.13%）。2025-07 の
                『Pay ID』アプリ有料化で上がり、会社は 2026 年は有料化の通年寄与でテイクレート改善を計画。有料化から 1 年経つ 2H は
                前年比の上昇が止まるが、1H 水準は維持されるとして 6.9% と置いた（決済日ベースの GMV で測ると 7.0%）。
                結果の BASE 事業売上は約 12,100（前期比 +12%）で、会社計画の『+10〜15%』の中にある。感度上位"
        - name: "PAY.JP事業（GMV×テイクレート）"
          expr: "payjp_gmv_1h * (1 + payjp_h2_ratio) * payjp_take_rate"
          vars:
            payjp_gmv_1h:
              value: 118185
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf（2026-10-09取得）"
              note: "2026年1〜6月の PAY.JP 事業 GMV（決済日ベース、百万円）。前年同期比 +6.3%。売上 3,252（+6.0%）"
            payjp_h2_ratio:
              value: 1.08
              basis: assumed
              note: "2H GMV ÷ 1H GMV。前期の売上は 1H2025 3,063（短信）→ FY2025 6,336（有報）なので 2H2025 は 3,273、2H/1H ＝ 1.069。
                テイクレートが安定している事業なので GMV も同程度の季節性とみて、2Q の GMV 成長（+7.6%）がやや加速している分と
                Eストアー加盟店の PAY.JP 移行を上乗せして 1.08 と置いた。会社計画の『約 +10%』には届かない（1H が +6%）"
            payjp_take_rate:
              value: 0.0275
              basis: assumed
              note: "売上÷GMV。1H2026 実績 3,252÷118,185 ＝ 2.75%。前年同期 3,063÷111,180（118,185÷1.063）≒ 2.76% と変わらず。
                決済手数料率はほぼ固定なので 1H 水準を据え置いた。売上総利益率は 14%（469÷3,252）と低く、利益への寄与は売上の割に小さい"
        - name: "Eストアーショップサーブ事業（1H実績×2H/1H）"
          expr: "estore_rev_1h * (1 + estore_h2_ratio)"
          vars:
            estore_rev_1h:
              value: 2194
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf（2026-10-09取得）"
              note: "2026年1〜6月のセグメント売上。売上総利益 1,365・セグメント利益 175。会社は『計画どおり』と説明（2Q 説明会）。
                前年同期は PL 未連結（連結は 2025-10 から）のため前年比は無い"
            estore_h2_ratio:
              value: 1.10
              basis: assumed
              note: "2H ÷ 1H。手がかりは四半期値: 1H2026 は 2,194（四半期平均 1,097）、Eストアー単体の 3Q2025 売上 1,038（3Q 説明会での
                参考値）、連結後の 4Q2025 セグメント売上 1,309（有報）。4Q が年末商戦で約 2 割大きい季節性があるとみて
                2H ＝ 約1,100＋約1,310 ≒ 2,410、比で 1.10。『安定的なトップライン成長』が会社の置き方で急な伸びは想定しない"
        - name: "YELL BANK事業（1H実績×2H/1H）"
          expr: "yell_rev_1h * (1 + yell_h2_ratio)"
          vars:
            yell_rev_1h:
              value: 630
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf（2026-10-09取得）"
              note: "2026年1〜6月のセグメント売上（前年同期比 +20.5%）。セグメント利益 267。ただし 2Q 単独は +11.1% に減速し、
                資金提供額の伸びが鈍って QoQ 減。会社は『計画を下回って推移、リスク管理を強化』と説明（2Q 説明会）"
            yell_h2_ratio:
              value: 1.02
              basis: assumed
              note: "2H ÷ 1H。前期は 1H2025 523 → FY2025 1,120（有報）で 2H2025 は 597（2H/1H 1.14）。今期は 2Q の減速
                （YoY +11%・QoQ 減）とリスク管理強化（＝資金提供額を絞る）を受け、2H は前年同期比 +8% 程度の 約645 として 1.02 と置いた。
                会社計画の『約 +30%』からは大きく下。売上総利益率 96% の事業なので売上の下振れはほぼそのまま利益に効く"
        - name: "want.jp事業（1H実績＋2H仮定）"
          expr: "want_rev_1h + want_rev_2h"
          vars:
            want_rev_1h:
              value: 502
              basis: disclosed
              source: "https://contents.xj-storage.jp/xcontents/AS08546/41c53e4a/8851/44fb/94e4/18b973cbd391/140120260805510748.pdf（2026-10-09取得）"
              note: "2026年1〜6月のセグメント売上（前年同期比 -18.8%）。一部マーケットプレイスの商品掲載見直しの影響。セグメント損失 -10"
            want_rev_2h:
              value: 350
              basis: assumed
              note: "2Q 単独 214 の年率化は 428 だが、会社は『かんたん海外販売』の会計処理を総額→純額に変え、通期売上が計画を
                1,643 百万円下回る（売上総利益・販管費も 461 ずつ減、営業利益には影響なし）と説明している（2Q 説明会）。
                純額化で 2H の計上額が 2Q ペースより細るとみて 350 と置いた。幅は大きいが全社売上の約 3% で感度は小さく、
                利益への影響は会社説明どおりほぼ無い"
        - name: "その他（Port社『Talkport』2H連結分）"
          expr: "port_rev_2h"
          vars:
            port_rev_2h:
              value: 195
              basis: disclosed
              source: "https://finance.logmi.jp/articles/385541（2Q 決算説明会 書き起こし、2026-10-09取得）"
              note: "2026-04 に 13 億円で全株取得、PL は 2026-07 から連結。会社が示した下期の業績寄与見込み: GMV 762・売上 195・
                売上総利益 126（百万円）。のれん償却 2026 年 12 月期 63（暫定）。会社計画 28,371 には含まれていない（短信『影響は軽微』）"
    profit:
      op_margin:
        value: 0.086
        basis: assumed
        note: "全社売上×営業利益率。1H2026 実績 8.6%（1,068÷12,388、短信）。会社計画 8.0%（2,270÷28,371）だが、want.jp の純額化で
          分母の売上が 1,643 減り利益は変わらないため、会社の実質見通しは 2,270÷約26,900 ≒ 8.4%。2H は Q4 のマス広告・年末施策で販管費が
          増える季節（前期 4Q の営業利益率 8.1%、3Q 11.7%、2H2025 計 9.6%）な一方、Eストアーの決済を PAY.JP に移す原価低減と
          売上総利益率の改善（2Q 51.7%、前年 46.0%）が続く。YELL BANK の減速（高粗利）を差し引き、1H 並みの 8.6% と置いた。
          結果の営業利益 約2,210 は会社計画 2,270 の -2.6%。過去の営業利益率は FY2023 -3.6%・FY2024 4.8%・FY2025 8.1%（fundamentals）で、
          8.6% は過去最高水準である点に注意。SBI 提携の寄与・費用は織り込まない（開示なし）"
