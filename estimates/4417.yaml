# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "売上高・営業利益のコンセンサスは確認できず。株予報（https://kabuyoho.jp/reportTop?bcode=4417、2026-10-09 取得）には
    経常利益のコンセンサス 3,100 百万円（会社予想 2,973 の +4.3%）とレーティング 5.00・目標株価 5,800 円のみが掲載され、
    売上高・営業利益の予想値と予想アナリスト数は載っていない（経常利益は営業利益と項目が違うので上の欄には入れない）。
    みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/4417/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日で reports/4417.md は未作成）。報告セグメントは単一だが、会社は『事業別売上高』を
      サイバーセキュリティ事業（準大手・中堅・中小向けの診断・コンサル・訓練・製品導入）／セキュリティ教育事業（IT企業・SIer 向け講座）／
      セキュリティ人材事業（育成した人材の SES 提供）の3区分で四半期ごとに開示している（内部取引消去前）。各事業を
      『1Q実績 ÷ 1Qの通期構成比』で通期化し、消去分をサイバーセキュリティ事業から差し引く、の4セグメント相当3本で組む。
      1Qは3事業とも通期で最も小さい四半期（4Qが最大）なので、年率換算（×4）ではなく過去2期の構成比で伸ばす。
      会社計画は売上 13,778・営業利益 2,939 百万円（前期比 +25.0%・+31.3%、営業利益率 21.3%）で、1Q進捗は 20.1%・17.0%
      （前年同期 20.3%・15.7%、前々年 20.6%・17.3%）と会社は『計画通り』と説明（1Q資料 p5）。
      この推定は合計で計画とほぼ同水準だが中身が違う: 人材事業が計画の構成比（24%）を大きく上回り、サイバーセキュリティ事業が
      計画の構成比（62%）に届かない。全社の顧客数×ARPU で検算すると、FY2026 は顧客 1,588 社（新規 566・既存 1,022）×ARPU
      （新規 2.8・既存 9.3 百万円）≒ 11,022 で、推定 13,676 は顧客 +9%・ARPU +14% 程度に相当し、前期の伸び（顧客 +10%・ARPU +17〜18%）
      の範囲内（通期資料 p13）。
      直近の開示: 2026-09-30 キーウェアソリューションズ株 6.59%（約 658 百万円）取得＋業務提携（販売連携・人材連携・人材育成。
      業績影響は『精査中』）／2026-08-12 網屋株の譲渡で 2Q に特別利益 674 百万円（営業外。営業利益には効かない）／
      2026-05-08 CoWorker 社との AI 業務提携。いずれも営業利益の推定には織り込まない（効果の金額が開示されていない）。
      次の置き直しは 2Q決算（2026-10-30 予定）。
      出典: 2027年3月期 第1四半期決算説明資料 https://pdf.irpocket.com/C4417/xoA3/Ef45/mcJK/vvoN.pdf（p4-5, 17-18, 21, 35-36, 42）
      ／2026年3月期 決算説明資料 https://pdf.irpocket.com/C4417/Rytt/rGrP/aNqh.pdf（p13, 15, 17, 21-22）
      ／2026年3月期 決算説明会 質疑応答集 https://pdf.irpocket.com/C4417/Kdx3/Bc3s/YQBE.pdf
      ／キーウェアソリューションズとの資本業務提携 https://tdnet-pdf.kabutan.jp/20260930/140120260930543274.pdf
      ／（開示事項の経過）網屋との資本業務提携 https://tdnet-pdf.kabutan.jp/20260812/140120260812518426.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "サイバーセキュリティ事業（内部取引消去後）"
          expr: "q1_cyber / q1_share_cyber - internal_elim"
          vars:
            q1_cyber:
              value: 1742
              basis: disclosed
              source: "https://pdf.irpocket.com/C4417/xoA3/Ef45/mcJK/vvoN.pdf（2026-10-09取得）"
              note: "2027年3月期1Q（2026-04〜06）の事業別売上高（内部取引消去前）。1Q資料 p17 のグラフ値。前年同期 1,525 比 +14.3%
                （資料記載の伸び率と一致）。FY2026 の四半期は 1,525→1,779→1,841→2,051、FY2025 は 1,321→1,538→1,612→1,708"
            q1_share_cyber:
              value: 0.213
              basis: assumed
              note: "サイバーセキュリティ事業の通期売上に対する1Qの構成比。FY2025 1,321÷6,182＝21.4%、FY2026 1,525÷7,197＝21.2%
                （1Q資料 p17 の四半期値と通期資料 p15 の通期値）で2期ほぼ一定なので中間の 21.3% を置いた。
                これで通期 約8,180（前期比 +13.7%）となり、会社計画の構成比 62%×13,778≒8,540（+18.7%）に届かない。
                4Qに案件が集中する季節性（FY2026 の4Q構成比 28.5%）が今期も続くことが前提。感度で2番目に効く変数で、
                4Qの集中度が増せば上振れる（一次情報では四半期配分の計画は確認できていない）"
            internal_elim:
              value: 120
              basis: assumed
              note: "事業別売上高（消去前）の合計と連結売上高の差。FY2025 8,879−8,801＝78、FY2026 11,111−11,022＝89、
                1Q FY2027 2,810−2,772＝38（年率換算 約150）。FY2026 実績と 1Q年率の間として 120。どの事業の内部取引かは
                非開示のため便宜上この行で差し引く（合計への影響は 1% 弱）"
        - name: "セキュリティ教育事業"
          expr: "q1_edu / q1_share_edu"
          vars:
            q1_edu:
              value: 315
              basis: disclosed
              source: "https://pdf.irpocket.com/C4417/xoA3/Ef45/mcJK/vvoN.pdf（2026-10-09取得）"
              note: "2027年3月期1Q の事業別売上高（内部取引消去前）。1Q資料 p17。前年同期 243 比 +29.6%（資料記載の伸び率と一致）。
                FY2026 の四半期は 243→394→349→511、FY2025 は 182→262→215→335 で、4Q（年度末の研修予算消化）が最大"
            q1_share_edu:
              value: 0.17
              basis: assumed
              note: "教育事業の通期売上に対する1Qの構成比。FY2025 182÷997＝18.3%、FY2026 243÷1,498＝16.2% の中間 17%。
                通期 約1,850（前期比 +24%）。会社計画の構成比 14%×13,778≒1,930（+29%）よりやや低い。
                構成比の幅 16.2〜18.3% で通期は 1,720〜1,940 と振れる。受講者数は単年度 11,294 名（FY2025）→12,939 名（FY2026、
                1Q資料 p47）で +14.6%、売上の伸び +50% は受講単価（CISSP 等の高額講座・AI講座）の寄与が大きく、
                単価×人数の分解は一次情報の単価が無いため採らなかった。2026-04 発売の『SecuriST 認定AIセキュリティエンジニア』が
                4か月で 900 名（1Q資料 p30）と新講座の立ち上がりは速い"
        - name: "セキュリティ人材事業（SES）"
          expr: "q1_talent / q1_share_talent"
          vars:
            q1_talent:
              value: 753
              basis: disclosed
              source: "https://pdf.irpocket.com/C4417/xoA3/Ef45/mcJK/vvoN.pdf（2026-10-09取得）"
              note: "2027年3月期1Q の事業別売上高（内部取引消去前）。1Q資料 p17。前年同期 484 比 +55.6%（資料記載の伸び率と一致）。
                FY2026 の四半期は 484→580→678→674、FY2025 は 336→412→470→482。直前の 4Q 674 比 +11.7% の積み上がり"
            q1_share_talent:
              value: 0.20
              basis: assumed
              note: "人材事業の通期売上に対する1Qの構成比。FY2025 336÷1,700＝19.8%、FY2026 484÷2,416＝20.0% で2期一致。
                そのまま 20% を置くと通期 約3,765（前期比 +56%）で、会社計画の構成比 24%×13,778≒3,310（+37%）を大きく上回る。
                **感度で最も効く変数**。SES は稼働人数×単価で、稼働人数は 91→137→204 名（FY2024→FY2025→FY2026、1Q資料 p49）と
                年 +50% 前後で増えてきたが、構成比 20% を保つには今期も四半期ごとに約 +10% の増員が要る。
                採用が追いつかず 4Q 水準で頭打ちになる（構成比 23%）と通期は 約3,270 まで下がる。
                1Q が計画を上回って走っていること自体は事実だが、通期の計画超過を断定する材料ではない"
    profit:
      op_margin:
        value: 0.215
        basis: assumed
        note: "全社営業利益率。会社計画 21.3%（2,939÷13,778）と、1Q実績 18.0%（前年同期 15.8%、+2.2pt）の改善幅を通期 20.3% に
          そのまま乗せた 22.5% の間。1Qは毎年最も利益率が低い四半期（FY2026: 1Q 15.8%→通期 20.3%）なので 1Q の 18.0% は
          通期の下限ではなく季節性。粗利率は 1Q 36.2%（+2.8pt）、販管費率 18.2%（+0.5pt。新卒 11 名を含む人件費 +59・広告宣伝費 +5、
          1Q資料 p19・p21）。会社は計画の +1.0pt を『AI 教育・AIエージェント導入の先行投資を販管費に織り込んだ保守的な計画で、
          コスト水準次第で上振れ余地』と説明（質疑応答集 Q3・Q6）。人材事業の粗利率（FY2026 31%）は他2事業（教育 42%・サイバー 37%）
          より低く、推定どおり人材の構成比が計画より上がれば全社粗利率を押し下げる方向なので、1Q改善幅をそのまま伸ばさなかった。
          網屋株譲渡の特別利益 674 百万円（2Q）とキーウェア株取得 約658 百万円は営業利益に影響しない"
