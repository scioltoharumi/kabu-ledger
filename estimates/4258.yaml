# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "株予報（IFISコンセンサス）"
  revenue: 7350
  operating_income: 1300
  source: "https://kabuyoho.jp/reportAnalyst?bcode=4258（2026-10-09取得）"
  note: "2026年12月期のコンセンサス 売上高 7,350・営業利益 1,300・経常利益 1,300・当期利益 900（百万円）。
    アナリスト数はページに記載なし。経常利益のコンセンサスは1週間前・4週間前とも 1,300 で据え置き。
    参考: マネックス証券の決算速報（https://scouter.monex.co.jp/news/detail/4258_20260812_act_20260812_162015_1、
    2026-10-09取得）が載せる 2026-08-10 時点の IFIS コンセンサスは売上高 7,300・営業利益 1,300・経常利益 1,280・当期利益 900。
    いずれも会社計画（7,002・1,200）を上回る"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。intake 当日で reports/4258.md は未作成。会社は報告セグメントを
      データセキュリティ（DS: ログ管理 ALog のサブスク）とネットワークセキュリティ（NS: Network All Cloud／フルマネージド SASE の Verona。
      機器販売のフローとライセンス・運用のストックの混合）の2つで開示しており、両事業とも『中間期実績 × 通期/上期倍率』で組む
      （例年下期偏重で、過去2期の売上の上期比率は 46.3〜47.7%。決算説明資料 p12）。第3の項として、2026-05-13 に子会社化した
      アンペール（産業機器・IT機器製造、2025年9月期 売上 1,886）を『第4四半期から PL 連結』と会社が明示しているので、
      その1四半期分を別建てで置く。会社計画は売上 7,002・営業利益 1,200（前期比 +18.0%・+14.1%）で、2Q決算で据え置き。
      中間期の進捗は売上 48.5%・営業利益 53.2%。中間期の実績（売上 3,397・営業利益 638）は fundamentals の四半期 OK 行
      （Q2026-01_2026-03 1,762＋Q2026-04_2026-06 1,635 ／ 347＋291）とも一致する。
      +10% 感度で効くのは NS の上期実績と通期/上期倍率、次いで DS の同じ2変数。アンペールの1四半期分は小さいが、
      連結消去後の実額が未開示なので幅が大きい。11月11日の3Q決算でアンペール抜きの H2 ペースが分かるので、そこで置き直す前提。
      出典: 2026年12月期第2四半期 決算説明資料 https://www.amiya.co.jp/assets/ir/financial_results_2026_Q2.pdf
      ／FISCO 企業調査レポート（2026-10-07）https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/amiya20261007.pdf
      ／アンペール株式取得のお知らせ https://www2.jpx.co.jp/disc/42580/140120260513528832.pdf
      ／2026年12月期 事業計画及び成長可能性に関する事項 https://www.amiya.co.jp/assets/ir/business-plan-2026.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "データセキュリティ事業（ALog サブスク）"
          expr: "ds_h1_revenue * ds_fy_to_h1_ratio"
          vars:
            ds_h1_revenue:
              value: 1429
              basis: disclosed
              source: "https://www.amiya.co.jp/assets/ir/financial_results_2026_Q2.pdf（2026-10-09取得）"
              note: "2026年12月期 中間期（2026-01〜06）の DS 売上高。決算説明資料 p16 の累計棒グラフ（Q1 722・Q2 1,429）。
                FISCO レポートのセグメント表（短信より作成）も 1,429（前年同期 1,119、+27.7%）。セグメント利益 681（利益率 47.7%）。
                fundamentals には中間期のセグメント行が無い（H2026-01_2026-06 は SINGLE_SOURCE）ため disclosed"
            ds_fy_to_h1_ratio:
              value: 2.12
              basis: assumed
              note: "通期売上 ÷ 中間期売上。実績は FY2024 1,915÷926＝2.07、FY2025 2,480÷1,119＝2.22（決算説明資料 p16 の累計値）。
                会社計画 2,800 は 2,800÷1,429＝1.96 で、過去2期のどちらより低い（上期だけで計画の 51% に達しており、
                計画の DS は保守的）。下期の手がかりは ARR: 2Q末の DS ARR 2,104（前年同期比 +39.2%、p13）の半分 1,052 が
                下期のストック分として概ね確定し、上期の ARR 外（1,429−FY2025末 ARR 1,798÷2＝約530）が同程度続けば
                下期 約1,600〜1,700。一方 Q2 単独（707）が Q1（722）比で横ばいだった点と、FISCO が指摘するオンプレ導入の
                サーバー調達遅延リスクを踏まえ、過去2期の中点 2.14 よりやや低い 2.12 と置いた。感度上位（一次情報で
                四半期配分は確認できていない）"
        - name: "ネットワークセキュリティ事業（Network All Cloud／Verona）"
          expr: "ns_h1_revenue * ns_fy_to_h1_ratio"
          vars:
            ns_h1_revenue:
              value: 1967
              basis: disclosed
              source: "https://www.amiya.co.jp/assets/ir/financial_results_2026_Q2.pdf（2026-10-09取得）"
              note: "2026年12月期 中間期の NS 売上高。決算説明資料 p16 の累計棒グラフ（Q1 1,039・Q2 1,967）。
                FISCO レポートのセグメント表も 1,967（前年同期 1,626、+20.9%）。セグメント利益 494（利益率 25.1%、前年 28.2%。
                販促・R&D 先行投資で利益率は低下）。DS と合わせて 3,396 ≒ 連結 3,397（端数）"
            ns_fy_to_h1_ratio:
              value: 2.13
              basis: assumed
              note: "通期売上 ÷ 中間期売上。実績は FY2024 2,851÷1,308＝2.18、FY2025 3,455÷1,626＝2.12（決算説明資料 p16）。
                会社計画 4,202 は 4,202÷1,967＝2.14 で過去実績と整合（NS の計画は DS と違い保守的でない）。
                機器販売のフロー分が下期に寄る構造は変わらず、会社は『下期から営業体制を拡充』『Verona 大型アップデートを
                2026年12月に予定』（p8・p32、FISCO）としているが、12月リリースの売上寄与は期内ではほぼ無いと見て、
                FY2025 実績と会社計画の間の 2.13 と置いた。NS ARR は 2Q末 2,357（+29.4%）。
                FISCO は 3,000〜5,000 ユーザー級の大型案件で Zscaler 等との競合を課題に挙げており、大型案件の期ずれが下振れ要因。
                感度で最も効く変数（上期実績との積）"
        - name: "インダストリアルセキュリティ事業（アンペール、4Q のみ PL 連結）"
          expr: "ampere_q4_revenue"
          vars:
            ampere_q4_revenue:
              value: 400
              basis: assumed
              note: "アンペール（2026-05-14 株式取得、議決権 97.84%、取得価額 540）は『貸借対照表は第2四半期から連結、
                損益計算書は第4四半期から反映』（株式取得のお知らせ p3）。同社の 2025年9月期 売上 1,886・営業利益 137
                （営業利益率 7.3%）で、単純な四半期平均は 472。ただし同社は従来から網屋にネットワーク機器を販売しており
                （同 p1 取引関係）、連結では内部取引が消える。会社は決算説明資料 p30 で『来期以降 連結売上 15〜17億円／ARR
                約2〜3億円を上乗せ』としており、その1四半期分 375〜425 の中央として 400 と置いた。会社は 2026年12月期への
                影響を『軽微』とし計画 7,002 を据え置いたので、会社計画にはこの分が含まれていない可能性が高い（未確認）。
                季節性・のれん償却（のれん 272 増）・決算期差（9月期）の扱いは未開示で、幅の大きい仮定"
    profit:
      op_margin:
        value: 0.178
        basis: assumed
        note: "全社売上 × 営業利益率。中間期実績 18.8%（638÷3,397）、前期通期 17.7%（1,051÷5,936）、前期下期 17.7%
          （565÷3,189。FISCO の上期・下期表）、会社計画 17.1%（1,200÷7,002）。営業利益の上期比率は FY2024 49.2%・
          FY2025 46.2%（決算説明資料 p12）で、中間期 638 をそのまま下期偏重で伸ばすと通期 1,300 超（19% 前後）になるが、
          (1) 会社が『投資の年』として販促・人材・R&D に前期比 +1.5億円を追加し『下期から営業体制を拡充』（p28・p8）、
          (2) NS のセグメント利益率が 28.2%→25.1% に低下、(3) アンペールの営業利益率 7.3% が 4Q に連結されて希薄化、
          の3点で中間期より低い 17.8% と置いた。DS のセグメント利益率 47.7% と NS 25.1% の差が大きいため、
          DS の構成比が上がるほど率は上振れる（セグメント利益合計 1,175 に対し全社費用 537 が中間期の調整額）。
          率そのものが最大の仮定（乗法モデルの定義上、感度表では常に最上位）"
