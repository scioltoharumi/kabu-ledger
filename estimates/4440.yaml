# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未取得。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/4440/analyst_consensus）を
    2026-09-05 に取得しようとしたが HTTP 403 で読めず、コンセンサスの有無そのものを確認できていない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2026-08"
    status: draft
    note: "初版（Claude 起案・人間未確認）。8月決算で3Qまで実績が出ているため、1〜3Q実績（確定分）＋4Q（前年同期×伸び）の2区分。
      対象期はすでに終わっており（2026年8月末）、残るのは4Qの答え合わせだけ。会社計画は売上高 5,650・営業利益 633 百万円
      （fundamentals の採用値。前期比 +16.4%・+11.8%）。推定は売上が計画をやや下回り、営業利益は計画を上回る"
    revenue:
      unit: JPY_million
      segments:
        - name: "1〜3Q実績（2025年9月〜2026年5月・確定分）"
          expr: "ytd_revenue"
          vars:
            ytd_revenue:
              value: 4297
              basis: actual
              source: "data/fundamentals/4440.csv"
              note: "Q2025-09_2025-11（1,416）・Q2025-12_2026-02（1,202）・Q2026-03_2026-05（1,679）の採用値の合計。前年同期 3,680 に対し +16.8%。
                営業利益は 466→586 の +25.8%。伸びはソフトウェア事業（3Q累計 +25.8%）で、センシング事業は -25.4%（reports/4440.md）"
        - name: "4Q（2026年6〜8月・前年同期の売上×伸び）"
          expr: "prev_q4 * growth"
          vars:
            prev_q4:
              value: 1176
              basis: actual
              source: "data/fundamentals/4440.csv"
              note: "前年の Q2025-06_2025-08 の採用値"
            growth:
              value: 1.12
              basis: assumed
              note: "会社計画が含意する4Qは 1,353（5,650−4,297。前年同期比 +15.1%）。3Q累計の +16.8% には M&A で足した分
                （アグコントロールシステムを 2026年3月に取得）が含まれ、センシング事業の大型案件の納期調整が4Qに戻る保証も無いため、
                3Q累計の伸びより低い +12% と置いた"
    profit:
      op_margin:
        value: 0.12
        basis: assumed
        note: "3Q累計 13.6%（586÷4,297）、前期通期 11.7%（566÷4,856）、会社計画 11.2%（633÷5,650）。4Qは例年もっとも利益率が低い
          （前年4Q 8.5%＝100÷1,176。センシングの売上が9月・3月に集中するため）ので、通期では3Q累計より下がる。12% と置くと4Qの
          営業利益は約 90 で前年4Q（100）並み。会社計画が含意する4Q営業利益 47 はそれよりかなり低く、計画は保守的とみている"
