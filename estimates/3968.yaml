# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し。IFIS 株予報のコンセンサス欄（https://kabuyoho.ifis.co.jp/index.php?action=tp1&sa=report&bcode=3968、
    2026-10-09 取得）はレーティング・予想とも『--』で、載っているのは会社予想（売上 30,000・営業利益 2,600 百万円）だけ。
    Yahoo!ファイナンスの業績ページ（https://finance.yahoo.co.jp/quote/3968.T/performance、2026-10-09 取得）も
    アナリスト予想の数値は無し。FISCO の企業調査レポート（2026-09-28）は会社委託のスポンサードリサーチで、独自の業績予想値は
    載せていない（同レポートの業績予想表は会社予想の転記）。みんかぶ（https://minkabu.jp/stock/3968/analyst_consensus）は
    取得が 403 で拒否され未確認。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2026-12"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認。intake 当日に作成、reports/3968.md はまだ無い）。会社の『ビジネス別』4区分
      （VAD＝海外・国産セキュリティ/ネットワーク製品の代理店販売＋保守サポート／システムインテグレーション／自社開発＝RevoWorks
      シリーズ＋セグエセキュリティのSOC・MSS／海外＝タイ子会社2社）で組む。いずれも『中間期（1〜6月）の開示実績 ×（1＋下期/上期比）』
      の形で、下期/上期比だけが仮定。中間期実績は売上 15,907・営業利益 2,196 百万円（fundamentals の Q1＋Q2 採用値 9,184＋6,723／
      1,449＋747 と一致）。会社計画（2026-08-13 上方修正。売上 30,000 据え置き・営業利益 2,300→2,600）は下期を売上 14,093・
      営業利益 404（利益率 2.9%）と置いたことになり、下期の GSS（ガバメントソリューションサービス＝デジタル庁統一仕様に沿った
      府省庁向け案件）減少と人材採用・育成の積極投資を理由に慎重。FISCO は『達成可能な最低限の予想を出す傾向』と評し、会社自身も
      期初予算達成率の過去10年平均を売上 103%・営業利益 110% と説明している。本推定は売上を計画並み、営業利益は下期利益率を
      前年下期（7.8%）と計画含意（2.9%）の間に置いて計画超過と見るが、下期利益率が最も効く仮定であり一次情報では確認できない。
      出典: FISCO 企業調査レポート https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/segue20260928.pdf（p8〜11、2026-10-09 取得）／
      ログミーFinance 2026年12月期2Q決算説明 https://finance.logmi.jp/articles/385813 および質疑 https://finance.logmi.jp/articles/385691／
      同 2025年12月期通期決算説明 https://finance.logmi.jp/articles/383916（いずれも 2026-10-09 取得）。
      決算短信本体（JPX）と株探・みんかぶは取得が 403 で拒否され未読。四半期ごとのビジネス別内訳は開示されておらず未確認"
    revenue:
      unit: JPY_million
      segments:
        - name: "VADビジネス（セキュリティ/ネットワーク製品の代理店販売＋保守サポート）"
          expr: "vad_h1 * (1 + vad_h2_ratio)"
          vars:
            vad_h1:
              value: 8690
              basis: disclosed
              source: "https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/segue20260928.pdf（p9、2026-10-09取得）"
              note: "2026年12月期中間期の VAD 売上高 86.9億円（前年同期比 +64.3%、売上構成比 54.7%、売上総利益率 25.7%）。
                FISCO が決算説明資料から転記した値。GSS 案件・セキュリティソフト大型案件・サポートサービスが寄与し、
                『GSS 案件を除いても増収増益』と会社説明。4区分の合計 8,690＋5,410＋910＋880＝15,890 は中間期売上 15,907 と
                17 の差（各区分の億円単位丸め）"
            vad_h2_ratio:
              value: 0.85
              basis: assumed
              note: "下期売上 ÷ 上期売上。会社は下期に GSS 案件の減少を見込む（FISCO p11・2Q 説明会）。参照値: 前年（2025年12月期）の
                VAD は上期 約5,289（8,690÷1.643）・通期 約13,791（25,074×構成比 55.0%、ログミー通期決算説明）→ 下期 約8,502、
                下期/上期比 1.61 だが、これは 2025年2Q 受注の超大型 GSS 案件の売上計上が 3Q から始まった特殊年。
                2024年12月期は会社開示の区分値が手元に無く比較不能。本推定は『上期の GSS 寄与の一部が剥落し、サポートサービス
                （前受金 8,877 百万円・前期末比 +2,117 を月次按分）の積み上げが下支え』として 0.85（下期 約7,387。前年下期比 -13%、
                通期 約16,077＝前年比 +17%）と置いた。中期計画の VAD 目標 130億円は上期だけで超過。
                四半期別・案件別の VAD 内訳は開示が無く、ここが売上側で最も幅のある仮定"
        - name: "システムインテグレーションビジネス"
          expr: "si_h1 * (1 + si_h2_ratio)"
          vars:
            si_h1:
              value: 5410
              basis: disclosed
              source: "https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/segue20260928.pdf（p9、2026-10-09取得）"
              note: "2026年12月期中間期の SI 売上高 54.1億円（前年同期比 +56.2%、構成比 34.1%、売上総利益率 19.9%＝前年同期比
                +2.4pt）。大手サービス業向け大型案件、府省庁・大学・金融向け案件、GSS 案件の設計構築・プロフェッショナル
                サービスを計上。会社の説明会資料では SI の金額は非開示で、FISCO レポート経由の値"
            si_h2_ratio:
              value: 0.95
              basis: assumed
              note: "下期売上 ÷ 上期売上。前年は上期 約3,464（5,410÷1.562）・通期 約8,525（25,074×34.0%）→ 下期 約5,061、
                下期/上期比 1.46 と下期偏重（GSS 関連の設計構築が 3Q 以降に乗った）。今期は上期に大手サービス業向け大型案件を
                計上済みで、下期は GSS 関連の設計構築が減る一方、受注残はサービス 110.99億円と高水準（2Q 説明会）。
                大型案件の剥落と受注残の消化が相殺するとして 0.95（下期 約5,140。前年下期比 +2%、通期 約10,550＝前年比 +24%）。
                中期計画の SI 目標 90億円は超過する水準"
        - name: "自社開発ビジネス（RevoWorks＋セグエセキュリティ）"
          expr: "own_h1 * (1 + own_h2_ratio)"
          vars:
            own_h1:
              value: 910
              basis: disclosed
              source: "https://finance.logmi.jp/articles/385813（2026-10-09取得）"
              note: "2026年12月期中間期の自社開発売上高 9.1億円（前年同期比 +50.5%、構成比 5.7%、売上総利益 6.4億円＝構成比 15.3%、
                売上総利益率 71.0%＝前年同期比 +14.0pt）。RevoWorks シリーズで過去最大規模の府省庁向け案件を獲得。
                FISCO p9 も同値"
            own_h2_ratio:
              value: 0.80
              basis: assumed
              note: "下期売上 ÷ 上期売上。前年は上期 約605（910÷1.505）・通期 約1,128（25,074×4.5%）→ 下期 約523、下期/上期比 0.86。
                今期上期は最大規模の府省庁案件（金額非開示）が乗っており反動を見る一方、セグエセキュリティの府省庁向け SOC 案件が
                『下期以降の計上』（2Q 説明会）、RevoWorks クラウド（サブスクリプション）の積み上げ、2026-08 発売の Sanitize
                Browser/Apps、2026-09 の ZONE 向け DNS Protection オプション（fetch_news 見出し 2026-09-29/30）が加わる。
                前年の 0.86 からやや下げて 0.80（下期 約728。前年下期比 +39%、通期 約1,638＝前年比 +45%）。中期計画の
                自社開発目標 18億円には届かない見立て。売上総利益率 71% と最も高い区分なので、+10% の売上感度以上に利益へ効く
                （本モデルは全社一律の利益率で丸めている。4.5 の自己点検参照）"
        - name: "海外ビジネス（タイ: First One Systems・ISS Resolution）"
          expr: "overseas_h1 * (1 + overseas_h2_ratio)"
          vars:
            overseas_h1:
              value: 880
              basis: disclosed
              source: "https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/segue20260928.pdf（p9、2026-10-09取得）"
              note: "2026年12月期中間期の海外売上高 8.8億円（前年同期比 +39.5%、構成比 5.5%、売上総利益率 32.0%）。
                First One Systems は売上 1.6倍・営業利益 2倍超、ISS は売上不振で体制再構築を検討"
            overseas_h2_ratio:
              value: 1.0
              basis: assumed
              note: "下期売上 ÷ 上期売上。前年は上期 約631（880÷1.395）・通期 約1,630（25,074×6.5%）→ 下期 約999、下期/上期比 1.58
                だが、構成比 6.5% の丸め（±0.05pt＝±13）と ISS の不振で下期の再現性は低いと見る。FOS の受注堅調と ISS の縮小が
                相殺するとして 1.0（下期 880。前年下期比 -12%、通期 1,760＝前年比 +8%）。中期計画の海外目標 22億円には届かない。
                全社に対する感度は小さい（売上の 6%）"
    profit:
      op_margin:
        value: 0.105
        basis: assumed
        note: "通期営業利益率。上期実績 13.8%（2,196÷15,907。fundamentals の Q1 15.78%・Q2 11.11% の加重）に対し、会社計画
          8.67%（2,600÷30,000）は下期を 404÷14,093＝2.9% と置いたことになる。参照値: 前年下期は 1,169÷15,074＝7.8%
          （fundamentals Q3 750＋Q4 419）、2024年下期は 374÷10,307＝3.6%、2025年通期 7.4%、2024年通期 3.85%。
          下期の見方: 売上総利益率は GSS のフロー売上（低利益率）が減りサポートサービス・RevoWorks の比重が上がるため
          上期 26.7% の近辺を保つが、販管費は人材採用・育成の積極投資で上期 2,045 から増える（前年も下期販管費 2,203 は
          上期 1,873 の +18%）。売上総利益率 25% × 下期売上 約14,100 ≒ 3,525 から販管費 約2,350〜2,550 を引くと下期営業利益
          約1,000〜1,200（利率 7〜8.5%）だが、会社が計画含意で 2.9% まで下げている理由（投資額・GSS 剥落幅）は非開示なので、
          その間を取って下期 約6.8%（通期 10.5%・営業利益 約3,150）と置いた。会社計画比 +21%、上期実績に下期 約955 を足した水準。
          **感度で最も効く変数で、一次情報では確認できていない。** 下期利益率が計画含意の 2.9% なら通期 8.7%、前年下期並み
          7.8% なら通期 11.0% がレンジ。3Q 決算（2026-11 予定）で下期の販管費水準が分かるので、そこで置き直す前提。
          自己点検（4.5）: 本モデルは区分ごとに売上総利益率が 20〜71% と大きく違うのを全社一律の営業利益率で丸めている。
          自社開発の売上感度は実際にはここに示す値より利益に強く効く点に注意"
