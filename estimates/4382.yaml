# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "売上高・営業利益のコンセンサスは見つけていない。IFIS株予報（https://kabuyoho.ifis.co.jp/index.php?action=tp1&sa=report&bcode=4382、
    2026-09-27取得）には2027年4月期の経常利益のコンセンサス予想 600 百万円（会社予想 700 に対し「弱気」）だけが載っている。
    経常利益は営業利益ではないので数値欄には載せない。みんかぶ（https://minkabu.jp/stock/4382/analyst_consensus、2026-09-27）は 403 で読めず。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2027-04"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。4月決算。報告セグメント2つ（AIX事業／AI Security事業＝子会社バリオセキュア）を
      それぞれ「今期1Q実績×年率換算係数」で置く。1Q（2026年5〜7月）のセグメント売上は2027年4月期第1四半期決算短信のセグメント注記
      （https://www.release.tdnet.info/inbs/140120260911534909.pdf、2026-09-27取得）による。AIX 内部の分解（将棋ウォーズのプレミアム会員×単価、
      HEROZ ASK の ARR、BtoB 受託の稼働案件×単価）は会員数・単価の開示が無く組めないため、セグメント単位で止めた。
      会社計画は売上高 6,800・営業利益 800 百万円（fundamentals の採用値。前期比 +5.9%・+53.0%）。のれん償却前営業利益の計画は 960。
      前期（FY2026-04）の四半期別セグメント売上は決算説明資料 p10（https://www.release.tdnet.info/inbs/140120260911535155.pdf、2026-09-27取得）の
      グラフの数値ラベル: AIX 810/873/891/1,015（計 3,589）、AI Security 706/713/699/724（計 2,842）。
      前期1Qの AIX にはその後連結除外したストラテジット社の売上 79 が含まれ、今期1Qには 2026-05-01 連結の AKM コンサルティングが入っている"
    revenue:
      unit: JPY_million
      segments:
        - name: "AIX事業（将棋ウォーズ等BtoC・HEROZ ASK・BtoB受託・AKM）"
          expr: "aix_q1_revenue * aix_annualize"
          vars:
            aix_q1_revenue:
              value: 937
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260911534909.pdf（2026-09-27取得。2027年4月期第1四半期決算短信 セグメント情報: AIX事業 外部顧客売上 934,699千円＋セグメント間 2,164千円）"
              note: "前年同期 810（ストラテジット除外後 731）。会社説明ではストラテジット除外後 +28.2%、AKM も除くと +26.7%（決算説明資料 p10）"
            aix_annualize:
              value: 4.4
              basis: assumed
              note: "1Qから通期への換算係数。感度で最も効く変数。前期の AIX は四半期ごとに右肩上がりで4Qが最大（1Q 810→4Q 1,015）、
                1Qの通期比は 22.6%（係数 4.43）、ストラテジット分を除くと 731÷3,510＝20.8%（4.80）。今期は1Qに AKM が丸ごと入っており
                期中の上積みは前期ほど無いとみて、前期実績の 4.43 をやや下回る 4.4 と置いた。2026-08 決議の AI研修事業の譲受（エキストラ）は
                規模が開示されておらず入れていない。HEROZ ASK は ARR 2.3億円（2026年7月末）で AIX の 6% 程度にとどまり、単独では桁を動かさない"
        - name: "AI Security事業（バリオセキュア。セキュリティBPOのストック収益中心）"
          expr: "sec_q1_revenue * sec_annualize"
          vars:
            sec_q1_revenue:
              value: 709
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260911534909.pdf（2026-09-27取得。同セグメント情報: AI Security事業 外部顧客売上 708,713千円）"
              note: "前年同期 706（+0.3%）。リカーリング売上は前年同期比 +7.2%（決算説明資料 p9）だが、セグメント売上全体はほぼ横ばい"
            sec_annualize:
              value: 4.05
              basis: assumed
              note: "ストック型で四半期の振れが小さい（前期 699〜724）。前期の通期÷1Q は 2,842÷706＝4.03。リカーリングがわずかに伸びている
                ことを受けて 4.05 と置いた。前期並みなら売上は約 2,860"
    profit:
      op_margin:
        value: 0.11
        basis: assumed
        note: "前期通期 8.1%（523÷6,424）、今期1Q 11.0%（180÷1,643）。1Q には M&A 関連費用 29 百万円（決算説明資料 p4 の AI Security の注記）が
          一時的に乗っており、除くと約 12.7%。会社計画は 11.8%（800÷6,800）。一方、前期の四半期営業利益率は 6.3〜9.5% で振れ、
          販管費は AKM 連結で前年同期比 +16.7%。一時費用除きの1Qと前期の間で、会社計画をやや下回る 11% と置いた。
          IFIS の経常利益コンセンサス 600 が会社予想 700 を下回っている（市場は利益計画に懐疑的）ことも下振れ側に置いた理由"
