# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "みんかぶ 証券アナリスト予想（4人: 強気買い1・買い2・中立1）"
  revenue: 285770
  source: "https://minkabu.jp/stock/6622/analyst_consensus（2026-09-05取得。2027年3月期の売上高コンセンサス 285,770百万円。同ページに営業利益のアナリスト予想は掲載なし）"
  note: "営業利益のコンセンサスは掲載が無いため載せない（純利益予想 18,908百万円は営業利益ではないので使わない）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: draft
    note: "初版（Claude 起案・人間未確認）。会社が開示する3セグメント（エネルギーマネジメント・マテリアルプロセシング・ファクトリーオートメーション）
      それぞれを前期売上×伸びで置く。伸びの根拠は受注残高（この会社は受注残を開示している）。会社計画は売上高 280,000・営業利益 25,000 百万円
      （fundamentals の採用値。前期比 +17.8%・+33.1%）。推定売上は計画とほぼ同じ、営業利益は計画をやや下回る（計画の利益率 8.9% に
      対し当推定 8.5%）。セグメント売上の合計（237,579）と連結売上（237,735）の差 156 は調整額で、無視できる大きさなので置かない"
    revenue:
      unit: JPY_million
      segments:
        - name: "エネルギーマネジメント（受変電機器・蓄電池・EV充電）"
          expr: "prev_revenue * growth"
          vars:
            prev_revenue:
              value: 128220
              basis: disclosed
              source: "https://www.daihen.co.jp/ir/summary_pdf/2026_0511_kessan.pdf（2026年3月期決算短信・セグメント情報。取得日 2026-08-31）"
              note: "FY2026-03 のセグメント売上高。セグメント利益 14,165（利益率 11.0%）"
            growth:
              value: 1.15
              basis: assumed
              note: "前期末の受注残高が前期比 +20.6%（同短信）。受注残が売上に変わる速さは大形変圧器の生産能力で決まり、会社は 2026年度に 1.2倍へ
                増強中（reports/6622.md「この会社は何者か」）。受注残の伸びをそのまま売上には出せないとみて +15% と置いた"
        - name: "マテリアルプロセシング（半導体製造装置向け電源・溶接電源）"
          expr: "prev_revenue * growth"
          vars:
            prev_revenue:
              value: 76426
              basis: disclosed
              source: "https://www.daihen.co.jp/ir/summary_pdf/2026_0511_kessan.pdf（2026年3月期決算短信・セグメント情報。取得日 2026-08-31）"
              note: "FY2026-03 のセグメント売上高。セグメント利益 7,422（利益率 9.7%）"
            growth:
              value: 1.30
              basis: assumed
              note: "前期末の受注残高が前期比 +88.7%（同短信）と3セグメントで最大の伸び。1Qの全社受注高も +46.5%
                （2027年3月期第1四半期決算短信 https://www.daihen.co.jp/ir/summary_pdf/2026_0804_kessan.pdf 取得日 2026-09-01）。
                半導体製造装置は顧客の投資計画で期ずれしやすく、受注残の伸びの1/3程度が今期の売上に立つとみて +30% と置いた。
                感応度で最も効く変数の一つ"
        - name: "ファクトリーオートメーション（溶接・搬送ロボット）"
          expr: "prev_revenue * growth"
          vars:
            prev_revenue:
              value: 32933
              basis: disclosed
              source: "https://www.daihen.co.jp/ir/summary_pdf/2026_0511_kessan.pdf（2026年3月期決算短信・セグメント情報。取得日 2026-08-31）"
              note: "FY2026-03 のセグメント売上高。セグメント利益 1,971（利益率 6.0%）"
            growth:
              value: 1.03
              basis: assumed
              note: "自動車・機械向けの設備投資に連動し、受注残の伸びの開示で目立った増加が無い。ほぼ横ばいの +3% と置いた"
    profit:
      op_margin:
        value: 0.085
        basis: assumed
        note: "通期実績 7.9%（FY2026-03 の採用値 18,778÷237,735）、1Q実績 7.3%（前年同期 6.4%）、会社計画 8.9%（25,000÷280,000）。
          セグメント利益率（11.0%・9.7%・6.0%）を推定売上の構成で加重すると約 9.9%、そこから前期の全社調整（セグメント利益合計 23,558 と
          営業利益 18,778 の差 4,780＝売上の 2.0%）を引くと約 8.0%。売上増で固定費が薄まるぶんを見て 8.5% と置いた。会社計画の 8.9% は
          その先の改善を見込んでいる"
