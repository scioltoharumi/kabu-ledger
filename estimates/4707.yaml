# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/4707/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2026-10"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。10月決算で3Qまで実績が出ているため、1〜3Q実績（確定分）＋4Q（前年同期×伸び）の2区分。
      会社計画は売上高 3,587・営業利益 254 百万円（fundamentals の採用値。前期比 +3.5%・+74%）。3Q累計の売上が前年同期比 -4.9% で、
      計画どおりなら4Qだけで前年同期比 +26.7% が要る。推定は売上・営業利益とも会社計画を下回る。四半期の営業利益は台帳に採用値が無く、
      3Q累計の営業利益 158 は決算短信からの転記（一次情報・未照合。出典は reports/4707.md）"
    revenue:
      unit: JPY_million
      segments:
        - name: "1〜3Q実績（2025年10月21日〜2026年7月20日・確定分）"
          expr: "ytd_revenue"
          vars:
            ytd_revenue:
              value: 2424
              basis: actual
              source: "data/fundamentals/4707.csv"
              note: "Q2025-11_2026-01（801）・Q2026-02_2026-04（977）・Q2026-05_2026-07（646）の採用値の合計。前年同期 2,549 に対し -4.9%。
                受注高は 22.7億円で前年同期比 -14.6%（第3四半期決算短信 https://kitac.co.jp/wp/wp-content/uploads/2026/08/20260828.pdf）"
        - name: "4Q（2026年7月21日〜10月20日・前年同期の売上×伸び）"
          expr: "prev_q4 * growth"
          vars:
            prev_q4:
              value: 918
              basis: actual
              source: "data/fundamentals/4707.csv"
              note: "前年の Q2025-08_2025-10 の採用値"
            growth:
              value: 1.05
              basis: assumed
              note: "会社計画が含意する4Qは 1,163（3,587−2,424。前年同期比 +26.7%）だが、3Q累計の受注高が -14.6% で先行指標が弱い。
                公共の防災・老朽化対策予算は底堅いとみて前年同期を少し超える +5% と置いた。計画との差は受注の弱さの分"
    profit:
      op_margin:
        value: 0.05
        basis: assumed
        note: "前期通期 4.2%（146÷3,467）、前々期 10.8%（362÷3,342）、会社計画 7.1%（254÷3,587）。3Q累計は 158÷2,424＝6.5%。
          前期は4Qに損失（通期 146 − 3Q累計 166 ＝ -20）が出ており、今期も4Qは薄いとみて通期 5% と置いた。技術者の人件費が固定的で
          売上の減少がそのまま利益率に効く"
