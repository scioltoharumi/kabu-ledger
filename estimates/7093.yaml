# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリストカバー無し。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/7093/analyst_consensus、2026-09-05取得）に
    コンセンサス予想の表が存在しない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-05"
    period: "FY2026-12"
    status: draft
    note: "初版（Claude 起案・人間未確認）。12月決算で中間期まで実績が出ているため、上期実績（確定分）＋下期（前年同期×伸び）の2区分。
      セグメントは1つで内訳の開示が無い。会社計画は売上高 4,100・営業利益 70 百万円（fundamentals の採用値。前期の営業利益 2.5 からの比較は
      水準が低すぎて率に意味が無く、額で見る）。計画どおりなら下期の売上は前年同期比 +16.8% が要るが、上期は +4.6% にとどまり、
      2026年7月にフィリピン子会社の譲渡を決議した（売上の減少要因）。推定は売上・営業利益とも会社計画を下回る。
      前期の営業利益が 2.5 のため銘柄一覧の前期比の率は極端に出る（低ベース）"
    revenue:
      unit: JPY_million
      segments:
        - name: "上期実績（2026年1〜6月・確定分）"
          expr: "h1_revenue"
          vars:
            h1_revenue:
              value: 1865
              basis: actual
              source: "data/fundamentals/7093.csv"
              note: "Q2026-01_2026-03（945）・Q2026-04_2026-06（920）の採用値の合計。前年同期 1,783 に対し +4.6%。営業利益は -27.8→-3（2Q単独は -13）"
        - name: "下期（2026年7〜12月・前年同期の売上×伸び）"
          expr: "prev_h2 * growth"
          vars:
            prev_h2:
              value: 1913
              basis: actual
              source: "data/fundamentals/7093.csv"
              note: "前年の Q2025-07_2025-09（941）・Q2025-10_2025-12（972）の採用値の合計"
            growth:
              value: 1.00
              basis: assumed
              note: "会社計画が含意する下期は 2,235（4,100−1,865。前年同期比 +16.8%）。上期の伸び +4.6% に対し、フィリピン子会社の譲渡
                （2026年7月15日決議）で下期の売上は減る方向。ストック収益率 97.3%・月次解約率 1.2% で急には崩れないが、
                売上が人員数に比例する構造で伸びも急には出ない（reports/7093.md）。差し引き前年同期並みの ±0% と置いた"
    profit:
      op_margin:
        value: 0.005
        basis: assumed
        note: "上期 -0.2%（-3÷1,865）、前期通期 0.07%（2.5÷3,696）、会社計画 1.7%（70÷4,100）。前期下期は 30.8÷1,913＝1.6% と下期に利益が
          寄る形で、今期も下期に同程度が出れば通期 0.5% 前後。火災（2026年5月末）の臨時オフィス費用と補償金の出方で上下どちらにも振れる"
