# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリスト予想のカバーは確認できず。株予報（https://kabuyoho.jp/report?bcode=4386、2026-10-09）はコンセンサスの
    経常利益・目標株価・レーティングが全て「--」（未記載）で、会社予想（売上 12,000・営業利益 800 百万円）のみ掲載。
    みんかぶのアナリスト予想ページ（https://minkabu.jp/stock/4386/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。
    東証スタンダード・時価総額の小さい銘柄でセルサイドのカバーは無い公算が高い（FISCO の企業調査レポートは
    会社委託のスポンサードリサーチで、同レポート内に FISCO 独自の予想値は無い）。比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。会社は『システム開発及びインフラ・セキュリティサービス事業の単一セグメント』として
      短信にセグメント注記を置かないが、決算説明資料で『システム開発』『インフラ・セキュリティサービス』の2事業別売上を
      開示しているので、その2区分で組む。各区分は 1Q（2026-04〜06）実績 × 年率換算係数 の2変数。1Q の2区分合計
      1,924＋792＝2,716 は連結売上高（短信・fundamentals の採用値）と一致するので、内部取引の二重計上は無い。
      会社計画は売上 12,000（前期比 +10.3%・事業別 システム開発 8,680 ／ インフラ・セキュリティ 3,320）・営業利益 800
      （+6.5%・利益率 6.7%）で、1Q 決算で据え置き。1Q は売上 +4.4%（システム開発 +2.1%・インフラ +10.2%）と計画の
      伸びに届かない一方、営業利益は +61.9%（利益率 8.2%、前年同期 5.3%）と計画の利益率を大きく上回った。
      本推定は『売上は計画未達・利益は計画超過』の形になる。売上で最も効くのはシステム開発の年率換算係数
      （＝2Q 以降の加速の有無。UIS の開発部門の要員不足と一部顧客の体制縮小が解けるか）、利益で最も効くのは
      営業利益率（1Q の 8.2% が外注費削減・単価改善の定着か、賞与・採用・AI 投資で後半に戻るか）。
      2Q 決算（2026-11-12 予定）で 2Q 単独の売上成長率と利益率が分かるので、そこで置き直す前提。
      前提に置いた M&A は無し（会社の2027年3月期目標 120 億円のうち 30 億円は M&A 獲得分とされるが、
      新規の買収開示は無い。2026-07-15 のぴーぷる社との業務提携は『当期連結業績に与える影響は軽微』と開示）。
      出典: 2027年3月期 第1四半期決算説明資料 https://www2.jpx.co.jp/disc/43860/140120260807515405.pdf
      ／2027年3月期 第1四半期決算短信 https://www2.jpx.co.jp/disc/43860/140120260807515367.pdf
      ／FISCO 企業調査レポート 2026-06-08 https://www.fisco.co.jp/wordpress/wp-content/uploads/FISCO/sig20260608.pdf
      ／ぴーぷる社との業務提携に関するお知らせ https://www2.jpx.co.jp/disc/43860/140120260714593547.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "システム開発事業"
          expr: "q1_sysdev_revenue * annualize_sysdev"
          vars:
            q1_sysdev_revenue:
              value: 1924
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/43860/140120260807515405.pdf（2026-10-09取得）"
              note: "2027年3月期 1Q（2026-04〜06）のシステム開発 累計売上高（決算説明資料 p10）。前年同期 1,884 → +2.1%。
                会社の説明は『公共・社会インフラ関連案件が安定』『防衛・DX案件や受託開発案件が拡大』。一方 p11 で
                UIS について『一部顧客での体制縮小や開発部門の要員不足の影響を受け、売上成長は限定的』"
            annualize_sysdev:
              value: 4.2
              basis: assumed
              note: "1Q 売上から通期への係数。前期（FY2026-03）のシステム開発は通期 7,796（FISCO レポート p5 の事業別売上表。
                出所は決算説明資料）÷ 1Q 1,884 ＝ 4.14。連結全体の 1Q 比率は FY2025-03 23.6%（係数 4.23）・FY2026-03 23.9%
                （係数 4.18、いずれも fundamentals の四半期採用値）で、年度末 3月に案件クローズが集中する下期偏重が毎年続く。
                前期の係数 4.14 に、会社が 1Q 資料で挙げる『新規顧客案件が順調に立ち上がり売上に寄与』『防衛関連案件で増員』
                の 2Q 以降の積み上がりを少し乗せて 4.2 と置いた（→ 通期 約 8,081、前期比 +3.7%）。
                会社計画 8,680 は係数 4.51 に相当し、2Q 以降に前年比 +13% 前後の加速が要る。前期の実質成長（ACR 新規連結の
                売上 1,648 を除く）は約 +3% で、1Q も +2.1% なので、加速の根拠は一次情報では確認できていない。
                売上の感度で最も効く変数（一次情報で四半期配分は確認できていない）"
        - name: "インフラ・セキュリティサービス事業"
          expr: "q1_infra_revenue * annualize_infra"
          vars:
            q1_infra_revenue:
              value: 792
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/43860/140120260807515405.pdf（2026-10-09取得）"
              note: "2027年3月期 1Q のインフラ・セキュリティサービス 累計売上高（決算説明資料 p10）。前年同期 718 → +10.2%。
                『クラウド基盤構築案件が拡大』『ネットワーク基盤案件が安定成長』『情報セキュリティサービス認定を追い風とした
                需要拡大』。SIG 本体のサイバーセキュリティ案件と UIS のクラウド案件が増収の中心（p11）"
            annualize_infra:
              value: 4.3
              basis: assumed
              note: "前期（FY2026-03）のインフラ・セキュリティは通期 3,081 ÷ 1Q 718 ＝ 4.29（FISCO レポート p5 の事業別売上表）。
                この区分は前期も実質成長（UIS は FY2025-03 から通年連結なので M&A 効果なし）で +9.6%、1Q も +10.2% と
                伸びが安定しているため、前期の季節パターンをそのまま置いて 4.3（→ 通期 約 3,406、前期比 +10.5%）。
                会社計画 3,320（+7.2%）は 1Q の伸びより控えめで、本推定は計画をやや上回る。
                下振れ要因は『地方拠点におけるクラウド・セキュリティ領域の要員体制』（FISCO p13）が採用で追いつくか"
    profit:
      op_margin:
        value: 0.075
        basis: assumed
        note: "全社売上に掛ける営業利益率。1Q 実績 8.2%（223÷2,716、fundamentals の採用値。前年同期 5.3%）、
          前期通期 6.9%、会社計画 6.7%（800÷12,000）。前期の四半期利益率は 5.3 → 7.5 → 7.5 → 7.3%（fundamentals の
          四半期採用値）で 1Q が年間の底だったのに対し、今期は 1Q から 8.2% に乗った。要因は会社説明で
          『インフラ・セキュリティ領域の一次請け案件の拡大および単価改善』『子会社の外注費削減効果』（1Q 資料 p9）。
          単価改善と外注費削減は構造的で後の四半期にも残ると見る一方、会社は『子会社の外注費削減効果により第1四半期は
          収益向上』と 1Q 限定の含みで書いており、賞与・新卒採用（連結従業員 808 名（2026-03）→ 848 名（2026-06））・
          AI 活用投資・のれん償却（約 34/四半期）の負担も続くため、1Q の 8.2% と前期後半の 7.3〜7.5% の間の 7.5% と置いた。
          会社計画の 6.7% は 1Q の実績からは保守的に見える（2Q 累計計画 371 に対し 1Q だけで 223＝60%）。
          営業利益の感度で最も効く変数。ここが 6.7% なら営業利益は約 770 と計画を下回り、8.2% 据え置きなら約 940"
