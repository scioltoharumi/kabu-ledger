# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未確認。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/4075/analyst_consensus、2026-09-27取得試行）は
    HTTP 403 で本文を読めず、コンセンサスの有無を確かめられていない。売上 14億円規模のグロース銘柄でカバーは薄いと見るが推測。
    比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2027-07"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。報告セグメントは単一（エンタープライズAIソフトウェア事業。Neuron ES＝企業内検索、
      Impulse＝製造業向け異常検知）だが、会社が決算説明資料で売上を『ストック（利用料＋保守）』『買取ライセンス』
      『それ以外（導入・構築・カスタマイズ等のサービス）』に分けて比率を開示しているので、この3区分で切った。
      7月決算で 2026-09-11 に本決算が出たばかり（今期の四半期実績はまだ無い）。前期（FY2026-07）実績は売上 1,433・営業利益 250
      （fundamentals の採用値）。会社計画は売上 1,707（+19.1%）・営業利益 250（±0%）で、オフィス移転・給与テーブル改定・
      AIエージェント／フィジカルAI への投資で費用が大きく増える前提（決算説明資料 p.46、https://www.release.tdnet.info/inbs/140120260911534973.pdf、
      2026-09-27取得）。前期は売上が計画 1,510 に対し 94.9% と未達、費用が計画を下回って利益だけ超過した。
      推定は売上・営業利益とも会社計画を下回る。12月の1Q決算で置き直す前提"
    revenue:
      unit: JPY_million
      segments:
        - name: "ストック売上（利用料＋保守。ライセンス数×1本当たり年間売上）"
          expr: "stock_licenses * revenue_per_stock_license"
          vars:
            stock_licenses:
              value: 495
              basis: assumed
              note: "前期末のストックライセンス 487本（前期末比横ばい。4Q は増加24・解約等17の純増7。決算説明資料 p.20、
                https://www.release.tdnet.info/inbs/140120260911534973.pdf、2026-09-27取得）。アップグレードでは本数が増えない数え方で、
                解約は3月末（3Q）に偏る。前期並みの純増ゼロ〜4Q並みの年間 +20 程度の間として期中平均 495 と置いた"
            revenue_per_stock_license:
              value: 1.03
              basis: assumed
              note: "百万円/本・年。前期のストック売上は売上の 34%（決算説明資料 p.38）≒ 487（1,433×0.34。比率が整数丸めのため ±7 の幅）で、
                期末 487本で割ると約 1.00。会社は『アップグレード時は既存のストックライセンス単価が上昇する』『ストック売上は今後緩やかに上昇』
                と説明（同資料 p.19・p.21）。単価の上昇率は開示が無く、+3% は推測"
        - name: "買取ライセンス売上（前期×伸び）"
          expr: "perpetual_prev * perpetual_growth"
          vars:
            perpetual_prev:
              value: 458
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260911534973.pdf（2026-09-27取得）"
              note: "決算説明資料 p.38 のソフトウェア売上 945（買取＋ストック）から上のストック推計 ≒487 を引いた値（≒458。±7 の幅）。
                買取売上は大型ライセンスで伸び、4Q は前年同期比 +111.5%（同資料 p.19）"
            perpetual_growth:
              value: 1.20
              basis: assumed
              note: "感度で最も効く部類。買取は1件ごとの大型案件で振れが大きい（前期は期ずれで4Qに集中、4Q売上は前年同期比 +41.3%）。
                公共・地方自治体への導入が進み買取ライセンスは高水準（同資料 p.20）。会社計画の +19.1% と同程度の +20% と置いたが、
                前期4Qの大型案件が再現する保証は無く、一次情報で内訳の計画は確認できていない"
        - name: "サービス売上（導入・構築・カスタマイズ等。前期×伸び）"
          expr: "service_prev * service_growth"
          vars:
            service_prev:
              value: 488
              basis: disclosed
              source: "https://www.release.tdnet.info/inbs/140120260911534973.pdf（2026-09-27取得）"
              note: "売上 1,433 からソフトウェア売上 945 を引いた値（決算説明資料 p.38。ソフトウェア売上比率 66%）"
            service_growth:
              value: 1.10
              basis: assumed
              note: "導入作業はエンジニアの工数に比例する。前期末従業員 70人（前期末比 −3人。同資料 p.26）で、今期は給与テーブル改定と
                オフィス移転で採用・定着を図る計画（同資料 p.46）。人員が増えるまでは工数の伸びは限られ、AIエージェント・フィジカルAI の
                新規案件（PoC・構築）が上乗せ分。+10% と推測"
    profit:
      op_margin:
        value: 0.13
        basis: assumed
        note: "前期 17.5%（250÷1,433）、会社計画 14.7%（250÷1,707）。会社は『売上がコストと連動しておらず、固定費の人的コストを
          超過した部分がそのまま利益になる』と説明（決算説明資料 p.25）。計画の費用は 1,457（1,707−250。前期 1,183 から +23%）で、
          売上が計画を下回ればその分がほぼそのまま減益になる。一方、前期は費用が計画を約 8% 下回った（計画費用 1,286→実績 1,183）。
          推定売上に対し費用を計画の約 97%（≒1,420）とみると率は 13〜14%。低い側の 13% と置いた"
