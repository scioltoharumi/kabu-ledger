# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "未取得。みんかぶの証券アナリスト予想ページ（https://minkabu.jp/stock/6554/analyst_consensus）を
    2026-09-27 に取得しようとしたが HTTP 403 で読めず、コンセンサスの有無そのものを確認できていない。比較対象は会社計画のみ"

models:
  - as_of: "2026-09-27"
    period: "FY2026-09"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。9月決算で3Qまで実績が出ているため、1〜3Q実績（確定分）＋4Q（前年同期×伸び）の2区分。
      対象期は 2026-09-30 で終わり、残るのは4Qの答え合わせだけ。本業はエンジニア派遣・業務受託（ソリューション事業）で、
      本来は在籍エンジニア数×稼働率×月額単価で組むべきだが、直近の在籍数・単価を一次情報で確認できず（決算短信 PDF は
      kabutan・TDnet とも 2026-09-27 に HTTP 403）、変数を増やさなかった。会社計画は売上高 16,902・営業利益 1,365 百万円
      （fundamentals の採用値。前期比 +12.6%・+12.6%）。推定は売上が計画を下回り、営業利益は計画を上回る"
    revenue:
      unit: JPY_million
      segments:
        - name: "1〜3Q実績（2025年10月〜2026年6月・確定分）"
          expr: "ytd_revenue"
          vars:
            ytd_revenue:
              value: 12094
              basis: actual
              source: "data/fundamentals/6554.csv"
              note: "Q2025-10_2025-12（3,924）・Q2026-01_2026-03（4,110）・Q2026-04_2026-06（4,060）の採用値の合計。
                前年同期 11,087（3,681＋3,776＋3,630）に対し +9.1%。四半期ごとの前年同期比は +6.6%・+8.8%・+11.8% と加速している。
                営業利益は 973→1,158 の +19.0%"
        - name: "4Q（2026年7〜9月・前年同期の売上×伸び）"
          expr: "prev_q4 * growth"
          vars:
            prev_q4:
              value: 3928
              basis: actual
              source: "data/fundamentals/6554.csv"
              note: "前年の Q2025-07_2025-09 の採用値"
            growth:
              value: 1.09
              basis: assumed
              note: "会社計画が含意する4Qは 4,808（16,902−12,094。前年同期比 +22.4%）で、3Q までの実績の伸びから大きく離れている。
                計画は期初から据え置かれている可能性がある（fundamentals の H2026-04_2026-09 売上計画 8,868 は SINGLE_SOURCE）。
                3Q単独の +11.8% は直近で最も高いが、Web 検索の要約（2026-09-27、https://kabuyoho.jp/report?bcode=6554 ほか）に
                HRコンサルティング事業の譲渡益への言及があり、譲渡した事業の売上が4Qから抜ける可能性がある
                （譲渡の時期・規模は一次情報で確認できていない）。そのため3Q単独ではなく3Q累計の +9.1% と同じ 1.09 と置いた。
                感度上位の変数"
    profit:
      op_margin:
        value: 0.088
        basis: assumed
        note: "3Q累計 9.6%（1,158÷12,094）、前期通期 8.1%（1,212÷15,015）、会社計画 8.1%（1,365÷16,902）。4Q（7〜9月）は例年利益率が
          低い（前年4Q 6.1%＝239÷3,928、前々年4Q 7.0%＝254÷3,635。いずれも fundamentals の採用値）。4Q を 6.5% 程度と見ると
          通期は約 8.8% になるので 0.088 と置いた（全社×総売上に適用）。会社計画が含意する4Q営業利益 207（1,365−1,158）は
          前年4Q（239）を下回り、計画は保守的とみている。感度で最も効く変数"
