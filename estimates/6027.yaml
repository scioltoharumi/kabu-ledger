# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "みんかぶ 証券アナリスト予想（3人: 強気買い1・買い1・中立1）"
  revenue: 20751
  source: "https://minkabu.jp/stock/6027/analyst_consensus（2026-09-05取得。2027年3月期の売上高コンセンサス 20,751百万円。同ページに営業利益のアナリスト予想は掲載なし）"
  note: "営業利益のコンセンサスは掲載が無いため載せない（純利益予想 2,103百万円は営業利益ではないので使わない）"

models:
  - as_of: "2026-09-05"
    period: "FY2027-03"
    status: draft
    note: "初版（Claude 起案・人間未確認）。報告セグメント2つ（プロフェッショナル支援・クラウドサイン）それぞれを1Q売上×年率換算係数で置く。
      会社計画は売上高 20,500・営業利益 3,000 百万円（fundamentals の採用値。前期比 +25.9%・+36.1%）。1Qのセグメント売上は決算短信の
      一次情報（未照合・reports/6027.md では※）。推定は売上・営業利益とも会社計画とほぼ同じ"
    revenue:
      unit: JPY_million
      segments:
        - name: "プロフェッショナル支援（弁護士・税理士ポータル、判例DB、保険）"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 2329
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260812/140120260810517022.pdf（2027年3月期第1四半期決算短信・セグメント情報。取得日 2026-08-31）"
              note: "1Qセグメント売上高。前年同期比 +30.9%。2026年4月27日に連結したミカタ少額短期保険を含む"
            annualize:
              value: 4.15
              basis: assumed
              note: "1Qから通期への換算係数。単純年率換算（×4）に、2Qから損益に入る日本リーガルネットワーク・ATE（みなし取得日 2026年6月30日）と
                期中の有料会員の積み上がりを乗せて 4.15。前期の四半期売上は 3,802→3,962→4,108→4,416 と毎四半期 4〜7% 増えており、
                その形（1Qの 4.3倍）に近い"
        - name: "クラウドサイン（電子契約）"
          expr: "q1_revenue * annualize"
          vars:
            q1_revenue:
              value: 2508
              basis: disclosed
              source: "https://tdnet-pdf.kabutan.jp/20260812/140120260810517022.pdf（2027年3月期第1四半期決算短信・セグメント情報。取得日 2026-08-31）"
              note: "1Qセグメント売上高。前年同期比 +24.0%。契約送信件数 +15.7%"
            annualize:
              value: 4.25
              basis: assumed
              note: "月額課金の積み上げ型で、四半期ごとに 5% 前後伸びる形（1Q比で 1.00・1.05・1.10・1.16 の合計 4.31）を少し割り引いて 4.25。
                割り引いたのは、送信件数の伸び（+15.7%）が売上の伸び（+24.0%）を下回っており単価上昇分の持続を保証できないため"
    profit:
      op_margin:
        value: 0.145
        basis: assumed
        note: "1Q実績 14.4%（698÷4,838）、前期通期 13.5%（2,204÷16,288）、会社計画 14.6%（3,000÷20,500）。1Qのセグメント利益率はプロ支援 22.4%・
          クラウドサイン 37.8% と高く、差は全社費用（1Q 772）とのれん償却。売上増で全社費用が薄まる一方、ミカタ少額短期保険（保険は原価率が高い）
          の連結で全社の率は下がる方向。両方を見て 1Q 並みの 14.5% と置いた"
