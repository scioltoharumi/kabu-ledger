# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "アナリスト予想なし。株予報のアナリスト予想ページ（https://kabuyoho.jp/reportAnalyst?bcode=142A、2026-10-09 取得）で
    目標株価・レーティング・来期予想がいずれも「--」（コンセンサス無し）。みんかぶのアナリスト予想ページ
    （https://minkabu.jp/stock/142A/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。
    東証グロース・時価総額の小さい銘柄でカバーは無いと判断し、比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。2027年3月期は 2026-04-01 に株式会社ジンジブキャリア（旧チエルコミュニケーションブリッジの
      進路情報事業。取得価額 290 百万円）を連結子会社化し、連結初年度。セグメントは『就職支援事業』（従来の単体＝ジョブドラフト）と
      『進学支援事業』（ジンジブキャリア）の2つ。就職支援は会社が決算説明資料 p39 で開示する売上明細3区分
      （採用領域・掲載契約／採用領域・オプション／教育領域＋その他）を前期実績×成長係数で、進学支援は 1Q 実績÷1Q 季節シェアで組む
      （1Q は校内進路ガイダンスの繁忙期で、会社計画でも 1Q が通期の 30.7%）。会社計画は売上 4,187・営業利益 327 百万円
      （就職支援 3,162＝前期単体比 +17.7%・進学支援 1,025）。当推定の急所は就職支援の成長率で、1Q 実績は +6.5%（676 vs 635）と
      計画の +17.7% を下回り、就職支援の計画進捗 21.4% は前期 1Q の売上シェア 23.6% にも届かない（会社は『想定通り』と説明、理由の開示は無い）。
      営業利益率は前期単体 6.2%・1Q 連結 4.9%・会社計画 7.8% に対し 5.5% と置いた（下記 op_margin の note）。
      2Q 決算（2026-11 中旬予定。求人解禁月 7月とジョブドラフトFes 14会場を含む最大の四半期）で就職支援の成長率と
      のれん償却期間（監査法人が精査中・現状 5年で仮計上）が分かるので、そこで置き直す前提。
      出典: 2027年3月期 第1四半期決算短信〔日本基準〕(連結) https://www2.jpx.co.jp/disc/142A0/140120260812518093.pdf
      ／2027年3月期 第1四半期 決算説明資料 https://www2.jpx.co.jp/disc/142A0/140120260812518128.pdf
      ／連結決算開始に伴う連結業績予想に関するお知らせ https://www2.jpx.co.jp/disc/142A0/140120260812518123.pdf
      ／チエルコミュニケーションブリッジ株式会社の事業買収（株式会社ジンジブキャリアの株式取得）に関するお知らせ（2026-02-16）
      https://www.bridge-salon.jp/upload/tekiji_pdf/T~~142A0~000000~0002~0~20260216~1600~20260216562950G.pdf
      ／法人税調整額（益）の計上及び2026年3月期通期業績と実績との差異のお知らせ（2026-05-15）
      https://www2.jpx.co.jp/disc/142A0/140120260515538580.pdf（いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "就職支援・採用領域（ジョブドラフトNavi 掲載契約）"
          expr: "listing_fy26 * listing_growth"
          vars:
            listing_fy26:
              value: 818
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/142A0/140120260812518128.pdf（2026-10-09取得）"
              note: "2026年3月期（単体）の『採用領域（掲載契約）』売上。決算説明資料 p39 の損益計算書明細。推移は 745→811→818
                （24/3期→25/3期→26/3期、+8.9%→+0.9%）。単体売上 2,687（fundamentals の採用値）の内訳で、年度契約（3月末更新）を
                期間按分して計上するため四半期のぶれは小さい（26/3期 150・186・222・261）"
            listing_growth:
              value: 1.02
              basis: assumed
              note: "前期比の係数。会社計画はジョブドラフトNavi 有料掲載社数を 26/3期末 1,026社 → 27/3期 1,200社（+17%。説明資料 p24
                のグラフ値。フリー 1,483→1,950 と合わせ 2,509→3,150 社）と置くが、1Q の掲載契約売上は 140 と前年同期 150 から
                -6.7% で、4月の年度更新で掲載が増えた形跡は 1Q 時点で見えない。掲載契約は年度途中の新規受注が按分で乗ってくる
                （前期も 1Q 150 → 4Q 261 と期中に積み上がる）ため、前期の +0.9% と計画の +17% の間で、1Q の減少を重く見て +2% と置いた。
                人事部パックの未達（26/3期の計画比 95.4% 着地の主因）が 27/3期は 4月にリニューアル済みで、商談数は受注率の低いリードを
                整理して月間 838件→644件（26/3期→27/3期1Q）に減らしている（p14）。信用金庫への紹介ルート開拓・北海道ダイヤ書房との
                代理店契約（2026-08-21 開示 https://kabutan.jp/disclosures/pdf/20260821/140120260821524249/）は上振れ要因だが
                金額の手がかりが無いので係数には乗せていない"
        - name: "就職支援・採用領域（オプション：おしごとフェア・ジョブドラフトFes・企画制作・代行支援）"
          expr: "option_fy26 * option_growth"
          vars:
            option_fy26:
              value: 1559
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/142A0/140120260812518128.pdf（2026-10-09取得）"
              note: "2026年3月期（単体）の『採用領域（オプション）』売上。説明資料 p39。推移は 1,234→1,436→1,559（+16.4%→+8.6%）。
                イベント（5〜7月・10月の開催月）と求人解禁の 7月に偏重し、2Q が最大（26/3期 452・591・216・300）"
            option_growth:
              value: 1.08
              basis: assumed
              note: "前期比の係数。1Q 実績は 491 と前年同期 452 から +8.6%（会社は『動画や訪問代行などのオプション商材が順調、おしごとフェアの
                売上高も好調』と説明。p12）。おしごとフェアは前年同数の 19会場（参画 589社 vs 576社、+2%。p15/p36）。2Q の柱
                ジョブドラフトFes（2026年7月）は 14会場（前年 13）・高校生 3,822人（前年 3,595）と拡大した一方、参加企業は 519社と
                前年 552社から -6%（p36。売上は企業側から得るため、会場数の増加がそのまま売上増にならない）。前期の伸び +8.6% と 1Q の
                +8.6% が揃うのでそのまま +8% と置いた。会社計画の就職支援 +17.7% を達成するには、この区分が 2Q 以降に +20% 前後へ
                加速する必要がある（感度で就職支援側の最上位。2Q 決算で検証可能）"
        - name: "就職支援・教育領域＋その他（ジョブドラフトCareer・ROOKIE'S CLUB・DMU・ジョブドラフトNext）"
          expr: "education_fy26 * education_growth"
          vars:
            education_fy26:
              value: 308
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/142A0/140120260812518128.pdf（2026-10-09取得）"
              note: "2026年3月期（単体）の『教育領域』295 ＋『その他』13。説明資料 p39。教育領域の推移は 86→132→295（+53%→+123%）で、
                26/3期は 4Q に 155 が集中（研修サービスの年度末計上と推測。四半期配分の説明は資料に無い）"
            education_growth:
              value: 1.25
              basis: assumed
              note: "前期比の係数。1Q 実績は教育 35＋その他 8＝43 と前年同期 29＋2＝31 から +39%。ただし前期の伸び（+123%）は 4Q の
                155 に依存しており、同規模の 4Q 計上が再現するかは一次情報で確認できない。1Q の +39% をそのまま通期に延ばさず、
                中計の『ストック収益化』で研修（ROOKIE'S CLUB）・キャリア教育（Career 導入校 804校→29/3期 2,000校計画。p26）が
                伸びる前提で +25% と置いた。売上規模が小さく感度は低い"
        - name: "進学支援事業（ジンジブキャリア：校内進路ガイダンス・地区別進路相談会・進路情報サイト）"
          expr: "career_q1_revenue / career_q1_share"
          vars:
            career_q1_revenue:
              value: 314.8
              basis: disclosed
              source: "https://www2.jpx.co.jp/disc/142A0/140120260812518093.pdf（2026-10-09取得）"
              note: "2027年3月期 1Q（2026-04〜06）の進学支援事業セグメント売上 314,793千円（短信 p3・p9。セグメント間取引は無し、
                外部顧客への売上高に等しい）。セグメント利益は 66,982千円（のれん償却前）"
            career_q1_share:
              value: 0.29
              basis: assumed
              note: "通期売上に対する 1Q のシェア。会社計画は進学支援 1,025 で 1Q 進捗率 30.7%（説明資料 p10）＝会社の季節性想定は
                1Q シェア 0.307。会社は 1Q を『繁忙期』『計画比を上回って着地。東京・仙台・名古屋地域の校内ガイダンス実施校数が拡大』
                （p10/p12）と説明しており、計画を上回った分だけシェアを下げて 0.29 と置いた（→通期 約1,085）。
                買収前の事業実績（チエルコミュニケーションブリッジの進路情報事業・2025年3月期）は売上 1,089・営業利益 66
                （2026-02-16 開示 p2）で、この置き方は買収前と同水準の売上を意味する。四半期配分の過去データは開示が無く
                （新設会社のため）、季節性の形は会社計画の 1Q 比率に依拠している点が弱い（感度で全変数の最上位）"
    profit:
      op_margin:
        value: 0.055
        basis: assumed
        note: "連結営業利益率。前期単体 6.2%（166÷2,687、fundamentals の採用値）・1Q 連結 4.9%（48÷991）・会社計画 7.8%（327÷4,187）。
          組み立て: (1) 就職支援は売上 +8% 前後・売上総利益率 86%（26/3期 86.3%、p39）に対し、販管費が 27/3期を『投資と創造の1年』として
          学校シェア・マーケ・全社システムに約 4.3 億円の投資を掲げる（p28。資産計上分と費用分の内訳は無い）ため、販管費 +8% なら
          セグメント利益 約170（5.8%）、会社計画の売上を前提にした販管費（約 +13%）がそのまま出て売上が当推定にとどまれば 約70 まで
          落ちる（営業レバレッジの逆回転が最大の下振れ要因）。(2) 進学支援は買収前実績の利益率 6.1%（66÷1,089）に対し 1Q だけで 67 を
          計上しており、残り 3 四半期はほぼ損益ゼロと見て通期 約75（6.9%）。(3) のれん償却は四半期 10.55（短信 p9。のれん 202.6 を
          5年で仮計上）で通期 約42 の控除。合計 約200÷約3,990 ≒ 5.0% を基準に、1Q で販管費率が 90.9%→82.3% に改善した
          （p13）生産性向上の継続を加味して 5.5% とした。会社計画 7.8% との差は主に (1) の売上未達分の販管費で、就職支援が計画どおり
          +17.7% で伸びるなら 7.8% は届く水準。27/3期は『2027年3月期終了後からの配当開始を検討中』（p19）で、利益を出す動機は強い"
