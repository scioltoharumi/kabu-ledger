# 次期売上・利益のフェルミ推定（追記型・過去版は消さない）
# 手順の正: .claude/skills/kabu-ledger-estimate/SKILL.md
# 計算・感応度・実績比較は src/estimate.py が行う。ここに書くのは分解と値の選定だけ。

# 市場予想（コンセンサス）。数値を載せるなら source 必須。
# 無いなら note に「無い理由」を書く（カバー0社であること自体が情報）。
market_forecast:
  name: "—"
  note: "カバー無し。株予報（https://kabuyoho.jp/sp/report?bcode=7980、2026-10-09 取得）の業績予想欄はコンセンサス予想が
    全項目『--』（売上高・営業利益・経常利益・純利益いずれも空欄、アナリスト数の記載も無し）。みんかぶのアナリスト予想ページ
    （https://minkabu.jp/stock/7980/analyst_consensus、2026-10-09）は取得が 403 で拒否され未確認。東証スタンダードの小型株
    （発行済 720万株。1Q短信）で証券会社のカバーは確認できず、比較対象は会社計画のみ"

models:
  - as_of: "2026-10-09"
    period: "FY2027-03"
    status: confirmed   # 2026-09-05 マスター方針: 承認工程は置かない（調べた結果をそのまま載せる）
    note: "初版（Claude 起案・人間未確認）。労働安全衛生保護具の製造販売の単一セグメント（短信注記）だが、会社は売上を
      『製品』（自社製造: 防毒マスク・防じんマスク・送気マスク・その他の呼吸用保護具・その他）と『商品』（仕入販売: 自給式呼吸器・
      酸素計ガス検知器・保護衣手袋等）に分けて開示し、四半期短信でも製品売上高を本文で示すので、その2区分×（前期実績×伸び率）で組む。
      会社計画は売上 15,800・営業利益 1,100 百万円（前期比 +1.3%・+4.3%）。1Q（2026-04〜06）は売上 3,297（+12.1%）・営業利益 150
      （前年同期 7）で、上期計画の営業利益 140 を1Qだけで超過しており、会社は『業績予想の修正は精査中・現時点で修正無し』
      （1Q短信 p2・特別利益のお知らせ）。伸び率は1Qの +12% をそのまま通期には延ばさず、前期4Q（2026-01〜03）が 5,150（前年同期比 +16.5%）
      と高い土台である点・会社がナフサ不足と米国通商政策を明示的に懸念している点を織り込んで製品 +6%・商品 +5% に置いた。
      結果は売上 約16,480（計画比 +4%）・営業利益 約1,240（同 +12%）で、1Qペース×季節性（1Qは通期の 19〜21%）から逆算した
      約16,400 とも桁が合う。+10%感度で効くのは製品売上の土台（規模が大きい）、次いで商品売上の土台で、伸び率2変数は水準が小さいため
      +10% しても営業利益を 1% も動かさない＝感度表では小さく見えるが、伸び率を 6%→0% に落とせば売上 −630 で計画水準に戻るので、
      本当の急所は『前期の増収が今期も続くか』。営業利益率 7.5% は売上総利益率 30%（前期 29.6%・1Q 30.9%）と販管費 約3,715
      （前期 3,555 の +4.5%）から逆算した値で、1Q の 4.5% が低いのは季節性（1Qは毎年利益が薄い）。2Q決算（2026-11-05 予定）で
      会社計画が修正されるかが最初の答え合わせ。
      出典: 2027年3月期 第1四半期決算短信 https://www.sts-japan.com/upload/news_ja/2DN3GJF-news_ja_file.pdf
      ／2026年3月期 決算短信 https://www.sts-japan.com/upload/news_ja/2DFFT8Q-news_ja_file.pdf
      ／決算説明資料（2025年度・2026-06-09）https://www.sts-japan.com/upload/irinfo/2DHQACB-irinfo_file.pdf
      ／特別利益の計上に関するお知らせ（2026-08-05）https://www.sts-japan.com/upload/news_ja/2DMXR37-news_ja_file.pdf
      （いずれも 2026-10-09 取得）"
    revenue:
      unit: JPY_million
      segments:
        - name: "製品（自社製造: 防毒・防じん・送気マスク、その他の呼吸用保護具 等）"
          expr: "fy2026_product_sales * (1 + product_growth)"
          vars:
            fy2026_product_sales:
              value: 10450
              basis: disclosed
              source: "https://www.sts-japan.com/upload/news_ja/2DFFT8Q-news_ja_file.pdf（2026年3月期決算短信 p13『販売の実績』、2026-10-09取得）"
              note: "2026年3月期の製品売上高 10,450,109千円（前期比 +10.2%）。内訳は防毒マスク 3,650・防じんマスク 3,997・送気マスク 604・
                その他の呼吸用保護具 1,755・その他 444（めがね・シールド含む）。うち輸出 2,206（製品の 21%）。製品＋商品の合計 15,593 は
                fundamentals の採用値（FY2026-03 revenue）と一致する"
            product_growth:
              value: 0.06
              basis: assumed
              note: "前期比の伸び率。1Q（2026-04〜06）の製品売上高は 2,453 で前年同期比 +270（+12.4%。1Q短信 p2 本文）。会社は
                『主要顧客である製造業からの製品受注が好調』と2期連続で説明し、2026年1月竣工の第二船引事業所第三工場（吸収缶ライン移設）
                で供給能力も上がった。一方、前期4Q（2026-01〜03）の全社売上 5,150 は前年同期比 +16.5% の高い土台で、会社は今期計画の
                前提として『ナフサ不足の影響は不確実性が高い』『米国の通商政策』を明示している（決算説明資料 p11。輸出は売上の 14%）。
                1Qの +12% を通期に延ばさず、約半分の +6% に置いた。会社計画の全社 +1.3% は、1Q実績から逆算すると2Q以降が前年比マイナス
                になる前提で保守的（前期も期初計画 14,400 に対し実績 15,593）。感度で最も効くのは土台の 10,450 だが、それは開示値なので、
                実際に疑うべきはこの伸び率（0% なら売上は計画水準まで落ちる）"
        - name: "商品（仕入販売: 自給式呼吸器、酸素計・ガス検知器、保護衣・保護手袋 等）"
          expr: "fy2026_merchandise_sales * (1 + merchandise_growth)"
          vars:
            fy2026_merchandise_sales:
              value: 5143
              basis: disclosed
              source: "https://www.sts-japan.com/upload/news_ja/2DFFT8Q-news_ja_file.pdf（2026年3月期決算短信 p13『販売の実績』、2026-10-09取得）"
              note: "2026年3月期の商品売上高 5,143,376千円（前期比 +11.1%）。内訳は自給式呼吸器 3,657（商品の 71%。前期比 +508）・
                送気マスク 80・酸素計・ガス検知器 189（−52）・その他 1,218（保護衣・保護手袋 849 を含む）。輸出はほぼ無し（10）"
            merchandise_growth:
              value: 0.05
              basis: assumed
              note: "前期比の伸び率。1Qの商品売上高は 3,297−2,453＝844 で前年同期比 +87（+11.5%。1Q短信の全社売上から製品売上を引いた値）。
                会社は『2024年4月に義務化された化学物質対策のリスクアセスメント対象物質に対する保護具の商品受注が好調』『対象物質は
                今後も追加が控えている』と説明（決算説明資料 p11）。ただし商品の7割は自給式呼吸器（消防・官公庁向けが中心と推定。
                会社は顧客別の内訳を開示していない＝一次情報で確認できていない）で、官公庁の年度末納入に左右されやすく、前期の +16% が
                続くかは不明。製品より一段低い +5% に置いた"
    profit:
      op_margin:
        value: 0.075
        basis: assumed
        note: "全社の営業利益率。過去実績は FY2024-03 6.0%・FY2025-03 7.6%・FY2026-03 6.8%（fundamentals）、会社計画 7.0%
          （1,100÷15,800）。1Q実績 4.5% は季節性（1Qは FY2026 0.2%・FY2025 6.1% と毎年薄く、利益は4Qに集中。FY2026 の4Qは 12.3%）
          で通期の目安にならない。置き方は売上総利益率×売上−販管費の逆算: 売上総利益率は前期 29.6%・1Q 30.9%（増収 +357 に対し
          売上総利益 +180＝限界利益率 50% で、製造労務費・減価償却費が固定費として効いている）から 30% と置き、販管費は前期 3,555 に
          1Qの前年同期比 +4.5%（867 vs 830）を当てて 約3,715。16,480×0.30−3,715≒1,230 → 7.5%。売上総利益率が前期並み 29.6% なら
          7.1%、1Q並み 30.9% なら 8.4% の幅。下振れ要因は材料費（ナフサ不足・前期 +310）と新工場の減価償却（1Q の減価償却費 200 は
          前年同期 206 と横ばいで、まだ増えて見えない）。2026-08-05 受領の補助金 741 は特別利益（補助金収入）であり営業利益には入らない"
