# セグメント: AI データセンターを「建てる側」
#
# ここは **思考の道具** であって記録ではない（data/ ではない）。
# 二重照合は課さない代わりに、**単一出典であることを隠さない**。
#   computed_by  誰が計算した数字か（自社開示・官庁・調査会社・当台帳）
#   definition   何を分母・対象にした数字か ← 他人の計算済み数字はここが一番危ない
#   source       URL（取得日）
#
# 手順（.claude/skills 化はまだしていない。1本目なので手で書く）:
#   1. 需要が誰かの受注残・設備投資計画に**数字として**出ているか（門番）
#   2. お金の通り道を層に切る（地図）
#   3. 各層に何社いるか実名で数える（ふるい。悪い層を捨てるだけ）
#   4. 残った層の会社の優位性を深掘る（本番）
#   5. 同じ層の競合との利益率差が続いているか（答え合わせ）

segment:
  name: "AI データセンターを建てる側（施工）"
  as_of: "2026-08-28"
  definition: |
    国内で AI 向けデータセンターを新増設するときに、**現場で行われる施工**と
    その施工能力。境界は「工事」であって「機器」ではない。

    含む   : 受変電・幹線などの電気設備工事、空調・冷却設備工事、建屋・土木
    含まない: 受変電機器・UPS・チラーなどの**機器メーカー**（別セグメント A）
              電線・ケーブルなどの**部材メーカー**（同上）
              サーバ・GPU・半導体（上流。別セグメント）
              DC の運営そのもの（下流）
  rationale: |
    需要（AI）は誰でも知っているので、需要を当てにいく賭けはしない。
    「そのお金がどの層を通り、どこで供給が絞られているか」を数える賭けにする。

# =============================================================================
# 1. 需要ゲート — 誰かの受注残・設備投資計画に、もう数字として出ているか
# =============================================================================
#
# 判定: **passed**。言説ではなく、官庁の需要見通しと施工側の手持工事高の
# 両方に数字が出ている。過去形・現在形で語れる。
demand_gate:
  status: passed
  evidence:
    - name: "DC 新増設による最大需要電力"
      value_from: 47
      value_to: 616
      unit: 万kW
      period: "2025年度 → 2034年度"
      computed_by: "OCCTO / 資源エネルギー庁（需要見通し）"
      definition: "データセンターの新増設に伴う最大需要電力。半導体工場ぶんは含まない"
      source: "https://www.meti.go.jp/shingikai/enecho/denryoku_gas/denryoku_gas/pdf/085_06_00.pdf（2026-08-28 取得）"
      note: "約13倍。**これは計画であって実績ではない**。門番としては『発注側が金額と量を公表している』ことを見ている"

    - name: "きんでん 手持工事高（受注残）"
      value: 5817
      unit: 億円
      period: "FY2026-03"
      yoy_pct: 23.2
      computed_by: "自社開示（決算）"
      definition: "連結の手持工事高。DC 向けだけの内訳ではない"
      source: "https://strainer.jp/notes/8880（2026-08-28 取得・二次情報）"
      note: "記録的水準。**受注残に出ている**ことが門番の通過条件そのもの"

    - name: "高砂熱学工業 受注残"
      value: TO_VERIFY
      unit: 億円
      period: "FY2026-03"
      computed_by: "自社開示（決算）"
      definition: "連結の受注残高。DC 向けだけの内訳ではない"
      source: "https://www.nikkei.com/nkd/disclosure/tdnr/20260511522999/（2026-08-28 取得）"
      note: "**4期連続で過去最高**（二次情報）。実額は短信を読むまで埋めない"

# =============================================================================
# 2〜3. お金の通り道を層に切り、各層に何社いるか数える
# =============================================================================
#
# 判定の式（第3ターンの分解）:
#   その層の利益プール ≒ 需要の伸び × 供給の集中度 × 切替の効かなさ
#
# 需要の伸びは層をまたいで共通なので、**差がつくのは残り2つ**。
value_capture:
  layers:
    - name: "D1 建屋・土木（ゼネコン）"
      suppliers: "大手5社＋中堅多数。DC 専門性は差になるが、応札できる会社が多い"
      supplier_count: many
      switching: "低い。案件単位で切り替わる"
      verdict: passes_through
      why: "需要は通るが供給が分散しているので、価格競争で利益が残りにくい"

    - name: "D2 電気設備工事（電力会社系サブコン）"
      # 実名で数える ← ここが本番。数えられるから調査であって予測ではない
      suppliers:
        - "きんでん（1944・関西電力系）"
        - "関電工（1942・東京電力系）"
        - "クラフティア（旧 九電工・九州電力系）"
        - "トーエネック（1946・中部電力系）"
        - "ユアテック（1934・東北電力系）"
        - "中電工（1941・中国電力系）"
        - "住友電設（1949）"
      supplier_count: 7
      concentration: "**電力会社の営業地域ごとに寡占**。全国区の competitor が少ない"
      switching: |
        高い。特別高圧の受電工事は有資格者と実績が要り、発注側が
        施工会社を価格だけで替えられない。工期遅延の損害が大きいほど替えにくい
      constraint: |
        **供給の制約が人**。電気工事士は50歳以上が半数超・30歳未満が10%前後
        （2020年度国勢調査）。46.6% の事業者が人手不足で受注機会を逸失と回答。
        サブコン協会会長（関電工トップ）が「仕事を受けきれない」と公言している
      verdict: takes
      evidence_of_pricing_power:
        - name: "選別受注"
          computed_by: "業界報道（二次情報）"
          definition: "適正工期が確保でき価格転嫁ができる案件を選んで受注する行動"
          source: "https://strainer.jp/notes/8880（2026-08-28 取得）"
          note: "**受注を選べる＝供給が需要に足りていない**ことの直接の現れ"
        - name: "きんでん 営業利益 前期比"
          value: 48.0
          unit: pct
          period: "FY2026-03"
          computed_by: "自社開示（決算）"
          definition: "連結営業利益の前期比。売上は +6.5%"
          source: "https://built.itmedia.co.jp/bt/articles/2604/30/news118.html（2026-08-28 取得・二次情報）"
          note: "売上 +6.5% に対して営業利益 +48.0%。**利益率が構造的に上がっている**"

    - name: "D3 空調・冷却設備工事（空調サブコン）"
      suppliers:
        - "高砂熱学工業（1969）"
        - "ダイダン（1980）"
        - "三機工業（1961）"
        - "大気社（1979）"
        - "新日本空調（1952）"
      supplier_count: 5
      concentration: "上場5社に集中。**D2 より少ない**"
      switching: |
        高い。AI サーバの排熱処理は設計込みの仕事で、液冷への移行で
        さらに技術差が出る余地がある（＝新規参入が効きにくくなる方向）
      verdict: takes
      evidence_of_pricing_power:
        - name: "上場5社の営業増益率"
          value_from: 27.9
          value_to: 49.7
          unit: pct
          period: "FY2026-03"
          computed_by: "業界集計（二次情報）"
          definition: "空調設備工事の上場5社の連結営業利益 前期比。**全社が過去最高益**"
          source: "https://www.arc-navi.shikaku.co.jp/column/details.php?column_id=6101（2026-08-28 取得）"
          note: "1社ではなく**層の全社**で起きている＝個社の巧拙ではなく層の構造"

    - name: "D4 電線・ケーブル / 受変電機器 / UPS"
      suppliers: "フジクラ・古河電工・住友電工／日立・富士電機・明電舎・ダイヘン ほか"
      supplier_count: few
      switching: "高い（規格・納期）"
      verdict: out_of_scope
      why: "これは施工ではなく**機器・部材**。セグメント A（DC の電力・冷却インフラ）で扱う"

# =============================================================================
# 4. 優位性（3分類。機構・証拠・反証条件をセットで）
# =============================================================================
#
# **まだ書けていない。** 層まで絞ったが、個社の優位性は未着手。
# ここを埋めるのが次の作業で、埋まるまで candidates は「候補」でしかない。
moat_analysis:
  status: not_started
  planned:
    - layer: "D2 電気設備工事"
      hypothesis_mechanism: regulatory      # 有資格者と電力会社系列という参入障壁
      what_would_prove_it: "有資格者数の推移・地域別シェア・値上げの通過（粗利率の対競合差）"
    - layer: "D3 空調・冷却工事"
      hypothesis_mechanism: switching_cost  # 設計込みの受注・排熱設計の実績
      what_would_prove_it: "リピート率・液冷案件の受注実績・粗利率の対競合差"

# =============================================================================
# 5. 答え合わせ（超過利益が持続しているか）
# =============================================================================
excess_profit:
  status: unmeasured
  blocker: |
    master.yaml の peers が全銘柄 TO_VERIFY で、**同じ層の競合との利益率差を
    測る土台が無い**。src/judge.py の UNEVALUATED_RULES に既に
    「同業他社の決算に引っ張られていないか（I-16）」として宣言されている。
    このセグメント定義は、その peers をそのまま与える（D2 の7社／D3 の5社）。
  note: |
    粗利率は導出できない（売上原価の実額を取得していないため）。
    営業利益率は PR #7 で照合済みの実額から導けるようになった。

# =============================================================================
# 反証条件 — これが観測されたらセグメントごと取り下げる
# =============================================================================
#
# 供給集中の賭けは崩れ方が1種類しかない（新規参入）。だから書ける。
# 需要の賭けと違って「まだ来ていないだけ」と言い続けられない。
falsification:
  - id: F1
    text: "D2 または D3 の層に、上のリストに無い会社が2社以上、DC 向け施工の本格参入を発表する"
    observable: "適時開示・中期経営計画・採用計画"
  - id: F2
    text: "選別受注が終わる（受注残が2期連続で減少し、営業利益率が低下に転じる）"
    observable: "各社の四半期決算の手持工事高と営業利益率"
  - id: F3
    text: "OCCTO の DC 需要見通しが下方修正され、2034年度の想定が現在の半分を下回る"
    observable: "資源エネルギー庁・OCCTO の需要見通し資料"
  - id: F4
    text: "国内 DC 投資が海外へ流出する（国内の新設計画の取り消しが相次ぐ）"
    observable: "ハイパースケーラーの投資計画の変更発表"

# =============================================================================
# 候補銘柄 — **master.yaml には入れない**（まだ監視対象ではない）
# =============================================================================
#
# 降ろすと決めたときだけ intake して既存パイプラインに乗せる。
# ここに並んでいることは「買い」を意味しない。
candidates:
  - code: "1944"
    name: "きんでん"
    layer: "D2 電気設備工事"
    hypothesis: "関西電力系の地域寡占。手持工事高5,817億（+23.2%）・営業利益 +48.0% と、選別受注が利益率に出ている"
    status: unscreened
  - code: "1942"
    name: "関電工"
    layer: "D2 電気設備工事"
    hypothesis: "東京電力系。首都圏 DC の集積地に地盤。サブコン協会会長を出しており業界の需給を代表して語っている"
    status: unscreened
  - code: "1969"
    name: "高砂熱学工業"
    layer: "D3 空調・冷却工事"
    hypothesis: "受注残が4期連続で過去最高。AI サーバ排熱の処理で評価されており、液冷移行で技術差が広がる余地"
    status: unscreened
  - code: TO_VERIFY
    name: "クラフティア（旧 九電工）"
    layer: "D2 電気設備工事"
    hypothesis: "九州電力系。九州は半導体・DC の新設が集中している地域"
    status: unscreened
    note: "社名変更に伴う証券コードを未確認。埋めるまで TO_VERIFY"

# =============================================================================
# 未解決 — 次に潰す順
# =============================================================================
open_questions:
  - id: Q1
    text: |
      **どこまで値段に入っているか。** 当初「D はほぼ入っていない」と見たが、
      調べると 2025年から株式市場でサブコンが物色されており、この見立ては誤り。
      再評価は既に始まっている。残る問いは「利益率の上昇が何年続くと市場が
      見ているか」で、そこが第1ターンの分解でいうマルチプル側の論点になる
    priority: 1
  - id: Q2
    text: |
      **循環か構造か。** 営業利益 +28〜50% は建設サイクルの山かもしれない。
      第6ターンの規律に従い「この上昇を前にも経験しているか」を各社の
      長期の営業利益率で見る（PR #7 の導出で通期4〜6期ぶんは引ける）
    priority: 1
  - id: Q3
    text: "D2 と D3 のどちらが取り分が大きいか。供給者数は D3 の方が少ないが、工事金額は D2 の方が大きい可能性"
    priority: 2
  - id: Q4
    text: "流動性ゲート。候補はいずれも中〜大型で、既存5銘柄と性格が違う。judge の閾値が想定している規模かを確認する"
    priority: 2
