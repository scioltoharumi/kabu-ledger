# セグメント A: DC の電力・冷却インフラ（機器メーカー）
#
# 2本目。1本目（ai-datacenter-build.yaml = 施工）の D4 で out_of_scope に
# した「機器・部材」側を独立したセグメントとして降ろす。
#
# ここは **思考の道具** であって記録ではない（data/ ではない）。
# 二重照合は課さない代わりに、**単一出典であることを隠さない**。
#   computed_by  誰が計算した数字か（自社開示・官庁・調査会社・当台帳）
#   definition   何を分母・対象にした数字か ← 他人の計算済み数字はここが一番危ない
#   source       URL（取得日）
#
# ── 1本目からの引き継ぎと、このセグメント固有の教訓 ──────────────────
#
# 施工（1本目）と機器（このセグメント）は同じお金の通り道の隣どうしだが、
# **供給制約の質が違う**:
#
#   施工の制約 = 人（有資格者）。年単位でしか増えず、増やす主体も分散
#                → 崩れにくい制約
#   機器の制約 = 生産能力（工場・熟練工・部材）。**設備投資で2〜3年で増やせる**
#                → 崩れうる制約。実際にダイヘンが生産能力2倍の投資を発表済み
#                  （下の falsification F1）
#
# だからこのセグメントの門番の問いは「不足しているか」ではなく
# **「増産しても追いつかない証拠があるか」**。納期の言説はそのままでは
# 証拠にならない（汎用品の納期はすでに正常化が報じられている。下の caution）。
#
# もうひとつの固有の壁: **上場ピュアプレイが薄い**。国内シェアが高い事業ほど
# 大企業の一部門（三菱重工サーマル・日立の産機部門・TMEIC）で、単独では買えない。
# 層の判定が takes でも、乗り物が無ければ candidates は出せない。

segment:
  name: "DC の電力・冷却インフラ（機器メーカー）"
  as_of: "2026-08-30"
  definition: |
    国内で AI 向けデータセンターを新増設するときに据え付けられる**機器**と、
    その供給能力。境界は「機器」であって「工事」ではない（工事は1本目）。

    含む   : 受変電機器（大形・特高変圧器、開閉装置、キュービクル）、
             UPS・電源装置、非常用発電機、熱源・冷却機器（ターボ冷凍機・チラー）、
             液冷（CDU・コールドプレート）
    含まない: 施工（1本目のセグメント）
              電線・光ファイバー・光部品（伝送。別セグメント候補）
              サーバ・GPU・半導体（上流。別セグメント）
              DC の運営そのもの（下流）
  rationale: |
    需要は1本目と同一（AI DC の新増設）なので、需要ゲートの一次数字を共有できる。
    賭けの中身は違う: 施工は「人が増えない」ことへの賭け、機器は「増産投資が
    需要に追いつかない」ことへの賭け。後者の方が崩れやすいぶん、
    層の選別と反証条件を厳しくする。

# =============================================================================
# 1. 需要ゲート — 誰かの受注残・設備投資計画に、もう数字として出ているか
# =============================================================================
#
# 判定: **passed**（1本目と同じ官庁見通しを共有。加えて機器固有の証拠として、
# 供給側自身が「需要が続く」方に金を張っている＝増産投資と、規制起因の
# 需要集中がある）。
demand_gate:
  status: passed
  evidence:
    - name: "DC 新増設による最大需要電力（1本目と共有）"
      value_from: 47
      value_to: 616
      unit: 万kW
      period: "2025年度 → 2034年度"
      computed_by: "OCCTO / 資源エネルギー庁（需要見通し）"
      definition: "データセンターの新増設に伴う最大需要電力。半導体工場ぶんは含まない"
      source: "https://www.meti.go.jp/shingikai/enecho/denryoku_gas/denryoku_gas/pdf/085_06_00.pdf（2026-08-28 取得）"
      note: "受電容量が増える＝受変電機器・非常用電源・冷却の全層に比例して効く"

    - name: "ダイヘン 大形変圧器の生産能力増強"
      value: 100
      unit: 億円規模
      period: "2025-12-16 発表"
      computed_by: "自社開示（プレスリリース）"
      definition: "三重事業所の新工場等への総投資額。生産能力は 2026年度1.2倍 → 2027年度1.5倍 → 2029年度2.0倍"
      source: "https://prtimes.jp/main/html/rd/p/000000006.000174053.html（2026-08-30 取得）"
      note: |
        理由に「データセンター・半導体工場の建設増加」を明記。
        **供給側が需要の持続に金を張っている**ことが門番の通過条件。
        同時に、この増産こそが本セグメントの反証条件 F1 のカウントダウンでもある
        （二面性を忘れない）

    - name: "明電舎 2026年3月期中間期 売上・営業利益"
      value_from: 1311
      value_to: 27
      unit: "億円（売上・営業利益の順）"
      period: "FY2026-03 H1（2025年4〜9月）"
      computed_by: "報道（二次情報。元は自社開示）"
      definition: "連結。売上 +9.2%・営業利益 +46.3% でいずれも過去最高。電力インフラ部門は売上 +23.3%"
      source: "https://dempa-digital.com/article/699727（2026-08-30 取得・二次情報）"
      note: "売上の伸びに対して利益の伸びが大きい＝1本目の D2 と同じ「値決め力」の型。実額は決算短信で要確認"

  caution: |
    **「不足の言説」をそのまま需要の証拠にしない。** 汎用キュービクル（200kVA以下・
    標準仕様）の納期は 2026年3月時点で約3〜4か月まで**正常化した**という報道がある
    （https://denzai-zeus.com/ogawa-news/saisinkyu-bikurunouki 2026-08-30 取得・二次情報）。
    逼迫が残るのは大形・特高・特殊仕様に偏在する。層を分けずに「電力機器は不足」と
    括ると、正常化した層を高値で掴む。

    また 2026年4月のトップランナー基準改定（新基準品は旧製品比で大幅値上げ）と
    PCB 含有機器の処分期限（2027年3月）は**一過性の需要の山**を作る。
    構造的な DC 需要と、この規制起因の山を混ぜて数えない
    （https://solarjournal.jp/product/62712/ 2026-08-30 取得・二次情報）。

# =============================================================================
# 2〜3. お金の通り道を層に切り、各層に何社いるか数える
# =============================================================================
#
# 判定の式は1本目と同じ:
#   その層の利益プール ≒ 需要の伸び × 供給の集中度 × 切替の効かなさ
#
# このセグメントで追加した観点:
#   ×「上場ピュアプレイがあるか」（無い層は判定が takes でも降ろせない）
#   × 増産リードタイム（何年で供給が増えるか。短い層ほど賭けが崩れやすい）
value_capture:
  layers:
    - name: "E1 大形・特高変圧器／開閉装置（受変電の本丸）"
      suppliers:
        - "東光高岳（6617・東電系）"
        - "ダイヘン（6622）"
        - "明電舎（6508・住友系）"
        - "富士電機（6504）"
        - "日新電機（6641・住友電工系）"
        - "（日立製作所の一部門・非上場扱い）"
      supplier_count: 6
      concentration: "少数。電力会社の系列と納入実績で顔ぶれが固定"
      switching: |
        高い。特高機器は電力会社・大口需要家の規格適合と納入実績が要り、
        据付後は保守も納入メーカーに紐づく（ストック収益）。
        価格だけでは替えにくい
      constraint: |
        生産能力（巻線・鉄心の熟練工、けい素鋼板・ブッシング等の部材）。
        **ただし人と違い投資で増やせる**（ダイヘンが2029年度までに2倍）。
        米国でも大型変圧器は複数年待ちと報じられており、逼迫は国内固有ではなく
        グローバル（https://www.jetro.go.jp/biz/areareports/2026/0009cbcc525cfde9.html
        2026-08-30 取得）。輸出が効くなら国内増産が国内価格を崩すとは限らない
      verdict: takes
      note: |
        **仮判定。** 確定には「増産後も追いつかない」証拠（受注残の伸びが
        生産能力の伸びを上回り続けること）が要る。open_questions Q1

    - name: "E2 汎用キュービクル・配電盤"
      suppliers: "日東工業（6651）ほか多数。盤メーカーは全国に分散"
      supplier_count: many
      switching: "低い。標準仕様は相見積もりで決まる"
      verdict: passes_through
      why: |
        納期は 2026年3月時点で正常化が報じられている（demand_gate の caution）。
        供給が増やしやすく分散している層。トップランナー改定の値上げは
        全社一律のコスト転嫁であって、特定社の値決め力ではない

    - name: "E3 UPS・電源装置"
      suppliers: "三菱電機（6503・一部門）、富士電機（6504）、TMEIC（非上場）／海外: Schneider・Eaton・Vertiv"
      supplier_count: few_but_global
      switching: "中。大型案件は電気設計に組み込まれるが、外資の標準品も強い"
      verdict: open
      why: |
        国内メーカーのシェアは三菱電機がトップ（自社発表・
        https://www.mitsubishielectric.co.jp/service/melups/feature/melups/point01.html
        2026-08-30 取得）だが、ハイパースケーラー向けは外資の調達標準が入りやすく、
        **国内集中がそのまま値決め力になるか未確認**。上場ピュアプレイも無い

    - name: "E4 非常用発電機"
      suppliers: "三菱重工（7011・一部門）、ヤンマー（非上場・DC向け増産を発表）、デンヨー（6517）／海外: Cummins・Caterpillar・Rolls-Royce(mtu)"
      supplier_count: few_but_global
      switching: "中〜高。消防法・建築基準の認定と保守網"
      verdict: open
      why: |
        DC は非常用発電が必置でエンジンは世界的に長納期という報道はあるが、
        国内上場のピュアプレイ（デンヨー）の DC 向け比率が未確認。
        ヤンマーの増産（https://www.nikkei.com/article/DGXZQOUF0818T0Y5A001C2000000/
        2026-08-30 取得・二次情報）は E1 同様、供給が増える方向の証拠でもある

    - name: "E5 熱源機器（ターボ冷凍機・チラー）"
      suppliers: "三菱重工サーマルシステムズ（7011の非上場子会社・国内シェア約70%と報道）、荏原製作所（6361）系、ダイキン工業（6367）"
      supplier_count: 3
      concentration: "高い。ただし最大手が上場親会社の一部門"
      switching: "高い（設計込み・保守ストック）"
      verdict: open
      why: |
        集中は本物らしい（シェア約70%は https://news.mynavi.jp/techplus/article/20241203-3076405/
        2026-08-30 取得・二次情報）。だが**乗り物が無い**: 三菱重工・ダイキン・荏原の
        いずれも DC 冷却は全社利益の一部で、層の利益がそのまま株には出ない。
        「複合企業の中の良い事業」をどう扱うかは方法論側の未解決（open_questions Q3）

    - name: "E6 液冷（CDU・コールドプレート・マニホールド）"
      suppliers: "ニデック（6594）、ダイキン（6367・米ChilDyne買収 2025-11）／海外: Vertiv・CoolIT・Boyd ほか多数が参入表明"
      supplier_count: crowding_in
      switching: "未確定（規格・方式が固まっていない）"
      verdict: out_of_scope
      why: |
        市場は急成長の予測（CDU 世界市場 2026年 15.59億ドル → 2032年 43.18億ドル、
        computed_by: 調査会社 QYResearch、definition: CDU 単体の世界売上、
        https://newscast.jp/news/3112768 2026-08-30 取得・二次情報）だが、
        **全員が参入中＝供給の集中がまだ成立していない**。当台帳の物差し
        （今の事実としての供給集中に賭ける。需要予測には賭けない）では
        まだ判定できない。競争構造が固まってから（撤退が出始めてから）見る

# =============================================================================
# 4. 優位性（未着手）
# =============================================================================
moat_analysis:
  status: not_started
  planned:
    - layer: "E1 大形・特高変圧器"
      hypothesis_mechanism: switching_cost   # 系列・規格適合・保守ストック
      what_would_prove_it: |
        受注残の伸び > 生産能力の伸び が続くこと・値上げの通過（採用値の
        営業利益率が売上より速く伸びること）・保守等ストック収益の比率

# =============================================================================
# 5. 答え合わせ（未測定）
# =============================================================================
excess_profit:
  status: unmeasured
  note: |
    E1 の候補を master.yaml に降ろした後、1本目と同じ経路
    （fetch_fundamentals の照合済み実額 → 営業利益率の対競合差）で測る。
    peers は E1 の6社がそのまま与える

# =============================================================================
# 反証条件 — これが観測されたらセグメントごと取り下げる
# =============================================================================
falsification:
  - id: F1
    text: |
      増産が追いつく: ダイヘンの能力増強の節目（2027年度末 1.5倍・2029年度末 2.0倍）
      前後で、E1 各社の納期正常化・受注残の減少・営業利益率の頭打ちが観測される
    observable: "各社の四半期決算の受注残・適時開示・業界紙の納期報道"
  - id: F2
    text: "OCCTO の DC 需要見通しが下方修正され、2034年度の想定が現在の半分を下回る（1本目 F3 と共有）"
    observable: "資源エネルギー庁・OCCTO の需要見通し資料"
  - id: F3
    text: |
      規制起因の山の一巡: トップランナー2026対応とPCB処分期限（2027年3月）を過ぎて、
      E1〜E2 の受注が前年割れに転じる（構造需要だと思っていたものが規制特需だった場合）
    observable: "2027年度以降の各社受注高の前年比"
  - id: F4
    text: "海外大手（Schneider・Eaton・Hitachi Energy 等）が国内 DC 向け受変電で大型案件を連続受注する"
    observable: "適時開示・業界報道"

# =============================================================================
# 候補銘柄 — **master.yaml には入れない**（まだ監視対象ではない）
# =============================================================================
#
# 降ろすと決めたときだけ人間の確認を経て登録する。並んでいることは「買い」ではない。
# いずれも E1 仮判定（takes）の乗り物であり、Q1（増産が追いつかない証拠）が
# 埋まるまでは候補のまま。
candidates:
  - code: "6617"
    name: "東光高岳"
    layer: "E1 大形・特高変圧器"
    hypothesis: "東電系。大型変圧器・GIS の専業に近く、E1 の中で最もピュアプレイ。データセンター特需で最高益と報じられる（数字は未確認・TO_VERIFY）"
    status: unscreened
  - code: "6622"
    name: "ダイヘン"
    layer: "E1 大形・特高変圧器"
    hypothesis: "生産能力2倍の投資を自ら発表＝需要の持続に張っている。半導体装置向け（EV充電・プラズマ）も持ち複合的"
    status: unscreened
  - code: "6508"
    name: "明電舎"
    layer: "E1 大形・特高変圧器"
    hypothesis: "FY2026-H1 が売上・営業利益とも過去最高、電力インフラ部門 +23.3%。売上より利益が速い＝1本目 D2 と同じ型（実額は短信で要確認）"
    status: unscreened
  - code: "6641"
    name: "日新電機"
    layer: "E1 大形・特高変圧器"
    hypothesis: "住友電工系の受変電・電力機器。E1 の顔ぶれとして数えたが個社の証拠は未収集"
    status: unscreened

# =============================================================================
# 未解決 — 次に潰す順
# =============================================================================
open_questions:
  - id: Q1
    text: |
      **増産しても追いつかない証拠。** E1 各社の受注残（実額・前年比）と
      生産能力増強計画を並べ、受注残の伸びが能力の伸びを上回り続けているかを
      決算短信の一次数字で確認する。これが埋まるまで E1 の takes は仮判定
    priority: 1
  - id: Q2
    text: |
      **輸出が効くか。** 米国の大型変圧器不足（複数年待ち）の恩恵が国内上場勢に
      来ているか、各社の海外売上比率と海外受注の開示で確認する。
      効くなら国内増産が価格を崩すリスクを輸出が吸収する
    priority: 1
  - id: Q3
    text: |
      **複合企業の中の良い事業をどう扱うか（方法論の未解決）。** E5 の
      三菱重工サーマル（シェア約70%・非上場子会社）のような「層は takes だが
      乗り物が無い」場合に、親会社をセグメント比率つきで候補にする道を作るか、
      潔く見送るか。マスターの判断が要る
    priority: 2
  - id: Q4
    text: |
      **規模と流動性。** E1 候補は中〜大型で、judge の流動性ゲートが想定する
      規模と違う（1本目 Q4 と同じ論点。あちらの結論に相乗りする）
    priority: 2
  - id: Q5
    text: |
      **E6 液冷の再訪トリガー。** 規格・方式の標準化（例: OCP 系の仕様確定）や
      参入企業の撤退・淘汰が始まったら競争構造が読めるようになる。
      それまでは見ない（見に行くと需要予測への賭けになる）
    priority: 3
