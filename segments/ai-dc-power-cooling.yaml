    name: "日新電機"
    reason: |
      **2023年4月27日に上場廃止。** 住友電気工業が TOB（1株1,700円）で完全子会社化した。
      当台帳の候補として挙げた時点で上場状況を確認していなかった、こちらの誤り。
      層の顔ぶれ（産業のプレイヤー）としては引き続き実在するが、**買える対象ではない**。
      この記事群が説いている「良い層と、その儲けを受け取れる会社は別」の実例そのもの
    source: "https://nissin.jp/news/230426/（会社の上場廃止に関するお知らせ・2026-08-31 取得）"
    withdrawn_at: "2026-08-31"

