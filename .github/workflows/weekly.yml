name: weekly

# 実行順（CLAUDE.md「実行順」と一致させること）
#   tests → fetch → fetch_margin → fetch_index → fetch_fundamentals → fetch_tanshin
#         → checks → score → build → notify
#
# **CI では Claude を動かさない。** 判断を伴う作業（レポートの週次追記・出典の裏取り・
# 弱気材料の生成）は Claude Code の週次ルーティンが担当し、結果を commit する。
# CI に OAuth トークンを置かないための構成（fudosan-appraisal も CI では使っていない）。
# ここに残るのは「取得・検査・採点・生成・通知」＝すべて決定論的なコードだけ。
#
# ジョブ間の受け渡しは **commit と push** で行う。artifact だけに置くと
# 週次の記録がリポジトリに残らない（review-findings F-05）。
# 各ジョブの checkout は `ref: ${{ github.ref_name }}` でブランチ先端を取る。
# 既定（トリガー時の SHA）のままだと、前のジョブが push した data/ を
# 見ないまま build してしまう。

# 契機は2つ。**どちらも無人で、人が Actions を操作する場面は無い**
# （fudosan-appraisal の deploy.yml と同じ考え方）。
#
#   push  : main に何か入ったら、テスト → サイト生成 → 公開。取得はしない。
#           週次ルーティンがレポートを直して push すれば、それだけで公開される。
#           **`gh workflow run` を手で叩く運用にしない**（叩き忘れが
#           「公開したつもり」を生む。実際に一度やった）
#   cron  : 週1回、株価・信用残・指数・財務の取得と検査。こちらだけ取得を伴う
#
# workflow_dispatch は非常口として残すだけで、通常の手順には登場させない。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * 5"      # UTC金21:00 = JST土06:00
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  PYTHONIOENCODING: utf-8     # 日本語の標準出力が化けないようにする

jobs:
  # --- 1. テスト。落ちたら以降を一切動かさない ----------------------------
  #
  # 判定ロジック・指標・採点・通知の回帰テスト。ネットワークを使わないので最初に置く。
  # ここで止めれば、壊れたコードで取得・commit・デプロイをしてしまうことがない。
  #
  # ★ここが落ちると取得もデプロイも動かない。つまり「翌週かならず落ちるテスト」は
  #   毎週パイプラインを止める仕掛けと同じである。実データの日付・値・件数を
  #   テストにべた書きしないこと（期待値は tests/realdata.py から引く）。
  #   `tests/test_data_advance.py` が「データが1日進んだ」状況の回帰テスト。
  #
  # 下の glob は `tests/test_*.py` を1本ずつ実行する。**共用ヘルパを
  # `test_` で始まる名前にしない**（テストとして実行され、0件パスで通ってしまう）。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0            # checks.py の append-only 検査が履歴を見る
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: tests
        run: |
          set -e
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "テストが1本も無い"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "=== $f ==="
            python "$f"
          done

  # --- 2. 取得と検査。ここは LLM を通さない ------------------------------
  #
  # **push 契機のときは取得しない**（公開だけしたいので外に出ていく必要がない）。
  # 飛ばし方は **ステップ単位**。data ジョブ自体に if: を付けると
  # needs.data.result が 'skipped' になり publish の if: が false になって、
  # 緑のまま何も公開されない run ができる（「公開されたと誤認」の完全な再現）。
  # checks.py だけは push でも必ず走らせる（壊れた台帳を公開しないため）。
  #
  # score.py も取得と同じく飛ばす。score.py は _date.today() 依存かつ resolved/expired を
  # 凍結するので、push のたびに走らせない（取得前に期限が過ぎた予測を
  # 判定不能で確定させ、下の `git add predictions/` でそのまま commit される）。
  data:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0            # check_append_only が git diff で過去行を見る
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: 株価取得（OHLCV・2ソース照合・追記のみ）
        if: github.event_name != 'push'
        run: python src/fetch.py

      - name: 信用残高の取得
        if: github.event_name != 'push'
        run: python src/fetch_margin.py

      - name: 指数の取得（TOPIX / グロース250）
        if: github.event_name != 'push'
        run: python src/fetch_index.py

      # レポートに書く財務数値を機械抽出し、別サイト2つの一致でだけ採用値にする。
      # 一致しなければ MISMATCH として両値を残す（推測で埋めない・D7）。
      - name: 財務数値の取得（2ソース照合）
        if: github.event_name != 'push'
        run: python src/fetch_fundamentals.py

      # 決算短信PDF（一次情報）。まとめサイト（二次情報）との突き合わせ（D33）は
      # ここで取り込んだ CSV が材料になる。**入っていないと台帳は前回の四半期を
      # 「直近」として出し続ける。** 取得できない週があっても後続は止めない
      # （PDF は TDnet の保持期間・ミラーの都合で落ちることがある）。
      - name: 決算短信の取得（一次情報・PDF）
        if: github.event_name != 'push'
        run: python src/fetch_tanshin.py
        continue-on-error: true

      - name: データ品質検査
        run: python src/checks.py        # FAIL があればここで停止

      # 出典URLの死活。ネットワークを使うので checks 本体とは分けて実行し、
      # **失敗しても data ジョブを止めない**（外部要因でビルドを止めない）。
      # 分けないと `--check-links` が一度も走らず、link_status.csv が増えない。
      - name: 出典URLの死活確認（記録のみ・失敗しても止めない）
        if: github.event_name != 'push'
        run: python src/checks.py --check-links --no-git
        continue-on-error: true

      - name: 予測の機械採点
        if: github.event_name != 'push'
        run: python src/score.py

      - name: commit
        run: |
          set -e
          git config user.name  "kabu-ledger[bot]"
          git config user.email "actions@github.com"
          git add data/ scoring/ predictions/
          if git diff --staged --quiet; then
            echo "差分なし"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # --- ベアケースと裏取りは CI では回さない -------------------------------
  #
  # 以前ここに bear（弱気材料の生成）と verify（出典の再取得による裏取り）を
  # anthropics/claude-code-action で置いていたが、**CI から外した**。
  #
  # 理由: CI に OAuth トークンを置かない。どちらも判断を伴う作業であり、
  # 週次バッチ（Claude Code のルーティン）で回して結果を commit する方式にする
  # （fudosan-appraisal も CI では Claude を使っていない）。
  #
  # ルーティン側が担当する作業:
  #   - reports/{code}.md の週次アップデート追記
  #   - .claude/skills/kabu-ledger-verify/ による出典の裏取り
  #   - bear/{code}.yaml の弱気材料生成
  # 生成物はコミットされるので、次回の publish が拾って台帳に載る。


  # --- 4. サイト生成と公開 ------------------------------------------------
  #
  # build.py は docs/ と scoring/stamps.json を出力する（F4-7）。
  # stamps.json は notify ジョブの入力なので **commit する**。
  # commit しないと notify の checkout に無く、判定変化を検出できない（F-04）。
  #
  # ★ルーティン（裏取り・ベアケース・週次追記）の成否は公開に影響しない。
  #   ルーティンが回らなかった週も、build.py が data/verification/ を読んで
  #   「未検証」「裏が取れなかった記述」をページに出すので、読み手は誤らない
  #   （印を消す方法は用意していない）。bear/ が無ければ notify.py が
  #   Issue 本文に「未生成」と書く。下流はどちらも成立する。
  # publish が commit する push は GITHUB_TOKEN なので、**この workflow を再起動しない**
  # （GitHub のループ防止仕様）。push 契機を足しても無限ループにならないのはこのため。
  publish:
    needs: data
    if: ${{ always() && needs.data.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # data とルーティンが push した内容を取り込む
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: サイト生成（生成時刻を埋め込まない・差分が週次の変化そのもの）
        run: python src/build.py

      - name: commit（docs/ と判定スタンプ）
        run: |
          set -e
          git config user.name  "kabu-ledger[bot]"
          git config user.email "actions@github.com"
          git add docs/ scoring/stamps.json
          if git diff --staged --quiet; then
            echo "台帳の差分なし"
          else
            git commit -m "site: $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4

  # --- 5. 判定が変わった銘柄だけ Issue 起票。何もなければ0件 --------------
  #
  # last_stamps.json を commit しないと前回状態が残らず、毎週全銘柄が
  # 「変化」扱いになる。stamps.json が無い場合、notify.py は状態を更新せずに
  # 終了する（F-04）。
  notify:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # publish が push した stamps.json を取り込む
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: 判定変化を検出して起票
        run: python src/notify.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit（前回スタンプ）
        if: always()                     # 起票が一部失敗しても、成功ぶんの状態は残す
        run: |
          set -e
          git config user.name  "kabu-ledger[bot]"
          git config user.email "actions@github.com"
          # 初回や stamps.json 不在の週は last_stamps.json が作られない。
          # `[ -f x ] && git add x` は set -e の下で「ファイル無し＝失敗」になるので使わない
          if [ -f scoring/last_stamps.json ]; then
            git add scoring/last_stamps.json
          fi
          if git diff --staged --quiet; then
            echo "スタンプの差分なし"
          else
            git commit -m "stamps: $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
