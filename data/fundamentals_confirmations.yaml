# 「前期比で桁が飛んでいる（桁・単位の取り違えを疑う）」と検査が言った前期比のうち、
# 確認したものの記録。`data/corporate_actions.yaml`（分割の確認記録）と同じ形。
#
# **source_url の無い記録は「確認していない」のと同じ**で、FAIL のまま残る。
# 記録しても FAIL が消えるのではなく WARN に落ちる。「なぜ通したか」は
# 毎回の検査結果に出続ける（黙って通す方法は用意しない）。
#
# 検査の疑いは「会社の数字が本当か」ではなく**「うちのパースが桁か単位を
# 読み違えたのではないか」**なので、証拠は取得元そのもの。運営の異なる2つが
# 別々の単位表記で一致していれば、単位の読み違いなら食い違うはずの箇所が
# 食い違っていない、という形で疑いが晴れる。
#
# キーは (code, metric, from_period, to_period)。period は
# data/fundamentals/{code}.csv の period 列そのまま（FY2017-09 等）。

confirmations:
  - code: "5137"
    metric: revenue
    from_period: "FY2017-09"
    to_period: "FY2018-09"
    reason: >-
      取り違えではない。株探（8 → 97・百万円表記）と IR BANK（0.09億 → 0.98億・億円表記）が
      運営の異なる2媒体・別々の単位表記で一致しており、単位の読み違いなら両者が食い違う。
      売上系列も 8 → 97 → 191 → 398 → 827 → 1254 → 1709 → 2173 → 2878 と以降なめらかで、
      単位事故なら生じる「元の桁への揺り戻し」が無い。創業期（2013年設立・2022年上場）の
      実成長と読める。**確認できていないこと**: FY2017-09 の8百万円は一次情報で裏を取れていない。
      上場後の有価証券報告書の「主要な経営指標等の推移」は5期ぶんで FY2018-09 が最古のため、
      FY2017-09 はどの公表書類の表にも載らない。この行は二次情報2媒体の一致までしか根拠が無い。
    source_url: "https://kabutan.jp/stock/finance?code=5137"
    source_url_secondary: "https://irbank.net/E38205/results"
    confirmed_at: "2026-08-30"
