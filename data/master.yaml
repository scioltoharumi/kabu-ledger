  name: "成長株0606"
  captured_at: "2026-08-21T12:48:00+09:00"
  source: "楽天証券アプリ / 検索結果 / 15分ディレイ"
  hit_count: 3
  note: "スクリーニング条件そのものは Notion 側。条件変更時は screening.revision を上げる"
