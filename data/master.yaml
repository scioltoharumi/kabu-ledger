liquidity_gate:
  min_avg_turnover_20d_jpy: 30000000   # 20日平均売買代金 3,000万円
  on_fail: "見送(流動性)"
  rationale: "時価総額十数億規模では、判定が正しくても建てられず降りられない"

# 6か月2倍ライン（信用の期限が6か月であることに由来・鉄則）
# キー = 買付からの経過月数（完了月数）、値 = 到達すべき騰落率
target_ladder:
  1: 0.12
  2: 0.26
  3: 0.41
  4: 0.59
  5: 0.78
  6: 1.00

# 逆指値ライン: 買値 × (1 + stop_loss_pct)。鉄則「上手くなるまでは買値の-10%で逆指値を必ずかける」
stop_loss_pct: -0.10

# judge の閾値の上書き（既定は src/judge.py の DEFAULT_JUDGE）。
judge:
  # 鉄則「週足**中期**移動平均線を見てトレンドが下がっていたら決して買いで入らない」の
  # 「中期」が何週かは投資ルールに書かれていない。
  #   日本の週足チャートの慣行  13週=短期 / 26週=中期 / 52週=長期
  #   鉄則の枠組み              6か月2倍ライン＝信用の期限＝26週
  # 実データ（2026-08-10）では 4073 の結論が 13週(flat) と 26週(down) で反転した。
  # **マスターが確定するまで両方を評価し、どちらかが下向きなら不通過**にする（保守側）。
  # 確定したらこの配列を [13] か [26] の1つにする。
  # TODO(マスター確認): 「週足中期移動平均線」は13週か26週か
  weekly_trend_periods: [13, 26]
