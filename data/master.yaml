# 銘柄マスタ
# 出所: 楽天証券スクリーニング「成長株0606」2026-08-21 12:48 取得（15分ディレイ）
# TO_VERIFY = 未検証。resolve ジョブが二重照合で埋めるまで null 扱い。推測で埋めない。
#
# flags はコードが読む固定語彙。**自由記述を混ぜない**（読まれない情報を置かない）。
#   "制度信用: 買建のみ"  貸借銘柄ではなく売り残が構造的に常に0。judge はこの銘柄で
#                         信用倍率の RATIO_NA を「該当しない」として過熱の材料から外す
#                         （売り残0が取引所ルールの帰結で、需給の情報を持たないため）。
#                         この扱いが無いと、当該銘柄は永久に「様子見(過熱)」から出られない。
#   "時価総額が極小"      表示のみ。判定には使わない

