    sector: TO_VERIFY                 # 出所が1サイトに閉じており二重照合が成立しない（既知）
    # 設備・拠点型で償却負担が重く（1Q減価償却費66.5百万円）、今期が黒字転換の初年度で
    # PER が安定しない。会社自身も EBITDA を KPI に置き、時価総額を EBITDA 倍率で語っている
    # （2027年3月期1Q決算説明資料 p.8・p.11）。**この選択は人間の確認待ち。**
